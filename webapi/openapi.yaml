    # Shapes shared by the pages and the chat operations.
    LiveEvent:
      type: object
      description: >-
        One event of GET /api/events: what changed, never the content.
        Ids are as stored: chat_id is Telegram's chat id (negative for
        groups, the other user's id for private chats), message_id the
        message tables' message_id, file_id the file's id.
      required: [kind]
      properties:
        seq:
          type: integer
          format: int64
          description: >-
            Grows with each event and is the frame's id; compare, do not
            compute with it. Absent on a session event, and on every
            event of a signed-out stream.
        kind:
          type: string
          enum: [hello, resync, session, message.new, message.edited, message.deleted, user.updated, group.updated, file.stored, stats.changed, bot.updated]
          description: The frame's event name. New kinds may be added.
        chat_id:
          type: integer
          format: int64
          description: message.*, file.stored (for message media), group.updated.
        message_id:
          type: integer
          format: int64
          description: message.*, file.stored (for message media).
        user_id:
          type: integer
          format: int64
          description: user.updated.
        file_id:
          type: integer
          format: int64
          description: file.stored; absent on a signed-out stream.
        refetch_interval:
          type: integer
          minimum: 1
          description: >-
            The first resync of a signed-out stream: the least number
            of seconds between two refetches of a chat window the
            client asks for on the stream's events (they are answered
            from a shared cache, WEBAPI_LIVE_PUBLIC_REFETCH_SECS).
        bot_id:
          type: integer
          format: int64
          description: >-
            bot.updated: a bot the viewer may see was added, changed (its
            status, name, enabled state or identity) or removed; at most
            5 seconds late. To admins and superadmins; a member with
            forward refetches its bots itself.
        fields:
          type: array
          items:
            type: string
          description: >-
            user.updated and group.updated, when present: the parts
            that may have changed (users: name, photo, bio, birthday,
            personal_chat; groups: photo, admins). Absent: anything.
        chat_ids:
          type: array
          items:
            type: integer
            format: int64
          description: >-
            stats.changed: the visible chats whose counters moved
            (groups negative, private chats positive).
        user_ids:
          type: array
          items:
            type: integer
            format: int64
          description: stats.changed, the visible senders whose message counts moved.
        more:
          type: boolean
          description: stats.changed, the lists were cut; treat every counter as changed.
        reason:
          type: string
          enum: [revoked, scope_changed]
          description: session, why the stream ends.
    UserSummary:
      type: object
      required: [id, name, username, type, photo]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        username:
          type: string
        type:
          type: string
          enum: [regular, bot, deleted, unknown]
        photo:
          type: [string, 'null']
          description: A /files/<token> URL.
        contact_name:
          type: string
        msg_count:
          type: integer
          description: Full-access viewers only; absent for members.
        is_verified:
          type: boolean
        is_premium:
          type: boolean
        is_scam:
          type: boolean
        is_fake:
          type: boolean
        is_support:
          type: boolean
        language:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    UserFull:
      description: >-
        The user page's profile, for a full-access viewer. The service
        sends every property listed; null is "none".
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [first_name, last_name, bio, phone, usernames, photo_file_id, birthday, personal_chat_id, personal_chat, paid_message_star_count, emoji_status, accent_color_id, profile_accent_color_id, background_custom_emoji_id, profile_background_custom_emoji_id, restriction_reason, has_sensitive_content, restricts_new_chats, is_contact, is_mutual_contact, own_name_known, own_name_checked_at]
          properties:
            first_name:
              type: string
            last_name:
              type: string
            bio:
              type: string
            phone:
              type: string
            usernames:
              type: array
              items:
                $ref: '#/components/schemas/Username'
            photo_file_id:
              type: [integer, 'null']
              format: int64
              description: >-
                The profile photo's file id (photo is its /files/<token>
                URL, the full file), for the files page's preview
                (/files?file=<id>); null without a photo.
            birthday:
              description: Null when not shared.
              oneOf:
                - type: 'null'
                - type: object
                  required: [day, month, year]
                  properties:
                    day:
                      type: integer
                      minimum: 1
                      maximum: 31
                    month:
                      type: integer
                      minimum: 1
                      maximum: 12
                    year:
                      type: [integer, 'null']
                      description: Null when the year is hidden.
            personal_chat_id:
              type: [integer, 'null']
              format: int64
              description: The channel shown on the profile; null for none.
            personal_chat:
              description: >-
                That channel, when the logger knows it and the viewer
                sees it (its page is /groups/{id}); null otherwise.
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/GroupSummary'
            paid_message_star_count:
              type: integer
              format: int64
              description: Telegram Stars a message to the user costs; 0 for none.
            emoji_status:
              description: Null for none.
              oneOf:
                - type: 'null'
                - type: object
                  required: [custom_emoji_id, expires_at]
                  properties:
                    custom_emoji_id:
                      type: string
                      description: A 64-bit id, as a string.
                    expires_at:
                      type: [string, 'null']
                      description: Null when it does not expire.
            accent_color_id:
              type: integer
              description: The name's accent colour (Telegram's id; 0 is the default).
            profile_accent_color_id:
              type: [integer, 'null']
              description: The profile's accent colour; null for none.
            background_custom_emoji_id:
              type: [string, 'null']
              description: The name background's custom emoji (64-bit id as a string); null for none.
            profile_background_custom_emoji_id:
              type: [string, 'null']
              description: The profile background's custom emoji; null for none.
            restriction_reason:
              type: string
              description: Why Telegram restricts the user; empty for none.
            has_sensitive_content:
              type: boolean
            restricts_new_chats:
              type: boolean
              description: Only contacts and Premium users may start a chat.
            is_contact:
              type: boolean
              description: A contact of the logging account (contact_name is the name it saved).
            is_mutual_contact:
              type: boolean
            own_name_known:
              type: boolean
              description: >-
                False when no own name was ever seen and name is the
                contact name standing in for it.
            own_name_checked_at:
              type: [string, 'null']
              description: >-
                When "Look up real name" last read the own name (RFC
                3339); null for never.
    Username:
      type: object
      required: [username, active, kind, collectible]
      properties:
        username:
          type: string
        active:
          type: boolean
        kind:
          type: string
          enum: [active, disabled]
          description: Always sent by the service; active is kind active.
        collectible:
          type: boolean
          description: Bought on fragment.com; always sent by the service.
    GroupSummary:
      type: object
      required: [id, title, username, type, photo]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        username:
          type: string
        type:
          type: string
          enum: [supergroup, basic_group, channel]
        photo:
          type: [string, 'null']
        msg_count:
          type: integer
        exposed:
          type: boolean
        member_count:
          type: [integer, 'null']
          description: >-
            Telegram's member count of the group, as the daemon last
            stored it (from the group's full info and its updates);
            null before it has one. Every viewer of the group gets it.
            Always sent by the service; required where the schemas
            that extend this one say so.
        member_count_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When the daemon stored member_count; null with it. Always
            sent by the service.
    GroupCounted:
      allOf:
        - $ref: '#/components/schemas/GroupSummary'
        - type: object
          required: [msg_count]
          properties:
            msg_count:
              type: integer
    GroupFull:
      allOf:
        - $ref: '#/components/schemas/GroupSummary'
        - type: object
          required: [description, members, msg_count, admin_count, created_at, updated_at, usernames, photo_file_id, member_count, member_count_at]
          properties:
            usernames:
              type: array
              description: >-
                Every current username, active ones first, with kind and
                collectible (username is the first active one). Always
                sent by the service.
              items:
                $ref: '#/components/schemas/Username'
            photo_file_id:
              type: [integer, 'null']
              format: int64
              description: >-
                The photo's file id, for the files page's preview; null
                without a photo. Always sent by the service.
            description:
              type: string
            members:
              type: integer
              description: >-
                How many people the archive has seen in the group: the
                distinct users who sent a message there and its
                administrators, as in the chat page's header. Telegram's
                own count is member_count.
            msg_count:
              type: integer
            admin_count:
              type: integer
            created_at:
              type: string
            updated_at:
              type: string
    GroupAdmin:
      type: object
      required: [user, status, custom_title, is_anonymous, perms, since]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        status:
          type: string
          enum: [creator, administrator]
        custom_title:
          type: string
        is_anonymous:
          type: boolean
        perms:
          type: array
          items:
            type: string
        since:
          type: string
    HistoryEntry:
      type: object
      required: [kind, at]
      properties:
        kind:
          type: string
          enum: [name, username, bio, phone, photo]
        at:
          type: string
        detail:
          type: string
          description: The name, username, bio or phone number; absent when empty.
        action:
          type: string
          description: A username event's.
          enum: [added, removed, reordered, kind_changed, collectible_changed]
        username_kind:
          type: string
          description: A username event's kind after it; absent for a removal.
          enum: [active, disabled]
        collectible:
          type: boolean
          description: A username event's; present (true) only for a collectible username.
        photo:
          type: [string, 'null']
          description: A photo change's picture, a /files/<token> URL of the full file.
        removed:
          type: boolean
          description: A photo change that removed the photo.
        photo_id:
          type: integer
          format: int64
          description: >-
            A photo change's photo: the id of its item in
            GET /api/users/{id}/photos, the newest change to the same
            file (the list holds each file once). Absent for a removal
            and for the other kinds.
    UserPhotos:
      type: object
      description: >-
        A user's profile photos (getUserPhotos), or a group's photos
        (getGroupPhotos): the current one first, then the recorded ones
        newest first, each file once.
      required: [items, current_id]
      properties:
        items:
          type: array
          description: >-
            The current photo first, then newest first, at most 500.
          items:
            $ref: '#/components/schemas/UserPhoto'
        current_id:
          type: [integer, 'null']
          format: int64
          description: >-
            The id of the item that is the user's or group's current
            photo, always the first item's (possibly 0), or null when
            there is no current photo.
    UserPhoto:
      type: object
      required: [id, at, url, file_id, video_url, video_file_id]
      properties:
        id:
          type: integer
          format: int64
          description: >-
            The newest history row with the photo's file; the photo_id
            of its photo changes in the user's or group's history. 0
            for the current photo when the history has no row for its
            file.
        at:
          type: string
          description: >-
            The time the archive has for the photo, RFC 3339: its
            history row's date (for a row taken from Telegram's photo
            list, when the photo became current; for an older row, when
            the logger saw the change), or for item 0 when the logger
            recorded its file. Not always when the photo was set.
        url:
          type: [string, 'null']
          description: >-
            The picture, a /files/<token> URL of the full file, whether
            its bytes are stored or not: opening it fetches a file the
            store does not hold from Telegram. null when the file
            cannot be served (not stored, and the viewer may not have
            files fetched or the daemon is not configured).
        file_id:
          type: [integer, 'null']
          format: int64
          description: The picture's file id (telegram_files).
        video_url:
          type: [string, 'null']
          description: >-
            The photo's video, for an animated photo: a /files/<token>
            URL of its MPEG-4 file, served as url is (opening it
            fetches a video the store does not hold from Telegram,
            when the viewer may have it fetched). url stays the still,
            the video's poster. null when the photo has no video
            recorded (a still photo, or one recorded before the
            archive kept videos) or when the video cannot be served.
        video_file_id:
          type: [integer, 'null']
          format: int64
          description: >-
            The video's file id (telegram_files), or null when the
            photo has no video recorded.
    UserHistoryPage:
      type: object
      required: [entries, next]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'
        next:
          type: [string, 'null']
          description: The next page's cursor (before=); null at the end.
    GroupHistoryPage:
      type: object
      required: [entries, next]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/GroupHistoryEntry'
        next:
          type: [string, 'null']
          description: The next page's cursor (before=); null at the end.
    GroupHistoryEntry:
      type: object
      required: [kind, at]
      properties:
        kind:
          type: string
          enum: [title, description, username, photo, admin]
        at:
          type: string
        detail:
          type: string
        action:
          type: string
          description: >-
            A username event's (added, removed, reordered, kind_changed,
            collectible_changed) or an admin change's (added, removed,
            updated).
        username_kind:
          type: string
          description: A username event's kind after it; absent for a removal.
          enum: [active, disabled]
        collectible:
          type: boolean
          description: A username event's; present (true) only for a collectible username.
        status:
          type: string
          description: An admin change's status at the event.
          enum: [creator, administrator]
        photo:
          type: [string, 'null']
        removed:
          type: boolean
        photo_id:
          type: integer
          format: int64
          description: >-
            A photo change's photo: the id of its item in
            GET /api/groups/{id}/photos, the newest change to the same
            file. Absent for a removal and for the other kinds.
        user:
          $ref: '#/components/schemas/UserSummary'
    MessageScope:
      type: string
      enum: [group, private]
    ContentType:
      type: string
      description: >-
        A message's kind, as the logger stores it (daemon migration
        000034 appended video_note to unsupported; content_type of
        docs/design/message-types.md section 4.1). unknown is a TDLib
        class newer than the daemon's code, or a row logged before the
        daemon knew the kind. New values may be appended.
      enum:
        - text
        - photo
        - video
        - document
        - audio
        - voice
        - sticker
        - animation
        - service
        - unknown
        - video_note
        - location
        - venue
        - contact
        - dice
        - game
        - poll
        - checklist
        - story
        - paid_media
        - invoice
        - giveaway
        - call
        - rich
        - widget
        - expired
        - unsupported
    ChatRef:
      type: object
      required: [id, title, kind, photo]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        kind:
          type: string
          enum: [group, user]
        photo:
          type: [string, 'null']
    Entities:
      type: object
      required: [users, groups]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupSummary'
    PickItem:
      type: object
      description: A chat as the pickers show it; sub is a short second line.
      required: [id, title, kind]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        kind:
          type: string
          enum: [group, user]
        sub:
          type: string
        photo:
          type: [string, 'null']
    ChatSearchPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PickItem'
        next_cursor:
          type: [string, 'null']
    SearchField:
      type: object
      description: A searchable field of the registry.
      required: [key, label, type, sortable, operators]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [text, int, bool, datetime, enum]
        sortable:
          type: boolean
        operators:
          type: array
          items:
            type: string
            enum: ['=', '!=', '<', '>', '<=', '>=', LIKE, NOT LIKE, '%LIKE%', 'NOT %LIKE%', matches, IS NULL, IS NOT NULL, in]
        enum:
          type: string
          description: An enum field's values, comma-separated.
        enum_open:
          type: boolean
          description: >-
            Present (true) for an enum whose list is the known values
            only (service_type, tdlib_type of the message entities): a
            value it does not list is taken too.
        needs_chat:
          type: boolean
          description: >-
            Present (true) for a field without an index of its own
            (tdlib_type, service_type of the message entities): a
            search may use it only beside a `chat_id =` condition in a
            chain whose connectors are all AND, else it is refused
            (bad_search).
    SearchCol:
      type: object
      description: >-
        A displayed column: its render type, and the field key a click
        on its header sorts by ("" for none).
      required: [key, label, type, sort]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [photo, filethumb, id, name, username, bool, int, datetime, text, longtext, party, fileid, hash]
        sort:
          type: string
    SearchParty:
      type: object
      description: A message row's linked avatar and name; strings HTML-escaped.
      required: [id, kind, name, photo, username]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [user, group, self, none]
        name:
          type: string
        photo:
          type: string
          description: A /files/<token> URL, or "".
        username:
          type: string
    SearchAnswer:
      type: object
      required: [fields, cols, rows, total, total_exact, limit, offset, max_offset, sort, order]
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SearchField'
        cols:
          type: array
          items:
            $ref: '#/components/schemas/SearchCol'
        rows:
          type: array
          description: >-
            One array per row, aligned to cols: id cells are numbers,
            bool cells booleans, party cells SearchParty objects, every
            other cell a string, already HTML-escaped.
          items:
            type: array
            items:
              oneOf:
                - type: string
                - type: integer
                  format: int64
                - type: boolean
                - $ref: '#/components/schemas/SearchParty'
        total:
          type: integer
          format: int64
        total_exact:
          type: boolean
          description: >-
            false when total is an estimate: the table's row estimate
            for a viewer who sees the whole table and gave no
            condition, or, when counting ran out of time, what the page
            proves (offset plus its rows, plus one when it is full).
        limit:
          type: integer
        offset:
          type: integer
        max_offset:
          type: integer
          description: The deepest offset a request can reach.
        sort:
          type: string
          description: The field key sorted by; "" for the default or relevance.
        order:
          type: string
          enum: [asc, desc]
        debug:
          $ref: '#/components/schemas/SearchDebug'
        backend:
          $ref: '#/components/schemas/SearchBackend'
        highlights:
          type: array
          description: >-
            With highlight=1 and the engine answering: per row, aligned
            to rows, up to three fragments of its full-text field (a
            message's text, a user's bio, a group's description) with
            the matched words in <mark>...</mark>, HTML-escaped
            otherwise; empty for a row without a match there and for
            service messages.
          items:
            type: array
            items:
              type: string
        facets:
          type: array
          description: >-
            With facets=1 and the engine answering the whole search:
            the chats with the most hits, busiest first, at most ten,
            within the request scope.
          items:
            $ref: '#/components/schemas/SearchFacet'
    SearchBackend:
      type: object
      description: >-
        Which backend answered, present only with a search engine
        configured.
      required: [used]
      properties:
        used:
          type: string
          enum: [engine, mysql]
        fallback:
          type: string
          description: >-
            Why MySQL answered a search with full-text conditions:
            asked (engine=mysql), unavailable (the engine fails or is
            down), timeout (it took too long), behind (the index is
            behind the archive), too_many_hits (a condition matches
            more rows than can be listed). Absent when the engine
            answered or there was nothing for it to answer.
          enum: [asked, unavailable, timeout, behind, too_many_hits]
        ignored:
          type: array
          description: The options asked for that the answer does not give.
          items:
            type: string
            enum: [fuzzy, highlight, facets]
    SearchFacet:
      type: object
      required: [chat_id, name, count]
      properties:
        chat_id:
          type: integer
          format: int64
        name:
          type: string
          description: The group's title or the other side's name, HTML-escaped.
        count:
          type: integer
          format: int64
    SearchCapabilities:
      type: object
      required: [engine, entities]
      properties:
        engine:
          type: [string, 'null']
          description: The engine's kind (opensearch), null without one.
        entities:
          type: object
          description: By entity name; empty without an engine.
          additionalProperties:
            $ref: '#/components/schemas/SearchEngineEntity'
    SearchEngineEntity:
      type: object
      required: [fields, options, available, fallback]
      properties:
        fields:
          type: array
          description: >-
            The full-text fields the engine answers: text for the
            message entities, bio for users, description for groups.
          items:
            type: string
        options:
          type: array
          description: >-
            What the engine offers for them: phrase ("a b"), proximity
            ("a b" @N), prefix (word*), fuzzy (word~ and fuzzy=1),
            highlight and, for the message entities only, facets.
          items:
            type: string
            enum: [phrase, proximity, prefix, fuzzy, highlight, facets]
        available:
          type: boolean
        fallback:
          type: [string, 'null']
          description: >-
            Why searches go to MySQL now (unavailable, behind), null
            while available.
    SearchDebug:
      type: object
      description: The page query, the count, their values and the plan; HTML-escaped.
      required: [sql, count_sql, bind, explain]
      properties:
        sql:
          type: string
        count_sql:
          type: string
        bind:
          type: array
          items:
            type: string
        explain:
          type: object
          required: [columns, rows]
          properties:
            columns:
              type: array
              items:
                type: string
            rows:
              type: array
              items:
                type: array
                items:
                  type: string
    FileRow:
      type: object
      required: [id, file_type, name, ext, size, hits, stored, created_at, tg_file_id, url, thumb, chat, sender, message]
      properties:
        id:
          type: integer
          format: int64
        file_type:
          type: string
          enum: [photo, video, document, audio, voice, sticker, animation, video_note, unknown]
          description: >-
            telegram_files.file_type, but for a video's still thumbnail
            (file_type thumbnail, filtered as such), which is answered
            as photo: it is a picture like one.
        name:
          type: string
        ext:
          type: string
        render:
          $ref: '#/components/schemas/MediaRender'
          description: >-
            How the file renders, as ChatMedia's render: by file_type
            (a sticker by its extension), and a document by its
            extension. Always sent; optional in this description.
        size:
          type: integer
          format: int64
        hits:
          type: integer
        stored:
          type: boolean
        fetchable:
          type: boolean
          description: >-
            The bytes are not stored and the viewer may have them
            fetched from Telegram, by the rule of ChatMedia's
            fetchable (web/docs/media.md): opening url fetches a small
            file through the daemon, and fetch fetches any. Always
            sent; optional in this description, as ChatMedia's is.
        fetch:
          type: [string, 'null']
          description: >-
            As ChatMedia's fetch: the fetchFile path when fetchable is
            true, else null. Always sent; optional in this description.
        created_at:
          type: string
          description: First seen.
        accessed_at:
          type: string
          description: >-
            Last access: ingested again or served, what eviction goes
            by. Always sent; optional in this description.
        duration:
          type: integer
          description: >-
            A video's, audio file's, voice note's or video note's
            length in seconds, from the stored detail (content_extra)
            of the message the row names; absent when that message has
            none, or when the file came in no message the viewer sees.
        tg_file_id:
          type: string
        sha256:
          type: [string, 'null']
          description: >-
            The bytes' SHA-256, 64 lowercase hex digits; null for a
            row recorded without its bytes. Always sent; optional in
            this description.
        url:
          type: [string, 'null']
          description: >-
            The /files/<token> URL when the bytes are stored, or
            fetchable and under the store's per-file cap, else null (a
            big unstored file, fetched through fetch; an unstored file
            the viewer may not have fetched; or fetching from Telegram
            is off).
        thumb:
          type: [string, 'null']
          description: >-
            An image to show for the file, a /files/<token> URL of
            stored bytes only, so a list never fetches: the same URL
            for a stored photo, .webp sticker or thumbnail; for a
            video, animation, video note or video (.webm) sticker,
            stored or not, the stored cover, else the stored Telegram
            thumbnail, of a message the viewer sees that carried it;
            without one, the stored picture a message the viewer sees
            shows it with where it plays a role there: a rich block's
            thumbnail at its position, an animated chat photo's still
            photo, a video link preview's cover, else the preview's
            photo (never the video's own URL); else null. An animated
            (.tgs) sticker has none.
        minithumb:
          type: string
          description: >-
            A video's, animation's, video note's or video sticker's
            blurred preview (TDLib's minithumbnail) as a data: URL (a
            JPEG), when a message the viewer sees that carried it
            records one; absent otherwise. For a placeholder while
            thumb is null or loading.
        chat:
          description: >-
            The chat of the first message the viewer sees that carried
            the file as its own, else of the first that carried it in
            a role (see role); null when there is none (a profile or
            group photo, or a message the viewer may not see).
          oneOf:
            - type: object
              required: [id, title, kind]
              properties:
                id:
                  type: integer
                  format: int64
                title:
                  type: string
                kind:
                  type: string
                  enum: [group, user]
            - type: 'null'
        sender:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        message:
          description: That message; null exactly when chat is null.
          oneOf:
            - $ref: '#/components/schemas/MessageRef'
            - type: 'null'
        role:
          description: >-
            What the file is to that message when it is not the
            message's own file: a video's cover, a link preview's
            picture. Null when it is the message's own file, and when
            message is null. A file that is some message's own file
            names that message and has null here, even when it plays
            a role in another (the role filter still finds it). Always
            sent; optional in this description.
          oneOf:
            - $ref: '#/components/schemas/FileRoleRef'
            - type: 'null'
    FileRoleRef:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/FileRole'
        message_kind:
          type: string
          description: >-
            The content kind (ContentType) of the message the file
            plays the role in. Always sent; optional in this
            description.
    FileRole:
      type: string
      enum: [cover, live_video, paid, preview, poll, game, invoice, chat_photo, thumbnail, rich, gift, background, preview_media, link_preview]
      description: >-
        A role a file plays in a message beside its own file:
        telegram_message_files.role as stored (docs/design/
        message-types.md section 4.3): cover a video's cover,
        live_video a live photo's video, paid an item of paid media,
        poll the media of a poll or of its options, game a game's
        photo or animation, invoice an invoice's photo, chat_photo the
        new photo of a chat photo change, thumbnail a video's still
        thumbnail, rich the media of a rich message, gift a gift's
        sticker, background a chat background's document,
        preview_media a link preview's video, animation or audio, and
        preview, reserved and written by nothing yet. And
        link_preview: a link preview's picture
        (telegram_link_previews.photo_file_id).
    IdName:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    MessageRef:
      type: object
      required: [scope, id]
      properties:
        scope:
          $ref: '#/components/schemas/MessageScope'
        id:
          type: integer
          format: int64
    MessageRow:
      type: object
      required: [id, scope, message_id, date, chat, sender, content_type, snippet, forwarded, edited, deleted_at]
      properties:
        id:
          type: integer
          format: int64
        scope:
          $ref: '#/components/schemas/MessageScope'
        message_id:
          type: integer
          format: int64
        date:
          type: string
        chat:
          $ref: '#/components/schemas/ChatRef'
        sender:
          description: null for messages the logging account sent.
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        content_type:
          $ref: '#/components/schemas/ContentType'
        snippet:
          type: string
        forwarded:
          type: [string, 'null']
        edited:
          type: boolean
        deleted_at:
          type: [string, 'null']
        deleted_on_recheck:
          type: boolean
          description: >-
            Present and true when the deletion was found by a recheck
            against Telegram (the message was gone from the stretch
            Telegram returned) rather than seen as it happened; then
            deleted_at is when the recheck found it. Absent otherwise.
        service_type:
          type: [string, 'null']
          description: >-
            A service message's action (chat_add_members, pin_message,
            ...; docs/design/message-types.md section 4.2.3), as
            MessageExtra.service_type gives it, so a list can label the
            row; null for every other row. Always sent by the message
            lists; optional for the message page, which gives it as
            MessageExtra does.
    Edit:
      type: object
      description: >-
        A version of a message before an edit, from `at` until the next
        version (or the message as it is).
      required: [at, text, entities, detail]
      properties:
        at:
          type: string
        text:
          type: string
        entities:
          type: array
          description: The version's formatting; [] for plain text.
          items:
            $ref: '#/components/schemas/TextEntity'
        content_type:
          $ref: '#/components/schemas/ContentType'
        media:
          description: The version's media, when it had a file.
          $ref: '#/components/schemas/ChatMedia'
        detail:
          description: >-
            The version's detail, by its content_type, from the edit
            row's own content_extra (the edit tables have it since
            daemon migration 000034), as MessageKinds.detail is the
            message's: a live location's position at that time, a
            checklist's tasks then. A live location's live.updates
            counts the versions before this one. Null where the
            message's would be, and for every version of a poll: the
            poll tables keep only the latest results, so a poll's
            versions keep only their text. A version shows none of the
            message's other files (a game's or an invoice's photo, paid
            media's items), which are the message's as it is now.
          oneOf:
            - $ref: '#/components/schemas/MessageDetail'
            - type: 'null'
    TextEntity:
      type: object
      description: >-
        One piece of Telegram's formatting of a text, as the daemon
        stores it (web/docs/message-kinds.md, "Text formatting").
        offset and length are in UTF-16 code units of the text, as
        Telegram counts them (a JavaScript string's indices). type is
        the TDLib entity type in snake_case: url, text_url, mention,
        mention_name, hashtag, cashtag, bot_command, email,
        phone_number, bank_card_number, bold, italic, underline,
        strikethrough, spoiler, code, pre, pre_code, block_quote,
        expandable_block_quote, custom_emoji, media_timestamp; types
        the daemon does not know are stored as unknown, and any
        other value is passed through, so a client shows the text of
        an entity it does not know as plain text. Entities may nest
        (bold inside a link) and touch; they do not cross.
      required: [offset, length, type]
      properties:
        offset:
          type: integer
          minimum: 0
        length:
          type: integer
          minimum: 0
        type:
          type: string
        url:
          type: string
          description: A text_url's target, as stored (not checked).
        user_id:
          type: [integer, 'null']
          format: int64
          description: >-
            mention_name: the user mentioned, null when the viewer may
            not see that user. mention (@username): the user holding
            that username now, present only when the archive knows
            one and the viewer may see that user. Absent for other
            types.
        language:
          type: string
          description: A pre_code block's language; may be empty.
        custom_emoji_id:
          type: string
          description: >-
            A custom_emoji's id, as a string (it does not fit a
            double).
        custom_emoji:
          description: >-
            Present exactly when custom_emoji_id is: the sticker behind
            it, or null while the archive does not know it (the
            entity's text, its fallback emoji, stands in).
          oneOf:
            - $ref: '#/components/schemas/CustomEmoji'
            - type: 'null'
        media_timestamp:
          type: integer
          description: >-
            A media_timestamp's offset into the message's media, in
            seconds, when stored; the daemon does not store it yet,
            so a client reads it from the entity's text (h:mm:ss).
    ForwardOrigin:
      type: object
      description: >-
        Where a forwarded message came from (the fwd_info row). name is
        the sender's or chat's name as `forward` shows it; the ids are
        present when recorded, for links to /users/{user_id} and
        /groups/{chat_id}.
      required: [type, name]
      properties:
        type:
          type: string
          enum: [user, hidden_user, chat, channel]
        name:
          type: string
        user_id:
          type: integer
          format: int64
        chat_id:
          type: integer
          format: int64
        message_id:
          type: integer
          format: int64
          description: The original message's id in chat_id (a channel post).
        date:
          type: string
          description: When the original was sent.
    MessageExtra:
      type: object
      description: >-
        Fields ChatMessage and MessageFull share. Absent when they do
        not apply.
      properties:
        sender_chat:
          description: >-
            The chat the message was posted as (a channel, a group's
            anonymous admin), which `sender` also shows like a user
            with the chat's id; link it to /groups/{id}.
          $ref: '#/components/schemas/GroupSummary'
        forward_from:
          $ref: '#/components/schemas/ForwardOrigin'
        author_signature:
          type: string
          description: The author's signature of a channel post.
        is_channel_post:
          type: boolean
          description: Present (true) for a channel post.
        service_type:
          type: string
          description: >-
            A service message's action (chat_add_members, pin_message,
            ...; docs/design/message-types.md section 4.2.3), shown
            when its text is empty, as the Drogon chat view does.
        tdlib_type:
          type: string
          description: >-
            The exact TDLib class (messageVideoNote, messageStakeDice,
            ...), recorded for rows logged since daemon migration
            000034; it tells apart classes that share a content_type,
            and names a class newer than the daemon's code (unknown).
    MediaRender:
      type: string
      enum: [image, video, animation, lottie, audio, pdf, text, file]
      description: >-
        How a file renders (Drogon's mediaRender, and a document's
        extension): an image (photos, .webp stickers), a video (videos,
        round video notes), an animation that loops muted without
        controls (GIFs, .webm stickers), a Lottie animation (.tgs
        stickers), audio (music and voice notes), or a file link. A
        document (sent as a file) renders by its extension, lower
        case: image for jpg, jpeg, png, gif, webp, avif, bmp, ico,
        apng and svg (svg only through an img element); video for mp4,
        m4v, webm, mov and ogv; audio for mp3, m4a, aac, ogg, oga,
        opus, wav and flac; pdf for pdf (opened in a new tab, not
        embedded); text for txt, log, md, csv, tsv, json, xml, yaml,
        yml, toml, ini, conf, cfg, sh, py, c, h, cpp, hpp, go, rs, js,
        ts, java, kt, sql, diff, patch, html and htm (shown as source
        text, never rendered, at most its first 512 KiB); any other
        extension is a file. /files/<token> serves a document by the
        same rule (web/docs/media.md, "Documents").
    MediaDetail:
      type: object
      description: >-
        What a message's media is beyond its file. Rows logged since
        daemon migration 000034 carry it in content_extra
        (docs/design/message-types.md section 4.2.1); older rows have
        render, ext and a sticker's format from the content type and
        the file, as the Drogon chat view reads them, and none of the
        others. Each key is absent when unknown.
      properties:
        render:
          $ref: '#/components/schemas/MediaRender'
        ext:
          type: string
          description: The file's extension, without the dot.
        format:
          type: string
          enum: [webp, webm, tgs]
          description: >-
            A sticker's format: content_extra's, else the file's
            extension. Stickers only.
        mime:
          type: string
        w:
          type: integer
          description: Width in pixels (a video note's diameter).
        h:
          type: integer
          description: Height in pixels.
        duration:
          type: integer
          description: Length in seconds (video, animation, audio, voice).
        emoji:
          type: string
          description: A sticker's emoji.
        wave:
          type: array
          description: >-
            A voice note's (or video note's) waveform as Telegram
            encodes it, decoded: one 5-bit value per bar, usually 100
            bars.
          items:
            type: integer
            minimum: 0
            maximum: 31
        title:
          type: string
          description: An audio file's title.
        performer:
          type: string
          description: An audio file's performer.
        minithumb:
          type: string
          description: >-
            TDLib's tiny blurred preview as a data: URL (a JPEG), shown
            even when the file is not stored.
        poster:
          type: string
          description: >-
            The picture a video, animation, video note or video (.webm)
            sticker shows before it plays, a /files/<token> URL: its
            cover photo (telegram_message_files, role cover) when
            stored, else the still thumbnail Telegram sent with it
            (role thumbnail) when stored, else its cover when it may
            be fetched. Absent when there is none; minithumb then
            stays the placeholder.
        round:
          type: boolean
          description: >-
            Present (true) for a video note, which Telegram shows as a
            round video (content_type video_note).
    MessageKinds:
      type: object
      description: >-
        What ChatMessage and MessageFull show of a message beyond its
        text and media (docs/design/message-types.md sections 4.2 to
        4.7): the kind's structured detail, a service message's action
        and the people and chats it names, its forum topic, and the
        latest interaction totals. Rows logged before daemon migration
        000034 have none of the detail: detail is null and service has
        no refs, so they render as before. Every user and chat named
        is resolved through the request scope, by the same rules as
        the senders: one the viewer may not see is left out (null, or
        absent from its list), never named.
      required: [detail, service, topic_id, pinned, views, forwards, replies, reactions, effect_id, effect]
      properties:
        detail:
          description: >-
            The kind's detail, by content_type (its kind); null for
            text, the media kinds (photo, video, video_note, document,
            audio, voice, sticker, animation), service, unknown, rows
            without content_extra, and a poll whose poll was never
            stored.
          oneOf:
            - $ref: '#/components/schemas/MessageDetail'
            - type: 'null'
        service:
          description: A service message's action; null for every other kind.
          oneOf:
            - $ref: '#/components/schemas/ServiceInfo'
            - type: 'null'
        topic_id:
          type: [integer, 'null']
          format: int64
          description: >-
            The forum topic of a group message (ChatProps.topics), null
            outside forums and for rows logged before the daemon
            recorded topics.
        pinned:
          type: boolean
          description: The message is pinned in its chat, as last observed.
        views:
          type: [integer, 'null']
          description: >-
            Latest view count, for a channel post or a message
            forwarded from a channel; null when never observed and for
            every other message, which Telegram counts no views for.
        forwards:
          type: [integer, 'null']
          description: >-
            Latest forward count, under the same rule as views.
        replies:
          type: [integer, 'null']
          description: Latest reply (comment) count; null when never observed.
        reactions:
          type: array
          description: >-
            The latest reaction totals, most first as Telegram orders
            them; empty when there are none or none were observed.
          items:
            $ref: '#/components/schemas/Reaction'
        effect_id:
          type: [string, 'null']
          description: >-
            The message effect Telegram showed when the message was
            sent (meta.effect_id), as a string; null for none.
        effect:
          description: >-
            The effect of effect_id, or null: for none, and while the
            archive does not know it.
          oneOf:
            - $ref: '#/components/schemas/MessageEffect'
            - type: 'null'
    CustomEmoji:
      type: object
      description: >-
        The sticker behind a custom emoji id (telegram_custom_emoji),
        resolved for the page (web/docs/message-kinds.md, "Custom
        emoji"). emoji is its fallback emoji. url is the sticker's
        /files/<token> URL in format, null when the archive has no
        file for it, its format is not known, or the viewer may not
        have it fetched; the fallback emoji is shown then.
        needs_repainting: the sticker is drawn in the text colour.
      required: [emoji, format, url, needs_repainting]
      properties:
        emoji:
          type: string
        format:
          type: [string, 'null']
          enum: [webp, tgs, webm, null]
        url:
          type: [string, 'null']
        needs_repainting:
          type: boolean
    MessageEffect:
      type: object
      description: >-
        A message effect (telegram_message_effects), resolved for the
        page as custom emoji are. emoji is the effect's emoji. url is
        a small picture of it in format: its static icon (webp), else
        a premium sticker effect's sticker, else an emoji reaction
        effect's select animation (tgs); null when there is none the
        viewer may have, and the emoji is shown then. The full-screen
        animation is not sent.
      required: [emoji, format, url]
      properties:
        emoji:
          type: string
        format:
          type: [string, 'null']
          enum: [webp, tgs, webm, null]
        url:
          type: [string, 'null']
    Reaction:
      type: object
      description: >-
        One reaction's total: an emoji, a custom emoji (its id, and
        its sticker when known), or the paid star reaction.
      required: [count]
      properties:
        emoji:
          type: string
        custom_emoji_id:
          type: string
        custom_emoji:
          description: >-
            Present exactly when custom_emoji_id is: the sticker behind
            it, or null while the archive does not know it.
          oneOf:
            - $ref: '#/components/schemas/CustomEmoji'
            - type: 'null'
        paid:
          type: boolean
        count:
          type: integer
    ServiceInfo:
      type: object
      description: >-
        A service message's action. The message's text is its
        description for this viewer: rebuilt from the action's stored
        detail to name the users and chats in refs (e.g. "added Dewi
        Kusuma and 2 other members"), and otherwise the logger's own
        description, which names nobody. A user or chat the viewer may
        not see is never named in either.
      required: [type, refs]
      properties:
        type:
          type: string
          description: >-
            The action (service_type: chat_add_members, pin_message,
            ...; docs/design/message-types.md section 4.2.3).
        refs:
          $ref: '#/components/schemas/ServiceRefs'
        parts:
          type: array
          description: >-
            The rebuilt text piece by piece, for links: joined, the
            parts' texts are the message's text. A name is a part that
            points at its user or chat in refs; the rest is plain text.
            Absent where the text is the logger's own, which names
            nobody; draw the text then. A user or chat the viewer may
            not see is never a part, as it is never named.
          items:
            $ref: '#/components/schemas/ServicePart'
        detail:
          description: >-
            What the action's stored detail says beyond its line, by
            kind; absent (or null) where the type has none, nothing of
            it is stored, or what it names the viewer may not see.
          oneOf:
            - $ref: '#/components/schemas/ServiceDetail'
            - type: 'null'
    ServiceDetail:
      description: >-
        A service action's detail beyond its line
        (docs/design/message-types.md section 4.2.3), from content_extra,
        the message's files and the rows it is about. A chat it names
        goes through the request scope as refs do.
      oneOf:
        - $ref: '#/components/schemas/ServicePhotoDetail'
        - $ref: '#/components/schemas/ServiceVideoChatDetail'
        - $ref: '#/components/schemas/ServicePinDetail'
        - $ref: '#/components/schemas/ServicePollOptionDetail'
        - $ref: '#/components/schemas/ServiceTopicDetail'
        - $ref: '#/components/schemas/ServiceCommunityDetail'
        - $ref: '#/components/schemas/ServiceTitleDetail'
        - $ref: '#/components/schemas/ServiceBackgroundDetail'
        - $ref: '#/components/schemas/ServiceGiftDetail'
        - $ref: '#/components/schemas/ServiceThemeDetail'
      discriminator:
        propertyName: kind
        mapping:
          photo: '#/components/schemas/ServicePhotoDetail'
          video_chat: '#/components/schemas/ServiceVideoChatDetail'
          pin: '#/components/schemas/ServicePinDetail'
          poll_option: '#/components/schemas/ServicePollOptionDetail'
          topic: '#/components/schemas/ServiceTopicDetail'
          community: '#/components/schemas/ServiceCommunityDetail'
          title: '#/components/schemas/ServiceTitleDetail'
          background: '#/components/schemas/ServiceBackgroundDetail'
          gift: '#/components/schemas/ServiceGiftDetail'
          theme: '#/components/schemas/ServiceThemeDetail'
    ServicePhotoDetail:
      type: object
      description: >-
        chat_change_photo: the new group photo; suggest_profile_photo:
        the photo suggested. The message's file of role chat_photo at
        position 0; no detail when it is not recorded.
      required: [kind, photo, animation]
      properties:
        kind:
          const: photo
        photo:
          $ref: '#/components/schemas/ChatMedia'
        animation:
          description: >-
            An animated photo's video (an MPEG-4 without sound, render
            animation), the chat_photo file at position 1, with the
            still photo as its poster when that is stored; null for a
            still photo and for rows logged before the video was kept.
          oneOf:
            - $ref: '#/components/schemas/ChatMedia'
            - type: 'null'
    ServiceVideoChatDetail:
      type: object
      description: >-
        video_chat_ended: duration, how long the video chat ran, in
        seconds; video_chat_scheduled: start_date, when it is to
        start. The other is null.
      required: [kind, duration, start_date]
      properties:
        kind:
          const: video_chat
        duration:
          type: [integer, 'null']
          format: int64
          minimum: 0
        start_date:
          type: [string, 'null']
          format: date-time
    ServicePinDetail:
      type: object
      description: >-
        pin_message: the pinned message (refs.message_id) as a one-line
        quote, as a reply quotes its target: the start of its text, or
        its kind summarised ("Story by ...", a poll's question), naming
        only whom the viewer may see. No detail when the archive does
        not have the message, as for pins logged before their message
        id was recorded.
      required: [kind, snippet]
      properties:
        kind:
          const: pin
        snippet:
          type: string
    ServicePollOptionDetail:
      type: object
      description: poll_option_added, poll_option_deleted, the option's text.
      required: [kind, text]
      properties:
        kind:
          const: poll_option
        text:
          type: string
    ServiceTopicDetail:
      type: object
      description: forum_topic_*, the topic the line is about.
      required: [kind, topic]
      properties:
        kind:
          const: topic
        topic:
          $ref: '#/components/schemas/ServiceTopic'
    ServiceTopic:
      type: object
      description: >-
        A forum topic a service line names. id is the message's own
        forum topic (link to ?topic={id}); name, icon_color (an RGB
        colour) and icon_custom_emoji_id are the action's own, else
        the topic's as last seen. Each is null when not known.
      required: [id, name, icon_color, icon_custom_emoji_id, icon_custom_emoji]
      properties:
        id:
          type: [integer, 'null']
          format: int64
        name:
          type: [string, 'null']
        icon_color:
          type: [integer, 'null']
          format: int64
        icon_custom_emoji_id:
          type: [string, 'null']
          description: >-
            The icon's custom emoji, as a string; null for a topic
            drawn with icon_color alone, and when not known.
        icon_custom_emoji:
          description: >-
            The sticker of icon_custom_emoji_id; null for none and
            while the archive does not know it.
          oneOf:
            - $ref: '#/components/schemas/CustomEmoji'
            - type: 'null'
    ServiceCommunityDetail:
      type: object
      description: >-
        chat_added_to_community, chat_join_from_community: the community
        the line names, as the logger records communities
        (docs/design/message-types.md section 4.13), when the archive
        has its name and the viewer may see at least one of its chats;
        no detail otherwise. chat_removed_from_community has none: its
        action gives no community.
      required: [kind, community]
      properties:
        kind:
          const: community
        community:
          $ref: '#/components/schemas/ServiceCommunity'
    ServiceCommunity:
      type: object
      description: >-
        A Telegram community. It is not a chat and has no page here, so
        there is nothing to link to.
      required: [id, name, photo]
      properties:
        id:
          type: integer
          format: int64
          description: TDLib's community id; not a chat id.
        name:
          type: string
        photo:
          type: [string, 'null']
          description: >-
            Its photo's /files/<token> URL; null when it has none, or
            the file is neither stored nor fetchable for this viewer.
    ServiceTitleDetail:
      type: object
      description: >-
        chat_create: the title the group was created with;
        chat_upgrade_from: the basic group's title, and the basic group
        the supergroup was upgraded from when the archive has it and the
        viewer may see it (else null, as always for chat_create).
      required: [kind, title, basic_group]
      properties:
        kind:
          const: title
        title:
          type: string
        basic_group:
          oneOf:
            - $ref: '#/components/schemas/ChatRef'
            - type: 'null'
    ServiceBackgroundDetail:
      type: object
      description: >-
        chat_set_background: whether the background was set for the one
        who set it alone ("for themselves"), and the background itself
        (docs/design/message-types.md section 4.2.3). Rows logged
        before the background was kept have only only_for_self: type,
        image, fill and theme_name are null and the flags false.
      required: [kind, only_for_self, type, dark, image, fill, intensity, is_inverted, is_moving, is_blurred, theme_name]
      properties:
        kind:
          const: background
        only_for_self:
          type: boolean
        type:
          description: >-
            wallpaper: an image (image), maybe blurred; pattern: a
            pattern image (image) drawn over fill at intensity percent,
            or with the fill showing through it when is_inverted; fill:
            fill alone; chat_theme: an emoji chat theme, theme_name,
            whose colours are not stored. null when not stored.
          type: [string, 'null']
          enum: [wallpaper, pattern, fill, chat_theme, null]
        dark:
          type: boolean
          description: The background is meant for a dark theme.
        image:
          description: >-
            The wallpaper (a JPEG, render image) or the pattern (a PNG,
            render image, or Telegram's gzipped SVG pattern format,
            application/x-tgwallpattern, render file), the message's
            file of role background; null for a fill, a chat theme and
            when not recorded.
          oneOf:
            - $ref: '#/components/schemas/ChatMedia'
            - type: 'null'
        fill:
          description: A fill's or a pattern's fill; null for the others.
          oneOf:
            - $ref: '#/components/schemas/BackgroundFill'
            - type: 'null'
        intensity:
          description: >-
            A pattern's intensity, 0-100: the pattern's opacity over
            its fill; null for the other types.
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        is_inverted:
          type: boolean
          description: >-
            A pattern is inverted: the fill shows through the pattern's
            shapes instead of under them (false for the others).
        is_moving:
          type: boolean
          description: >-
            A wallpaper or pattern moves with the device's tilt (false
            for the others).
        is_blurred:
          type: boolean
          description: A wallpaper is blurred (false for the others).
        theme_name:
          type: [string, 'null']
          description: A chat theme's name (an emoji); null for the others.
    BackgroundFill:
      type: object
      description: >-
        A background's fill. colors are RGB colours as integers
        (0xRRGGBB): one for solid, the top then the bottom colour for
        gradient, three or four for freeform_gradient (Telegram's
        blend of colours at fixed points). rotation_angle is a
        gradient's clockwise rotation in degrees (0-359, a multiple of
        45), 0 for the others.
      required: [type, colors, rotation_angle]
      properties:
        type:
          type: string
          enum: [solid, gradient, freeform_gradient]
        colors:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 16777215
        rotation_angle:
          type: integer
          minimum: 0
          maximum: 359
    ServicePart:
      type: object
      description: >-
        A piece of a service message's text: plain text when user and
        chat are both absent, else the name of refs.users[user] (link
        to /users/{id}) or refs.chats[chat] (link to /groups/{id}).
      required: [text]
      properties:
        text:
          type: string
        user:
          type: integer
          minimum: 0
          description: The index of the user in refs.users.
        chat:
          type: integer
          minimum: 0
          description: The index of the chat in refs.chats.
    ServiceRefs:
      type: object
      description: >-
        Who and what the action names, for links: the users (kind user)
        and chats (kind group) the viewer may see, in the order the
        action names them; the others are left out. message_id is the
        message of this chat the action is about (the pinned message, a
        poll or checklist that changed, a giveaway), for ?at= links;
        null when none.
      required: [users, chats, message_id]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/ChatRef'
        chats:
          type: array
          items:
            $ref: '#/components/schemas/ChatRef'
        message_id:
          type: [integer, 'null']
          format: int64
    ServiceGiftDetail:
      type: object
      description: >-
        A gift, as Telegram shows it on the service line
        (docs/design/message-types.md sections 3.5, 4.2.3 and 4.3).
        gift and refunded_upgraded_gift: a regular gift; upgraded_gift,
        upgraded_gift_purchase_offer and
        upgraded_gift_purchase_offer_rejected: an upgraded (unique)
        gift, with upgraded set; gifted_premium, gifted_stars,
        gifted_grams and giveaway_prize_stars: the animation sticker of
        the Premium, Stars or grams given. Rows logged before the
        gift's stickers and look were kept have only what was stored:
        null stickers, upgraded's model, symbol and backdrop null. No
        detail when nothing of it is stored.
      required: [kind, sticker, symbol_sticker, star_count, price, sender, receiver, text, entities, upgraded]
      properties:
        kind:
          const: gift
        sticker:
          description: >-
            The message's file of role gift at position 0: a regular
            gift's sticker, an upgraded gift's model sticker, or the
            animation sticker of gifted Premium, Stars, grams or a
            giveaway prize (render lottie for a .tgs, animation for a
            .webm, image for a .webp); null when not recorded.
          oneOf:
            - $ref: '#/components/schemas/ChatMedia'
            - type: 'null'
        symbol_sticker:
          description: >-
            An upgraded gift's symbol sticker, the file of role gift at
            position 1, drawn as a pattern over the backdrop in its
            symbol_color; null for the others and when not recorded.
          oneOf:
            - $ref: '#/components/schemas/ChatMedia'
            - type: 'null'
        star_count:
          type: [integer, 'null']
          format: int64
          description: >-
            A regular gift's price in Telegram Stars, or the Stars of
            gifted_stars and giveaway_prize_stars; null for the others.
        price:
          description: >-
            A purchase offer's price, in Stars or in hundredths of a
            gram (TON); null for the others.
          oneOf:
            - type: object
              required: [stars]
              properties:
                stars:
                  type: integer
                  format: int64
            - type: object
              required: [gram_cents]
              properties:
                gram_cents:
                  type: integer
                  format: int64
            - type: 'null'
        sender:
          description: >-
            Who gave it (the gift's sender, or the gifter of Premium,
            Stars or grams), as a ref the viewer may see; null when it
            is not stored (a private gift) or hidden.
          oneOf:
            - $ref: '#/components/schemas/ChatRef'
            - type: 'null'
        receiver:
          description: Who received it, as sender is.
          oneOf:
            - $ref: '#/components/schemas/ChatRef'
            - type: 'null'
        text:
          type: string
          description: >-
            The message the giver attached (gift, upgraded_gift,
            gifted_premium); empty when none.
        entities:
          type: array
          description: text's entities; empty when none.
          items:
            $ref: '#/components/schemas/TextEntity'
        upgraded:
          description: >-
            The upgraded gift of upgraded_gift and of the two purchase
            offer types; null for the others.
          oneOf:
            - $ref: '#/components/schemas/UpgradedGift'
            - type: 'null'
    UpgradedGift:
      type: object
      description: >-
        An upgraded (unique) gift: its ids, title, number and owner, and
        what it looks like: the model (whose sticker is the detail's
        sticker), the symbol (symbol_sticker) and the backdrop, a
        gradient from center_color to edge_color behind them. Each is
        null when not stored (rows logged before they were kept).
      required: [id, regular_gift_id, title, name, number, owner, model, symbol, backdrop, original_details]
      properties:
        id:
          type: string
          description: The upgraded gift's id (64-bit, as a decimal string).
        regular_gift_id:
          type: [string, 'null']
          description: The id of the regular gift it was upgraded from.
        title:
          type: string
        name:
          type: string
          description: >-
            Its unique name, as in https://t.me/nft/{name}; empty when
            not stored.
        number:
          type: integer
          format: int64
          description: Its number among the upgraded gifts of its kind; 0 when not stored.
        owner:
          description: Its owner, as a ref the viewer may see; null when not stored or hidden.
          oneOf:
            - $ref: '#/components/schemas/ChatRef'
            - type: 'null'
        model:
          oneOf:
            - type: object
              required: [name, rarity_per_mille, rarity, crafted]
              properties:
                name:
                  type: string
                rarity_per_mille:
                  $ref: '#/components/schemas/GiftRarityPerMille'
                rarity:
                  $ref: '#/components/schemas/GiftRarity'
                crafted:
                  type: boolean
                  description: The model is only obtained by crafting gifts.
            - type: 'null'
        symbol:
          oneOf:
            - type: object
              required: [name, rarity_per_mille, rarity]
              properties:
                name:
                  type: string
                rarity_per_mille:
                  $ref: '#/components/schemas/GiftRarityPerMille'
                rarity:
                  $ref: '#/components/schemas/GiftRarity'
            - type: 'null'
        backdrop:
          oneOf:
            - type: object
              description: >-
                Colours are RGB integers (0xRRGGBB); 0 is black.
              required: [name, center_color, edge_color, symbol_color, text_color, rarity_per_mille, rarity]
              properties:
                name:
                  type: string
                center_color:
                  $ref: '#/components/schemas/RgbColor'
                edge_color:
                  $ref: '#/components/schemas/RgbColor'
                symbol_color:
                  $ref: '#/components/schemas/RgbColor'
                text_color:
                  $ref: '#/components/schemas/RgbColor'
                rarity_per_mille:
                  $ref: '#/components/schemas/GiftRarityPerMille'
                rarity:
                  $ref: '#/components/schemas/GiftRarity'
            - type: 'null'
        original_details:
          description: >-
            The regular gift it was upgraded from, as it was sent: its
            sender (null for a private gift, when not stored or
            hidden), receiver, text and date; null when not stored.
          oneOf:
            - type: object
              required: [sender, receiver, text, entities, date]
              properties:
                sender:
                  oneOf:
                    - $ref: '#/components/schemas/ChatRef'
                    - type: 'null'
                receiver:
                  oneOf:
                    - $ref: '#/components/schemas/ChatRef'
                    - type: 'null'
                text:
                  type: string
                entities:
                  type: array
                  items:
                    $ref: '#/components/schemas/TextEntity'
                date:
                  type: [string, 'null']
                  format: date-time
            - type: 'null'
    GiftRarityPerMille:
      type: [integer, 'null']
      minimum: 0
      maximum: 1000
      description: >-
        How many of 1000 upgraded gifts get this attribute (0 means
        under 0.1%); null when Telegram names the rarity instead
        (GiftRarity) or it is not stored.
    GiftRarity:
      type: [string, 'null']
      enum: [uncommon, rare, epic, legendary, null]
      description: >-
        The rarity when Telegram names it instead of giving a
        proportion; null otherwise.
    RgbColor:
      type: integer
      minimum: 0
      maximum: 16777215
      description: An RGB colour as an integer (0xRRGGBB).
    ServiceThemeDetail:
      type: object
      description: >-
        chat_set_theme: the theme set, an emoji chat theme's name, or
        for a theme made from an upgraded gift that gift's id and
        unique name (link to https://t.me/nft/{gift_name}). No detail
        when none is stored (the theme was reset, or rows logged
        before).
      required: [kind, theme_name, gift_id, gift_name]
      properties:
        kind:
          const: theme
        theme_name:
          type: [string, 'null']
          description: An emoji chat theme's name; null for a gift theme.
        gift_id:
          type: [string, 'null']
          description: A gift theme's upgraded gift id; null for the others.
        gift_name:
          type: [string, 'null']
          description: A gift theme's upgraded gift's unique name; null for the others.
    MessageDetail:
      description: >-
        A message kind's detail, from content_extra
        (docs/design/message-types.md section 4.2.2), the poll tables
        and telegram_message_files. Lists that can be long (poll
        options, checklist tasks, giveaway chats, group call
        participants) hold at most the first 20, with the full count
        in the matching *_total; a total counts the people and chats
        left out as hidden too, which says how many there were but not
        who. A user or a chat is a ChatRef (kind user or group).
      oneOf:
        - $ref: '#/components/schemas/LocationDetail'
        - $ref: '#/components/schemas/VenueDetail'
        - $ref: '#/components/schemas/ContactDetail'
        - $ref: '#/components/schemas/DiceDetail'
        - $ref: '#/components/schemas/GameDetail'
        - $ref: '#/components/schemas/PollDetail'
        - $ref: '#/components/schemas/ChecklistDetail'
        - $ref: '#/components/schemas/StoryDetail'
        - $ref: '#/components/schemas/InvoiceDetail'
        - $ref: '#/components/schemas/GiveawayDetail'
        - $ref: '#/components/schemas/CallDetail'
        - $ref: '#/components/schemas/PaidMediaDetail'
        - $ref: '#/components/schemas/RichDetail'
        - $ref: '#/components/schemas/WidgetDetail'
        - $ref: '#/components/schemas/PlaceholderDetail'
      discriminator:
        propertyName: kind
        mapping:
          location: '#/components/schemas/LocationDetail'
          venue: '#/components/schemas/VenueDetail'
          contact: '#/components/schemas/ContactDetail'
          dice: '#/components/schemas/DiceDetail'
          game: '#/components/schemas/GameDetail'
          poll: '#/components/schemas/PollDetail'
          checklist: '#/components/schemas/ChecklistDetail'
          story: '#/components/schemas/StoryDetail'
          invoice: '#/components/schemas/InvoiceDetail'
          giveaway: '#/components/schemas/GiveawayDetail'
          call: '#/components/schemas/CallDetail'
          paid_media: '#/components/schemas/PaidMediaDetail'
          rich: '#/components/schemas/RichDetail'
          widget: '#/components/schemas/WidgetDetail'
          expired: '#/components/schemas/PlaceholderDetail'
          unsupported: '#/components/schemas/PlaceholderDetail'
    LocationDetail:
      type: object
      description: >-
        A location, in degrees. A live location shows its latest
        position, with how many times it moved (its edit versions; the
        logger keeps at most one a minute), not a track.
      required: [kind, lat, lon, accuracy, live]
      properties:
        kind:
          const: location
        lat:
          type: number
        lon:
          type: number
        accuracy:
          type: [number, 'null']
          description: Horizontal accuracy in metres; null when unknown.
        live:
          oneOf:
            - type: object
              required: [period, heading, proximity_radius, updates]
              properties:
                period:
                  type: integer
                  description: Seconds it is shared for (0x7FFFFFFF is "until stopped").
                heading:
                  type: integer
                  description: Direction of travel in degrees, 0 when unknown.
                proximity_radius:
                  type: integer
                  description: Metres of the proximity alert, 0 when none.
                updates:
                  type: integer
                  description: How many earlier positions the logger kept.
            - type: 'null'
    VenueDetail:
      type: object
      required: [kind, lat, lon, title, address, provider, venue_id, venue_type]
      properties:
        kind:
          const: venue
        lat:
          type: number
        lon:
          type: number
        title:
          type: string
        address:
          type: string
        provider:
          type: string
          description: The venue database (foursquare, gplaces), or "".
        venue_id:
          type: string
        venue_type:
          type: string
    ContactDetail:
      type: object
      description: >-
        A shared contact. phone and vcard (which holds the number too)
        follow the rule for users' phones: only viewers that see users
        in full get them; for others they are null. user is the
        Telegram user the contact is, when the viewer may see it.
      required: [kind, first_name, last_name, phone, vcard, user]
      properties:
        kind:
          const: contact
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: [string, 'null']
        vcard:
          type: [string, 'null']
        user:
          oneOf:
            - $ref: '#/components/schemas/ChatRef'
            - type: 'null'
    DiceDetail:
      type: object
      required: [kind, emoji, value, stake]
      properties:
        kind:
          const: dice
        emoji:
          type: string
          description: The dice's emoji; "" for a stake dice.
        value:
          type: integer
          description: The value thrown; 0 while it was still rolling.
        stake:
          type: boolean
          description: A dice played for a stake.
    GameDetail:
      type: object
      description: A game; its text is the message text.
      required: [kind, title, description, short_name, photo]
      properties:
        kind:
          const: game
        title:
          type: string
        description:
          type: string
        short_name:
          type: string
        photo:
          description: The game's photo, or else its animation (telegram_message_files, role game).
          oneOf:
            - $ref: '#/components/schemas/ChatMedia'
            - type: 'null'
    PollDetail:
      type: object
      description: >-
        A poll or quiz with its latest results (telegram_polls and its
        options; removed options are left out). The message text is
        the poll's description.
      required: [kind, question, question_entities, type, anonymous, multiple, closed, total_voters, close_date, explanation, explanation_entities, options, options_total]
      properties:
        kind:
          const: poll
        question:
          type: string
        question_entities:
          type: array
          description: The question's formatting; [] for plain text.
          items:
            $ref: '#/components/schemas/TextEntity'
        type:
          type: string
          enum: [regular, quiz]
        anonymous:
          type: boolean
        multiple:
          type: boolean
          description: More than one option may be chosen.
        closed:
          type: boolean
          description: >-
            Closed, or past its close_date: Telegram does not always
            send the update that closes a poll whose time ran out.
        total_voters:
          type: integer
        close_date:
          type: [string, 'null']
          description: When it closes or closed, if a date was set.
        explanation:
          type: [string, 'null']
          description: A quiz's explanation, if any.
        explanation_entities:
          type: array
          description: >-
            The explanation's formatting; [] for plain text and
            without an explanation.
          items:
            $ref: '#/components/schemas/TextEntity'
        options:
          type: array
          description: The first 20 options, in order.
          items:
            type: object
            required: [text, voters, percent, correct]
            properties:
              text:
                type: string
              voters:
                type: integer
              percent:
                type: integer
              correct:
                type: boolean
                description: A quiz's correct option.
        options_total:
          type: integer
    ChecklistDetail:
      type: object
      description: A checklist; its title is the message text.
      required: [kind, tasks, tasks_total, others_can_add, others_can_mark]
      properties:
        kind:
          const: checklist
        tasks:
          type: array
          description: The first 20 tasks, in order.
          items:
            type: object
            required: [id, text, entities, done, done_by, done_at]
            properties:
              id:
                type: integer
              text:
                type: string
              entities:
                type: array
                description: The task's formatting; [] for plain text.
                items:
                  $ref: '#/components/schemas/TextEntity'
              done:
                type: boolean
              done_by:
                description: Who marked it done, when the viewer may see them.
                oneOf:
                  - $ref: '#/components/schemas/ChatRef'
                  - type: 'null'
              done_at:
                type: [string, 'null']
        tasks_total:
          type: integer
        others_can_add:
          type: boolean
        others_can_mark:
          type: boolean
    StoryDetail:
      type: object
      description: A shared story, kept as a reference only (stories are not archived).
      required: [kind, poster, story_id]
      properties:
        kind:
          const: story
        poster:
          description: Whose story it is, when the viewer may see them.
          oneOf:
            - $ref: '#/components/schemas/ChatRef'
            - type: 'null'
        story_id:
          type: integer
        username:
          type: [string, 'null']
          description: >-
            The poster's active username, for a t.me/<username>/s/<id>
            link; null without one, and when poster is null (a poster
            the viewer may not see).
    InvoiceDetail:
      type: object
      required: [kind, title, description, currency, total_amount, is_test, photo]
      properties:
        kind:
          const: invoice
        title:
          type: string
        description:
          type: string
        currency:
          type: string
          description: ISO 4217 code, or XTR for Telegram Stars.
        total_amount:
          type: integer
          format: int64
          description: In the currency's smallest unit.
        is_test:
          type: boolean
        photo:
          description: The product photo (telegram_message_files, role invoice).
          oneOf:
            - $ref: '#/components/schemas/ChatMedia'
            - type: 'null'
    GiveawayDetail:
      type: object
      required: [kind, prize, winner_count, winners_selection_date, only_new_members, prize_description, chats, chats_total, sticker]
      properties:
        kind:
          const: giveaway
        prize:
          oneOf:
            - type: object
              required: [premium_months]
              properties:
                premium_months:
                  type: integer
            - type: object
              required: [stars]
              properties:
                stars:
                  type: integer
                  format: int64
            - type: 'null'
        winner_count:
          type: integer
        winners_selection_date:
          type: [string, 'null']
        only_new_members:
          type: boolean
        prize_description:
          type: string
        chats:
          type: array
          description: >-
            The chats taking part (the boosted chat first) that the
            viewer may see, at most 20.
          items:
            $ref: '#/components/schemas/ChatRef'
        chats_total:
          type: integer
        sticker:
          description: >-
            The prize's sticker, the message's file of role gift at
            position 0 (render lottie for a .tgs, animation for a
            .webm, image for a .webp); null when not recorded (rows
            logged before it was kept).
          oneOf:
            - $ref: '#/components/schemas/ChatMedia'
            - type: 'null'
    CallDetail:
      type: object
      description: >-
        A call. outcome: missed, declined, disconnected, hung_up or
        upgraded (to a group call) for a private call, ended when
        Telegram gave no reason; for a group call active, missed or
        ended.
      required: [kind, video, group, duration, outcome, participants, participants_total]
      properties:
        kind:
          const: call
        video:
          type: boolean
        group:
          type: boolean
        duration:
          type: integer
          description: Seconds; 0 when it did not take place or is still going.
        outcome:
          type: string
          enum: [missed, declined, disconnected, hung_up, upgraded, ended, active]
        participants:
          type: array
          description: >-
            A group call's other participants the viewer may see, at
            most 20; empty for a private call.
          items:
            $ref: '#/components/schemas/ChatRef'
        participants_total:
          type: integer
    PaidMediaDetail:
      type: object
      description: Paid media; its caption is the message text.
      required: [kind, star_count, items]
      properties:
        kind:
          const: paid_media
        star_count:
          type: integer
          format: int64
        items:
          type: array
          items:
            type: object
            required: [kind, media]
            properties:
              kind:
                type: string
                enum: [photo, video, preview, unsupported]
                description: >-
                  preview: not paid for by the logging account, so only
                  its size and blurred preview are known.
              media:
                description: The item's file (telegram_message_files, role paid), when one is known.
                oneOf:
                  - $ref: '#/components/schemas/ChatMedia'
                  - type: 'null'
    WidgetDetail:
      type: object
      description: >-
        A widget (messageWidget): a bot's HTML page, which Telegram
        draws in a box of the given size. This archive never renders
        it (decision 2026-11-20-msg-widgets-html): a client shows the
        box at its size with a note, and on the message page the HTML
        as escaped source text, never through innerHTML, an iframe or
        a page of its own, since a bot's HTML on the web's origin would
        run with the viewer's session. Its caption is the message
        text.
      required: [kind, width, height, has_caption, widget_id, html]
      properties:
        kind:
          const: widget
        width:
          type: integer
          description: The box's width as TDLib gives it; 0 is the whole width of the bubble.
        height:
          type: integer
          description: The box's height as TDLib gives it; 0 is a height that is not fixed.
        has_caption:
          type: boolean
          description: Whether the widget has a caption (the message text).
        widget_id:
          type: [string, 'null']
          description: The shared widget's id (an int64 as a string); null for a widget that is not shared.
        html:
          type: [string, 'null']
          description: >-
            The widget's HTML, to be shown as text only. Sent by the
            message page alone: the chat window and the other lists
            send null, to keep their pages small. Null on the message
            page too when the daemon did not keep it (TDLib's JSON was
            over its cap, or the row has none).
    PlaceholderDetail:
      type: object
      description: >-
        A kind the chat shows as a one-line placeholder: expired
        self-destructing media, or content TDLib itself could not
        read.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [expired, unsupported]
    RichDetail:
      type: object
      description: >-
        A rich message (messageRichMessage): its page blocks, converted
        from the TDLib JSON the daemon keeps beside its curated keys
        (web/docs/message-kinds.md, "Rich messages"). blocks is null
        when the layout was not kept (a message whose JSON was over the
        daemon's cap, or a row stored before the mapping and not read
        again yet): the chat then shows the message text, which holds
        the plain text of every block either way. A client draws the
        blocks instead of the text when blocks is not null.
      required: [kind, blocks, is_rtl, is_full]
      properties:
        kind:
          const: rich
        blocks:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/RichBlock'
            - type: 'null'
        is_rtl:
          type: boolean
          description: The page reads right to left.
        is_full:
          type: boolean
          description: >-
            false when TDLib had only the start of the message and the
            rest was not logged.
    RichText:
      type: object
      description: >-
        A run of a rich message's text with its formatting, in the
        shape of a message's text and entities (TextEntity, offsets in
        UTF-16 code units), so the text entities renderer draws it.
        Formatting maps onto the entity types bold, italic, underline,
        strikethrough, spoiler, code (fixed width, and a formula's
        source), text_url (a link, a button's URL), email,
        phone_number, mention (an @username), mention_name (user_id
        resolved through the scope as for message entities), hashtag,
        cashtag, bot_command, bank_card_number and custom_emoji, plus
        three a message's text never has: subscript, superscript and
        marked (highlighted). A custom emoji's text is its alternative
        text, a formula's its source; an icon and an anchor add no
        text. A text_url's url is an http, https, tg, mailto or tel
        link; a link of another scheme keeps its text without the
        entity.
      required: [text, entities]
      properties:
        text:
          type: string
        entities:
          type: array
          items:
            $ref: '#/components/schemas/TextEntity'
    RichCaption:
      type: object
      description: A media block's caption and its credit line; either may be empty.
      required: [text, credit]
      properties:
        text:
          $ref: '#/components/schemas/RichText'
        credit:
          $ref: '#/components/schemas/RichText'
    RichBlock:
      type: object
      description: >-
        One page block of a rich message. type is TDLib's class in
        snake_case without its pageBlock prefix; the fields a type
        does not use are absent. By type:
        title, subtitle, header, subheader, kicker, paragraph, footer,
        thinking (a reasoning step): text.
        section_heading: text, size (1 the largest).
        author_date: text (the author), date.
        preformatted: text, language (may be empty).
        divider: nothing.
        mathematical_expression: expression (its source).
        anchor: name (a target of links inside the page).
        list: items.
        block_quote: blocks, credit.
        expandable_block_quote, pull_quote: text, credit.
        photo: media, caption, spoiler, url (where it links, if
        anywhere).
        video: media, caption, spoiler, autoplay, loop.
        animation: media, caption, spoiler, autoplay.
        audio, document, voice_note: media, caption.
        cover: blocks (the one block the page opens with).
        embedded: url, media (its poster), width, height, caption;
        the embed itself needs a third party's script and is drawn as
        a link.
        embedded_post: url, author, media (the author's photo), date,
        blocks, caption; drawn as a quote with a link.
        collage, slideshow: blocks, caption.
        chat_link: title, username.
        table: text (the caption), rows, bordered, striped.
        details (a collapsible block): text (its summary), blocks,
        open (shown open at first).
        related_articles: text (the header), articles.
        map: lat, lon, zoom, width, height, caption.
        button_row: buttons, align.
        unknown: name, the TDLib class in snake_case without its
        prefix (unsupported for a block TDLib itself could not read),
        for a block this archive does not draw; a client shows it as
        such.
        media is the block's file (telegram_message_files, role rich,
        by its position in the page), absent when none is known; a
        video's or an animation's poster (and thumb) is the stored
        still thumbnail at the same position (role thumbnail).
      required: [type]
      properties:
        type:
          type: string
          enum:
            - title
            - subtitle
            - author_date
            - header
            - subheader
            - section_heading
            - kicker
            - paragraph
            - preformatted
            - footer
            - thinking
            - divider
            - mathematical_expression
            - anchor
            - list
            - block_quote
            - expandable_block_quote
            - pull_quote
            - photo
            - video
            - animation
            - audio
            - document
            - voice_note
            - cover
            - embedded
            - embedded_post
            - collage
            - slideshow
            - chat_link
            - table
            - details
            - related_articles
            - map
            - button_row
            - unknown
        text:
          $ref: '#/components/schemas/RichText'
        credit:
          $ref: '#/components/schemas/RichText'
        caption:
          $ref: '#/components/schemas/RichCaption'
        size:
          type: integer
        language:
          type: string
        date:
          type: [string, 'null']
          description: ISO 8601; null when TDLib gives none.
        expression:
          type: string
        name:
          type: string
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/RichBlock'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RichListItem'
        media:
          $ref: '#/components/schemas/ChatMedia'
        spoiler:
          type: boolean
        autoplay:
          type: boolean
        loop:
          type: boolean
        url:
          type: string
          description: >-
            A link: only http, https, tg, mailto and tel links are
            sent, others are left out; a client opens it with
            rel=noopener.
        author:
          type: string
        title:
          type: string
        username:
          type: string
          description: A chat link's public username, for a t.me link; may be empty.
        width:
          type: integer
        height:
          type: integer
        rows:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/RichTableCell'
        bordered:
          type: boolean
        striped:
          type: boolean
        open:
          type: boolean
        articles:
          type: array
          items:
            $ref: '#/components/schemas/RichArticle'
        lat:
          type: number
        lon:
          type: number
        zoom:
          type: integer
        buttons:
          type: array
          items:
            $ref: '#/components/schemas/RichButton'
        align:
          type: string
          enum: [left, center, right]
    RichListItem:
      type: object
      description: >-
        A list item: its label (a bullet, a number, a letter; may be
        empty), its blocks, and for a checklist item whether it has a
        checkbox and whether that is checked.
      required: [label, blocks, checkbox, checked]
      properties:
        label:
          type: string
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/RichBlock'
        checkbox:
          type: boolean
        checked:
          type: boolean
    RichTableCell:
      type: object
      description: >-
        A table cell. A cell of colspan or rowspan above 1 covers the
        cells it spans, which are not listed.
      required: [text, header, colspan, rowspan, align, valign]
      properties:
        text:
          $ref: '#/components/schemas/RichText'
        header:
          type: boolean
        colspan:
          type: integer
          minimum: 1
        rowspan:
          type: integer
          minimum: 1
        align:
          type: string
          enum: [left, center, right]
        valign:
          type: string
          enum: [top, middle, bottom]
    RichArticle:
      type: object
      description: >-
        A related article. url is empty for a link that is not http,
        https, tg, mailto or tel; photo is absent when no file is
        known.
      required: [url, title, description, author, date]
      properties:
        url:
          type: string
        title:
          type: string
        description:
          type: string
        author:
          type: string
        date:
          type: [string, 'null']
          description: ISO 8601; null when TDLib gives none.
        photo:
          $ref: '#/components/schemas/ChatMedia'
    RichButton:
      type: object
      description: >-
        A button of a button row. url is where a link button goes;
        absent for the other buttons (callbacks and the like), which an
        archive cannot press, and for a link that is not http, https,
        tg, mailto or tel.
      required: [text]
      properties:
        text:
          $ref: '#/components/schemas/RichText'
        url:
          type: string
    ChatTopic:
      type: object
      description: A forum topic, as last seen (telegram_forum_topics).
      required: [id, name, icon_color, icon_custom_emoji_id, icon_custom_emoji, closed, hidden]
      properties:
        id:
          type: integer
          format: int64
          description: The topic id, as ChatMessage.topic_id and ?topic= take it.
        name:
          type: string
        icon_color:
          type: integer
          description: The icon's colour, RGB.
        icon_custom_emoji_id:
          type: [string, 'null']
          description: >-
            The icon's custom emoji, as a string; null for a topic
            drawn with icon_color alone.
        icon_custom_emoji:
          description: >-
            The sticker of icon_custom_emoji_id; null for none and
            while the archive does not know it.
          oneOf:
            - $ref: '#/components/schemas/CustomEmoji'
            - type: 'null'
        closed:
          type: boolean
        hidden:
          type: boolean
          description: The General topic is hidden from the topic list.
    MessageFull:
      allOf:
        - $ref: '#/components/schemas/MessageRow'
        - $ref: '#/components/schemas/MessageExtra'
        - $ref: '#/components/schemas/MessageKinds'
        - type: object
          required: [text, entities, reply_to, edits, edited_at, media]
          properties:
            album:
              type: array
              description: >-
                The other items of the message's album, in message
                order, as ChatMessage.album gives them beside the first
                (each with its own message_id, kind and deleted_at);
                empty when the message is not in an album.
              items:
                $ref: '#/components/schemas/ChatMedia'
            text:
              type: string
            entities:
              type: array
              description: >-
                The text's formatting; [] for plain text and for a
                service message.
              items:
                $ref: '#/components/schemas/TextEntity'
            reply_to:
              oneOf:
                - type: object
                  required: [scope, id, sender_name, snippet]
                  properties:
                    scope:
                      $ref: '#/components/schemas/MessageScope'
                    id:
                      type: integer
                      format: int64
                    sender_name:
                      type: string
                    snippet:
                      type: string
                - type: 'null'
            edits:
              type: array
              items:
                $ref: '#/components/schemas/Edit'
            edited_at:
              type: [string, 'null']
            media:
              oneOf:
                - allOf:
                    - $ref: '#/components/schemas/MediaDetail'
                    - type: object
                      required: [file_id, name, size, stored, thumb, url]
                      properties:
                        file_id:
                          type: integer
                          format: int64
                        name:
                          type: string
                        size:
                          type: integer
                          format: int64
                        stored:
                          type: boolean
                        fetchable:
                          type: boolean
                          description: >-
                            As ChatMedia's fetchable. Always sent;
                            optional in this description.
                        fetch:
                          type: [string, 'null']
                          description: >-
                            As ChatMedia's fetch: the fetchFile path when
                            fetchable is true, else null. Always sent;
                            optional in this description.
                        thumb:
                          type: [string, 'null']
                          description: As ChatMedia's thumb.
                        url:
                          type: [string, 'null']
                          description: >-
                            As ChatMedia's url: null for an unstored
                            file over the store's per-file cap, which is
                            fetched through fetch first.
                - type: 'null'
            link_preview:
              description: >-
                The link preview card, as ChatMessage.link_preview; null
                when the message has none. Always sent; optional here
                only until the app's message page reads it.
              oneOf:
                - $ref: '#/components/schemas/LinkPreview'
                - type: 'null'
            topic:
              description: >-
                The forum topic topic_id names, as ChatProps.topics lists
                it, for its name and colour; null when topic_id is null
                or the topic was never seen. Always sent; optional here
                only until the app's message page reads it.
              oneOf:
                - $ref: '#/components/schemas/ChatTopic'
                - type: 'null'
    ChatMedia:
      description: >-
        A message's file (web/docs/media.md) and its detail. url is the
        /files/<token> URL when the bytes are stored, or may be fetched
        from Telegram and are under the store's per-file cap, else null;
        a bigger fetchable file is fetched through fetch (fetchFile)
        first. thumb is the same URL for media that
        render as an image, and for other media its poster, else its
        minithumb (a blurred preview), when known; else null.
      allOf:
        - $ref: '#/components/schemas/MediaDetail'
        - $ref: '#/components/schemas/ChatMediaFile'
    ChatMediaFile:
      type: object
      required: [stored, thumb, url]
      properties:
        stored:
          type: boolean
        fetchable:
          type: boolean
          description: >-
            The bytes are not stored and the viewer may have them
            fetched from Telegram: the daemon API is on, a viewer
            without a session asks only for a file under the store's
            per-file cap, and a signed-in one holds fetch_files (every
            superadmin and admin, a member given it).
        fetch:
          type: [string, 'null']
          description: >-
            The path of the "Fetch from Telegram" action
            (/api/files/<token>/fetch, fetchFile) when fetchable is
            true, else null. url is null for such a file over the
            store's per-file cap: a page view never fetches a big file
            by itself. Always sent; optional in this description.
        thumb:
          type: [string, 'null']
        url:
          type: [string, 'null']
        name:
          type: string
        size:
          type: integer
          format: int64
        message_id:
          type: integer
          format: int64
          description: >-
            An album item's own message id (the album message's media
            and album items only), for #msg links and replies to it.
        kind:
          description: >-
            An album item's own content type (photo, video, document,
            audio, animation): an album may mix them. Album items only.
          $ref: '#/components/schemas/ContentType'
        deleted_at:
          type: string
          description: >-
            When an album item was deleted; absent while it is not.
            Album items only.
        deleted_on_recheck:
          type: boolean
          description: >-
            Present and true when an album item's deletion was found by
            a recheck against Telegram rather than seen as it happened
            (ChatMessage.deleted_on_recheck). Album items only.
    ChatMessage:
      allOf:
        - $ref: '#/components/schemas/MessageExtra'
        - $ref: '#/components/schemas/MessageKinds'
        - $ref: '#/components/schemas/ChatMessageBase'
    ChatMessageBase:
      type: object
      required: [id, message_id, date, scope, sender, content_type, text, entities, media, album, reply_to, forward, edits, edited_at, deleted_at, link_preview]
      properties:
        id:
          type: integer
          format: int64
        message_id:
          type: integer
          format: int64
        date:
          type: string
        scope:
          $ref: '#/components/schemas/MessageScope'
        sender:
          description: null when the logging account sent it.
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        content_type:
          $ref: '#/components/schemas/ContentType'
        text:
          type: string
        entities:
          type: array
          description: >-
            The text's (or caption's) formatting; [] for plain text
            and for a service message. An album's are its caption's.
          items:
            $ref: '#/components/schemas/TextEntity'
        media:
          oneOf:
            - $ref: '#/components/schemas/ChatMedia'
            - type: 'null'
        album:
          type: array
          items:
            $ref: '#/components/schemas/ChatMedia'
        reply_to:
          oneOf:
            - type: object
              required: [message_id, sender_id, sender_name, snippet]
              properties:
                message_id:
                  type: integer
                  format: int64
                sender_id:
                  type: integer
                  format: int64
                sender_name:
                  type: string
                snippet:
                  type: string
                chat_id:
                  type: integer
                  format: int64
                  description: >-
                    The chat of a target in another chat; absent for
                    a target in this one. A negative id is a group
                    (/groups/{chat_id}/chat?at=<message_id>), a
                    positive one a private chat.
                resolved:
                  type: boolean
                  description: >-
                    The target is logged and sender and snippet
                    describe it; false: only its id is known, shown
                    as "message #<message_id>".
                deleted:
                  type: boolean
                  description: The target was deleted.
            - type: 'null'
        forward:
          type: [string, 'null']
        edits:
          type: array
          items:
            $ref: '#/components/schemas/Edit'
        edited_at:
          type: [string, 'null']
        deleted_at:
          type: [string, 'null']
        deleted_on_recheck:
          type: boolean
          description: >-
            Present and true when the deletion was found by a recheck
            against Telegram (the message was gone from the stretch
            Telegram returned) rather than seen as it happened; then
            deleted_at is when the recheck found it. Absent otherwise; an album
            message has it when all its items were deleted and one of
            them was found so.
        link_preview:
          oneOf:
            - $ref: '#/components/schemas/LinkPreview'
            - type: 'null'
    LinkPreview:
      type: object
      description: >-
        A message's link preview card (telegram_link_previews): the
        site, the page's title and description, its URL, its media,
        and what the preview's type adds (docs/design/message-types.md
        section 4.8). Previews logged before the daemon kept a
        preview's extras have only type, site, title, desc, url and the
        photo as media.
      required: [type, site, title, desc]
      properties:
        type:
          type: string
          description: >-
            The preview's TDLib type, lower-cased without the prefix
            (article, photo, video, animation, audio, document,
            sticker, embedded_video_player, embedded_animation_player,
            embedded_audio_player, external_video, external_audio,
            chat, user, message, story, video_note, voice_note, album,
            background, sticker_set, gift_collection, gift_auction,
            upgraded_gift, live_story, story_album, theme,
            text_composition_style, direct_messages_chat,
            premium_gift_code, request_managed_bot,
            shareable_chat_folder, ...), as stored; unsupported when
            TDLib gave none the daemon knows, which rows logged before
            the daemon named the later types keep. Open-ended: the
            daemon records new types as TDLib adds them.
        site:
          type: string
        title:
          type: string
        desc:
          type: string
        url:
          type: string
        author:
          type: string
          description: The page's author; absent when none.
        media:
          description: >-
            The preview's own medium (telegram_message_files, role
            preview_media, position 0) when the daemon kept one: the
            video, animation, audio, document, sticker, video note
            (round) or voice note of such a preview, the cached medium
            of an embedded player, or a story album's video icon;
            render says how it draws. Its thumb is then the preview's
            photo, when it has one, and so is its poster (video and
            animation), but for a video preview whose cover is kept
            (position 1), which is the poster then. Without such a
            medium, the preview's photo, rendering as an image, with w
            and h for article, photo, app, web_app and story_album
            previews when known. Absent when the preview has neither.
            The media of album, background, sticker_set,
            gift_collection, gift_auction and upgraded_gift previews
            are in their own fields, never here. Never carries a
            minithumb.
          $ref: '#/components/schemas/ChatMedia'
        duration:
          type: integer
          description: >-
            Length in seconds of a video, animation or audio preview or
            of an embedded player; absent when unknown.
        embed:
          type: object
          description: >-
            An embedded player (embedded_video_player,
            embedded_animation_player, embedded_audio_player): the
            player's URL, to open in a new tab (the web does not run
            it), and its expected size in pixels, each absent when
            unknown. Absent for other types.
          required: [url]
          properties:
            url:
              type: string
            w:
              type: integer
            h:
              type: integer
        target:
          type: object
          description: >-
            A message preview's target, when its link names a message
            that is in the archive and the viewer may see its chat: the
            chat (a negative group id, as in /groups/{chat_id}/chat)
            and the message's id, to link to
            /groups/{chat_id}/chat?at=<message_id>. The link's
            username resolves through the groups' usernames; a message
            not in the archive, a chat the viewer may not see, or a
            link that names no message leaves it absent, and the card
            links to url.
          required: [chat_id, message_id]
          properties:
            chat_id:
              type: integer
              format: int64
            message_id:
              type: integer
              format: int64
        album:
          type: object
          description: >-
            An album preview: its caption and its items in order, item
            i the preview_media file at position i with its detail
            (render image for a photo, video for a video); null for an
            item TDLib left empty or whose file is not recorded. Absent
            for other types.
          required: [caption, items]
          properties:
            caption:
              type: string
            items:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/ChatMedia'
                  - type: 'null'
        background:
          description: >-
            A background preview (a t.me/bg/ link): the background and
            its image, the preview_media file at position 0. Absent for
            other types.
          $ref: '#/components/schemas/LinkPreviewBackground'
        stickers:
          type: array
          description: >-
            A sticker_set preview's first stickers, or a
            gift_collection preview's icons, in order (at most five),
            each the preview_media file at its index with its emoji,
            format and size (render lottie, animation or image as for a
            sticker message); null for one whose file is not recorded.
            Absent for other types.
          items:
            oneOf:
              - $ref: '#/components/schemas/ChatMedia'
              - type: 'null'
        gift:
          description: >-
            A gift_auction or upgraded_gift preview's gift. Absent for
            other types.
          $ref: '#/components/schemas/LinkPreviewGift'
        story:
          type: object
          description: >-
            A story or live_story preview's story: whose it is, when the
            viewer may see them (null otherwise), its id, and the
            poster's active username as StoryDetail has it. Stories
            are not archived: the card links to url. Absent for other
            types and when not stored.
          required: [poster, story_id, username]
          properties:
            poster:
              oneOf:
                - $ref: '#/components/schemas/ChatRef'
                - type: 'null'
            story_id:
              type: integer
            username:
              type: [string, 'null']
        theme:
          description: >-
            A theme preview's settings (the theme's files are not
            kept, so it is drawn from its colours). Absent for other
            types and when not stored.
          $ref: '#/components/schemas/LinkPreviewTheme'
        custom_emoji_id:
          type: string
          description: >-
            A text_composition_style preview's custom emoji id (a
            decimal string). Absent for other types.
        custom_emoji:
          description: >-
            The custom emoji of custom_emoji_id, resolved for the page
            as for text entities; null when it is not resolved (the
            card shows no icon then). Present with custom_emoji_id
            only.
          oneOf:
            - $ref: '#/components/schemas/CustomEmoji'
            - type: 'null'
    LinkPreviewBackground:
      type: object
      description: >-
        A background a link preview shows, keyed as
        ServiceBackgroundDetail: its type (null when not one this
        service knows), its image (wallpaper or pattern; null for a
        fill, a chat theme, when not recorded, and always for a
        theme's background, whose files are not kept), fill,
        intensity and the flags as there. A theme's background adds
        its name and dark.
      required: [type, image, fill, intensity, is_inverted, is_moving, is_blurred, theme_name]
      properties:
        type:
          type: [string, 'null']
          enum: [wallpaper, pattern, fill, chat_theme, null]
        image:
          oneOf:
            - $ref: '#/components/schemas/ChatMedia'
            - type: 'null'
        fill:
          oneOf:
            - $ref: '#/components/schemas/BackgroundFill'
            - type: 'null'
        intensity:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        is_inverted:
          type: boolean
        is_moving:
          type: boolean
        is_blurred:
          type: boolean
        theme_name:
          type: [string, 'null']
        name:
          type: string
          description: A theme's background's name; absent for the others.
        dark:
          type: boolean
          description: >-
            A theme's background is meant for a dark theme; absent for
            the others.
    LinkPreviewGift:
      type: object
      description: >-
        The gift of a gift_auction preview (a regular gift: its
        sticker, star_count and auction) or of an upgraded_gift
        preview (upgraded, with its model sticker as sticker and its
        symbol sticker as symbol_sticker, drawn as ServiceGiftDetail
        draws them). The stickers are the preview_media files at
        positions 0 and 1; each is null when not recorded.
      required: [sticker, symbol_sticker, star_count, upgraded, auction]
      properties:
        sticker:
          oneOf:
            - $ref: '#/components/schemas/ChatMedia'
            - type: 'null'
        symbol_sticker:
          description: An upgraded gift's symbol sticker; null for the others.
          oneOf:
            - $ref: '#/components/schemas/ChatMedia'
            - type: 'null'
        star_count:
          type: [integer, 'null']
          format: int64
          description: A regular gift's price in Telegram Stars; null for the others.
        upgraded:
          description: The upgraded gift; null for a gift auction.
          oneOf:
            - $ref: '#/components/schemas/UpgradedGift'
            - type: 'null'
        auction:
          description: >-
            A gift auction's dates and the gifts each round gives,
            each null when not stored; null for an upgraded gift.
          oneOf:
            - type: object
              required: [start_date, end_date, gifts_per_round]
              properties:
                start_date:
                  type: [string, 'null']
                  format: date-time
                end_date:
                  type: [string, 'null']
                  format: date-time
                gifts_per_round:
                  type: [integer, 'null']
            - type: 'null'
    LinkPreviewTheme:
      type: object
      description: >-
        A theme a link preview shows: the built-in theme it is based
        on (classic, day, night, tinted or arctic; null when not one
        of them), its accent colour, its background (null without
        one), the fill of outgoing messages (null without one) and
        whether it animates, and the accent colour of outgoing
        messages (null when the theme has none).
      required: [base_theme, accent_color, background, outgoing_message_fill, animate_outgoing_message_fill, outgoing_message_accent_color]
      properties:
        base_theme:
          type: [string, 'null']
          enum: [classic, day, night, tinted, arctic, null]
        accent_color:
          $ref: '#/components/schemas/RgbColor'
        background:
          oneOf:
            - $ref: '#/components/schemas/LinkPreviewBackground'
            - type: 'null'
        outgoing_message_fill:
          oneOf:
            - $ref: '#/components/schemas/BackgroundFill'
            - type: 'null'
        animate_outgoing_message_fill:
          type: boolean
        outgoing_message_accent_color:
          oneOf:
            - $ref: '#/components/schemas/RgbColor'
            - type: 'null'
    ChatWindow:
      type: object
      description: Messages oldest first, and whether more lie either side.
      required: [messages, has_older, has_newer]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        has_older:
          type: boolean
        has_newer:
          type: boolean

    # Lists: the rows of a list page and its state from the query string.
    Cond:
      type: object
      description: >-
        A filter of a list. field is one of the list's own filter keys
        (with the ops contains, =, !=, >, <, >=, <=, empty, is) or, on
        the users, groups and message lists, a field of ListState.fields
        with one of its operators (the advanced search's, as in
        web/docs/search-api.md). The filters form one chain, each joined
        to the next by its n; AND binds tighter than OR, as in SQL.
      required: [field, op, value]
      properties:
        field:
          type: string
        op:
          type: string
          enum: ['=', '!=', '>', '<', '>=', '<=', contains, empty, is, LIKE, NOT LIKE, '%LIKE%', 'NOT %LIKE%', matches, IS NULL, IS NOT NULL, in]
        value:
          description: >-
            A string; ignored (send "") for IS NULL and IS NOT NULL.
            For in (an enum field: one of a list of values) a list of
            1 to 128 strings, and only for in.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        n:
          type: string
          enum: [AND, OR]
          description: >-
            The connector to the next filter; absent is AND (and the
            answer's conds leave it out then). Not taken by the files
            list, whose filters are all ANDed.
    ListState:
      type: object
      required: [total, page, pages, per, sort, dir, q, conds, total_exact]
      properties:
        total:
          type: integer
          format: int64
        page:
          type: integer
        pages:
          type: integer
        per:
          type: integer
        sort:
          type: string
        dir:
          type: string
          enum: [asc, desc]
        q:
          type: string
        conds:
          type: array
          items:
            $ref: '#/components/schemas/Cond'
        archive_total:
          type: integer
          format: int64
          description: Everything in the archive; full-access viewers only.
        total_exact:
          type: boolean
          description: >-
            False when total is an estimate (a count that ran out of
            time, or the table's row estimate, as group_messages without
            conditions): show it as "about". Always sent by the service.
        error:
          $ref: '#/components/schemas/ListError'
        fields:
          type: array
          description: >-
            The users, groups and message lists: the search fields the
            viewer may filter by, with their operators and whether they
            sort (a member's users only by id, name, username, type and
            photo). Absent on the files list.
          items:
            $ref: '#/components/schemas/SearchField'
    ListError:
      type: object
      description: >-
        Why the list shows its rows without the search asked for:
        bad_search, a filter, connector, value or search text the list
        refuses (message in the search's words, naming the field), or
        search_timeout, the search ran out of its time limit. q and
        conds are then empty, as applied; sort and page size are kept
        (a sort that alone runs out of time falls back to the default).
        When even the plain list runs out of time, rows is empty.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [bad_search, search_timeout]
        message:
          type: string

    # Page props, one per route (web/app/src/routes/).
    PasswordChangeProps:
      type: object
      description: >-
        The forced password change after a password set for the
        account, typed by its creator or a temporary one
        (decisions/2026-11-18-email-optional.md); the page posts
        to POST /api/account/password, then loads `next`.
      required: [username, next]
      properties:
        username:
          type: string
        next:
          type: string
          description: The path of the page asked for.
    LoginProps:
      type: object
      required: [next]
      properties:
        next:
          type: [string, 'null']
          description: Where to go after signing in; same-site paths only.
    KPI:
      type: object
      description: >-
        One dashboard card: a total and today's count (today being the
        viewer's calendar day in its timezone), within the viewer's
        scope.
      required: [key, total, today]
      properties:
        key:
          type: string
          enum: [users, groups, group_messages, private_messages, files]
        total:
          type: integer
          format: int64
        today:
          type: integer
          format: int64
    DashboardSeries:
      type: object
      description: >-
        The dashboard's messages per period over a range
        (getDashboardSeries).
      required: [period, start, end, live, tz, limit, points]
      properties:
        period:
          type: string
          enum: [minute, hour, 4h, day, week, month, quarter, year]
        start:
          type: integer
          format: int64
          description: The snapped start, the start of the first period (unix).
        end:
          type: integer
          format: int64
          description: The snapped end, the end of the last period (unix).
        live:
          type: boolean
          description: The end asked for was now.
        tz:
          type: string
          description: The IANA timezone the periods are counted in.
        limit:
          type: [integer, 'null']
          format: int64
          description: The period's longest range in seconds; null when unlimited.
        points:
          type: array
          items:
            type: object
            required: [at, n]
            properties:
              at:
                type: integer
                format: int64
                description: The start of the period (unix), in the viewer's timezone.
              n:
                type: integer
                format: int64
                description: The messages in the period.
    DashboardProps:
      type: object
      required: [kpis, series, busiest, deleted]
      properties:
        kpis:
          type: array
          items:
            $ref: '#/components/schemas/KPI'
        series:
          description: >-
            The chart's series as getDashboardSeries answers it for the
            viewer's dashboard preferences in effect (the viewer's
            dashboard_period with its dashboard_start and dashboard_end,
            or its dashboard_last ending now; by default per hour over
            the last 48 hours, ending now).
          $ref: '#/components/schemas/DashboardSeries'
        busiest:
          type: array
          items:
            $ref: '#/components/schemas/GroupCounted'
        deleted:
          type: array
          items:
            type: object
            required: [id, scope, chat, sender, snippet, deleted_at, message_id]
            properties:
              id:
                type: integer
                format: int64
              scope:
                $ref: '#/components/schemas/MessageScope'
              chat:
                $ref: '#/components/schemas/GroupSummary'
              sender:
                $ref: '#/components/schemas/UserSummary'
              snippet:
                type: string
              deleted_at:
                type: string
              deleted_on_recheck:
                type: boolean
                description: >-
                  Present and true when the deletion was found by a
                  recheck against Telegram (MessageRow.deleted_on_recheck).
              message_id:
                type: integer
                format: int64
        status:
          type: object
          description: >-
            The logger status card. Only for a viewer who sees every
            group and private chat (a superadmin, or an admin with no
            hidden groups and private chats not hidden); absent for
            everyone else, since it describes the whole archive.
          required: [session, last_message_at, forwarding_active, store_used, store_total, store_ratio]
          properties:
            session:
              type: string
              enum: [connected, disconnected]
              description: >-
                connected while the daemon reports its TDLib client
                ready (daemon GET /v1/status); disconnected in any
                other state, and when the daemon API is off or does
                not answer within a second.
            last_message_at:
              type: string
              description: >-
                When the newest stored message (group or private) was
                logged, RFC 3339 in UTC; empty when no message is
                stored.
            forwarding_active:
              type: integer
              description: >-
                The forwarding configurations that forward now, as
                the forwarding index counts active ones: enabled
                Telegram-to-Discord webhooks, and enabled
                Discord-to-Telegram routes whose Telegram and Discord
                bots are both enabled.
            store_used:
              type: string
              description: >-
                The stored files' size in binary units with one
                decimal, KiB to TiB ("349.2 GiB"): the daemon's count
                (GET /v1/storage), or the sum over the stored files
                when the daemon does not answer.
            store_total:
              type: string
              description: >-
                The store's cap (TG_STORAGE_MAX_BYTES) in the same
                units, or, with no cap or no answer from the daemon,
                the size of the file system holding the store; "0.0
                KiB" when neither is known.
            store_ratio:
              type: number
              description: >-
                store_used over store_total, clamped to 0..1; 0 when
                store_total is 0.
    UsersProps:
      allOf:
        - $ref: '#/components/schemas/ListState'
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: '#/components/schemas/UserRow'
            backend:
              $ref: '#/components/schemas/SearchBackend'
            highlights:
              type: array
              description: >-
                As SearchAnswer.highlights, aligned to rows: with
                highlight=1 in the page's query and the engine
                answering a bio matches filter.
              items:
                type: array
                items:
                  type: string
            engine:
              description: >-
                The capabilities entry of the list's entity
                (GET /api/search/capabilities), so the page can offer
                the engine's options; present only with an engine
                configured. The page's query takes the search API's
                options for its filters: fuzzy=1, highlight=1 and
                engine=mysql.
              $ref: '#/components/schemas/SearchEngineEntity'
    UserRow:
      description: >-
        A row of the users list: the summary and, for a viewer who sees
        users in full, the Drogon list's other columns, always sent
        then (absent for a member).
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            phone:
              type: string
            bio:
              type: string
            restriction_reason:
              type: string
            has_sensitive_content:
              type: boolean
            restricts_new_chats:
              type: boolean
            paid_message_star_count:
              type: integer
              format: int64
            personal_chat_id:
              type: [integer, 'null']
              format: int64
            emoji_status:
              type: [string, 'null']
              description: The emoji status's custom emoji id (64-bit, as a string); null for none.
    UserProps:
      description: >-
        A full-access viewer gets the profile; a member only the groups
        it shares with the person (limited), web-accounts.md section 5.
      oneOf:
        - type: object
          required: [user, groups, history, activity, can_private, limited, history_next, can_lookup_name, lookup_pending, lookup_pending_since, lookup_pending_error]
          properties:
            limited:
              type: boolean
              const: false
            user:
              $ref: '#/components/schemas/UserFull'
            groups:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/GroupSummary'
                  - type: object
                    required: [msgs]
                    properties:
                      msgs:
                        type: integer
            history:
              type: array
              description: The newest page of the timeline (UserHistoryPage).
              items:
                $ref: '#/components/schemas/HistoryEntry'
            history_next:
              type: [string, 'null']
              description: >-
                The cursor of the timeline's next page, for GET
                /api/users/{id}/history?before= (or the history page's
                own ?before=); null when this is all of it. Always
                sent by the service.
            activity:
              type: array
              items:
                type: integer
            can_private:
              type: boolean
            can_lookup_name:
              type: boolean
              description: >-
                The page offers "Look up real name" (POST
                /api/users/{id}/lookup-name): the user is a contact,
                the viewer may (superadmins), and the daemon's API is
                set up. Always sent by the service.
            lookup_pending:
              type: boolean
              description: >-
                A "Look up real name" removed the contact and has not
                added it back yet (a telegram_contact_lookups row is
                left for the user; the daemon keeps retrying). Always
                sent by the service.
            lookup_pending_since:
              type: [string, 'null']
              description: When that lookup started; null when none is pending.
            lookup_pending_error:
              type: [string, 'null']
              description: >-
                Its last error adding the contact back ("" for none
                yet); null when none is pending.
        - type: object
          required: [limited, user, shared_groups]
          properties:
            limited:
              type: boolean
              const: true
            user:
              $ref: '#/components/schemas/UserSummary'
            shared_groups:
              type: array
              items:
                $ref: '#/components/schemas/GroupSummary'
    GroupsProps:
      allOf:
        - $ref: '#/components/schemas/ListState'
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/GroupSummary'
                  - type: object
                    required: [msg_count, admin_count, description, created_at, updated_at, member_count, member_count_at]
                    properties:
                      msg_count:
                        type: integer
                      admin_count:
                        type: integer
                      description:
                        type: string
                      created_at:
                        type: string
                      updated_at:
                        type: string
                        description: Always sent by the service.
            backend:
              $ref: '#/components/schemas/SearchBackend'
            highlights:
              type: array
              description: >-
                As SearchAnswer.highlights, aligned to rows: with
                highlight=1 in the page's query and the engine
                answering a description matches filter.
              items:
                type: array
                items:
                  type: string
            engine:
              description: >-
                The capabilities entry of the list's entity
                (GET /api/search/capabilities), so the page can offer
                the engine's options; present only with an engine
                configured. The page's query takes the search API's
                options for its filters: fuzzy=1, highlight=1 and
                engine=mysql.
              $ref: '#/components/schemas/SearchEngineEntity'
    GroupPublicProps:
      type: object
      description: >-
        The group route (/groups/{id}, not its admins or history tabs)
        for an exposed group the viewer's scope does not see: signed
        out, a member without it, an admin it is hidden from. As public
        as the group's chat: its summary and counts, with none of its
        admins, history, posters, activity or files. A group neither
        visible nor exposed answers a sign-in to a visitor and 404 to
        the others.
      required: [public, group]
      properties:
        public:
          type: boolean
          const: true
        group:
          allOf:
            - $ref: '#/components/schemas/GroupSummary'
            - type: object
              required: [usernames, description, members, msg_count, created_at, member_count, member_count_at]
              properties:
                usernames:
                  type: array
                  items:
                    $ref: '#/components/schemas/Username'
                description:
                  type: string
                members:
                  type: integer
                  description: The people the archive has seen in the group, as GroupFull.members.
                msg_count:
                  type: integer
                created_at:
                  type: string
    GroupProps:
      type: object
      required: [group, admins, history, top_posters, activity, history_next, hide_member_list, can_hide_member_list]
      properties:
        hide_member_list:
          type: boolean
          description: >-
            A superadmin hid the channel's member list: only superadmins
            get it (GET /api/groups/{id}/members).
        can_hide_member_list:
          type: boolean
          description: >-
            Whether the viewer may change hide_member_list (PATCH
            /api/groups/{id}): a superadmin, on a channel.
        group:
          $ref: '#/components/schemas/GroupFull'
        admins:
          type: array
          items:
            $ref: '#/components/schemas/GroupAdmin'
        history:
          type: array
          description: The newest page of the timeline (GroupHistoryPage).
          items:
            $ref: '#/components/schemas/GroupHistoryEntry'
        history_next:
          type: [string, 'null']
          description: >-
            The cursor of the timeline's next page, for GET
            /api/groups/{id}/history?before= (or the page's own
            ?before=); null when this is all of it. Always sent by the
            service.
        top_posters:
          type: array
          items:
            type: object
            required: [user, msgs]
            properties:
              user:
                $ref: '#/components/schemas/UserSummary'
              msgs:
                type: integer
        activity:
          type: array
          items:
            type: integer
    GroupMember:
      type: object
      required: [user, status, joined_at]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        status:
          type: string
          enum: [creator, administrator, member, restricted]
          description: restricted is a restricted member still in the group.
        joined_at:
          type: [string, 'null']
          format: date-time
          description: When the member joined; null when Telegram does not say.
        matched_by:
          type: string
          enum: [id, search]
          description: >-
            Only in a search (getGroupMembers' q): id when q is this
            member's user id, search when Telegram's member search
            found it.
    GroupMembersPage:
      type: object
      required: [available, reason, total, members, offset, limit]
      properties:
        available:
          type: boolean
        reason:
          type: string
          description: >-
            Empty when available. Otherwise: not_allowed (a channel
            where the logging account is not an administrator, or a
            group that hides its members), hidden (a superadmin hid
            the channel's list; never for a superadmin), not_member
            (the account is not in the group), flood_wait (Telegram
            rate-limited the account; see retry_after), unavailable
            (the daemon is off or did not answer), error (Telegram
            failed otherwise). A client treats a reason it does not
            know as "not available".
        retry_after:
          type: integer
          format: int64
          description: With flood_wait, the seconds Telegram asked to wait.
        total:
          type: [integer, 'null']
          format: int64
          description: >-
            Telegram's member count: the daemon's with the list, else
            the stored one (GroupSummary.member_count); null when none
            is known. In a search, the number of matches (the id match
            included) when the daemon knows it, else null.
        members:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'
        offset:
          type: integer
        limit:
          type: integer
    GroupMembersProps:
      description: >-
        The group_members route (/groups/{id}/members): the group's
        page as its other tabs have it, and the page of members its
        ?offset= (and ?limit= and the search ?q=, as getGroupMembers
        takes them; out of range reads as the first page, a bad q as
        no search) names. For a viewer who sees the
        group and users in full; anyone else gets not_found, and a
        signed-out visitor is asked to sign in.
      allOf:
        - $ref: '#/components/schemas/GroupProps'
        - $ref: '#/components/schemas/GroupMembersPage'
    GroupFilesProps:
      description: >-
        The group page's Files tab (route group_files): the group
        page's own props (GroupProps), as its other tabs carry them,
        and beside them the first page of its files for the page's kind
        and before, as getGroupFiles answers it.
      allOf:
        - $ref: '#/components/schemas/GroupProps'
        - $ref: '#/components/schemas/GroupFilesPage'
    GroupFilesPublicProps:
      description: >-
        The Files tab of an exposed group for a viewer whose scope does
        not see the group (getGroupFiles): the public group page's
        props (GroupPublicProps, public true), with no admins, history
        or posters, and the first page of its files beside them.
      allOf:
        - $ref: '#/components/schemas/GroupPublicProps'
        - $ref: '#/components/schemas/GroupFilesPage'
    GroupFilesPage:
      type: object
      required: [kinds, kind, rows, next_before]
      properties:
        kinds:
          type: array
          description: >-
            The kinds the group's messages carry, in the order of the
            enum, for the sub tabs; a kind it has none of is left out.
            When counting them takes too long (a large group), every
            kind is listed with a null count, as which are present is
            not known then. Counts are kept about two minutes.
          items:
            $ref: '#/components/schemas/FileKindCount'
        kind:
          type: string
          enum: [all, photo, video, animation, audio, voice, document, sticker, video_note]
          description: The kind listed.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/GroupFileRow'
        next_before:
          type: [integer, 'null']
          format: int64
          description: >-
            The before of the next page (the last row's message_id);
            null when this is the last one.
    FileKindCount:
      type: object
      required: [kind, count]
      properties:
        kind:
          type: string
          enum: [photo, video, animation, audio, voice, document, sticker, video_note]
        count:
          type: [integer, 'null']
          description: The messages of that kind with a file; null when not counted.
    TabMessage:
      type: object
      description: The message a row of the group's Files or Polls tab comes from.
      required: [message_id, message_row_id, date, sender, chat_link]
      properties:
        message_id:
          type: integer
          format: int64
          description: The message's Telegram id, as the chat's ?at= takes it.
        message_row_id:
          type: integer
          format: int64
          description: The message's row, for /messages/group/{message_row_id}.
        date:
          type: string
        sender:
          oneOf:
            - $ref: '#/components/schemas/TabSender'
            - type: 'null'
          description: >-
            The message's sender. Null is allowed but not sent for a
            group's messages: one that names no sender has the name
            "(unknown)" and a null id.
        chat_link:
          type: string
          description: The message in the group's chat, /groups/{id}/chat?at=<message_id>.
    TabSender:
      type: object
      description: >-
        Who sent the message, as the chat names it: a user, or a chat
        posting in its own name (a channel, the group itself for an
        anonymous admin) with the chat's id, title, username and photo.
        A chat the viewer does not see is not named: id null, name
        "(hidden chat)"; a sender known only by its signature (its
        name) has a null id too.
      required: [id, name, username, photo]
      properties:
        id:
          type: [integer, 'null']
          format: int64
        name:
          type: string
        username:
          type: string
        photo:
          type: [string, 'null']
    GroupFileRow:
      description: >-
        A file of the group's Files tab: the file as FileRow has it
        (without FileRow's chat, sender and message, of the first
        message that carried it anywhere), and the message of the group
        that carried it.
      allOf:
        - type: object
          required: [id, file_type, name, ext, size, stored, fetchable, url, thumb]
          properties:
            id:
              type: integer
              format: int64
              description: The file's id (telegram_files).
            file_type:
              type: string
              enum: [photo, video, document, audio, voice, sticker, animation, video_note, unknown]
              description: As FileRow.file_type.
            name:
              type: string
            ext:
              type: string
            render:
              $ref: '#/components/schemas/MediaRender'
              description: >-
                As FileRow.render. Always sent; optional in this
                description.
            size:
              type: integer
              format: int64
            stored:
              type: boolean
            fetchable:
              type: boolean
              description: As FileRow.fetchable.
            fetch:
              type: [string, 'null']
              description: As FileRow.fetch.
            url:
              type: [string, 'null']
              description: As FileRow.url.
            thumb:
              type: [string, 'null']
              description: As FileRow.thumb.
            minithumb:
              type: string
              description: As FileRow.minithumb; absent when there is none.
            duration:
              type: integer
              description: >-
                A video's, audio file's, voice note's or video note's
                length in seconds, from its message's stored detail
                (content_extra); absent when the message has none.
        - $ref: '#/components/schemas/TabMessage'
    GroupPollsProps:
      description: >-
        The group page's Polls tab (route group_polls): the group
        page's own props (GroupProps), as its other tabs carry them,
        and beside them the first page of its polls for the page's
        before, as getGroupPolls answers it.
      allOf:
        - $ref: '#/components/schemas/GroupProps'
        - $ref: '#/components/schemas/GroupPollsPage'
    GroupPollsPublicProps:
      description: >-
        The Polls tab of an exposed group for a viewer whose scope does
        not see the group, as GroupFilesPublicProps.
      allOf:
        - $ref: '#/components/schemas/GroupPublicProps'
        - $ref: '#/components/schemas/GroupPollsPage'
    GroupPollsPage:
      type: object
      required: [rows, next_before]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/GroupPollRow'
        next_before:
          type: [integer, 'null']
          format: int64
          description: >-
            The before of the next page (the last row's message_id);
            null when this is the last one.
    GroupPollRow:
      allOf:
        - $ref: '#/components/schemas/TabMessage'
        - type: object
          required: [poll]
          properties:
            poll:
              description: >-
                The poll as the chat's message detail shows it: closed
                once past its close date, at most 20 options with
                options_total; null when the poll was never stored.
              oneOf:
                - $ref: '#/components/schemas/PollDetail'
                - type: 'null'
    FilesProps:
      description: >-
        The files list (route files). Its filters (Cond field, ops):
        id, size and hits (=, !=, >, <); file_type (=, != one of
        FileRow's file_type values, unknown included, or in a list of
        them); name, ext and
        tg_file_id (contains, =, empty); stored (is yes or no); sha256
        (=, != a digest of 64 hex digits, either case); created_at,
        updated_at and accessed_at (>, < a day, YYYY-MM-DD); role (=,
        != one of FileRole's values, or in a list of them: the file
        plays that role in a message the viewer sees, whether or not
        it is also another message's own file). Its sorts:
        id, name, file_type, ext, size, hits, created_at (the default)
        and accessed_at. The search text matches the name, and the id
        when it is a number.
      allOf:
        - $ref: '#/components/schemas/ListState'
        - type: object
          required: [rows, preview, can_fetch]
          properties:
            rows:
              type: array
              items:
                $ref: '#/components/schemas/FileRow'
            preview:
              oneOf:
                - $ref: '#/components/schemas/FileRow'
                - type: 'null'
            can_fetch:
              type: boolean
            stored_bytes:
              type: integer
              format: int64
    MessagesProps:
      allOf:
        - $ref: '#/components/schemas/ListState'
        - type: object
          required: [rows, scope]
          properties:
            rows:
              type: array
              items:
                $ref: '#/components/schemas/MessageRow'
            scope:
              $ref: '#/components/schemas/MessageScope'
            backend:
              $ref: '#/components/schemas/SearchBackend'
            highlights:
              type: array
              description: >-
                As SearchAnswer.highlights, aligned to rows: with
                highlight=1 in the page's query and the engine
                answering the search text.
              items:
                type: array
                items:
                  type: string
            facets:
              type: array
              description: >-
                As SearchAnswer.facets: with facets=1 in the page's
                query and the engine answering the whole search.
              items:
                $ref: '#/components/schemas/SearchFacet'
            engine:
              description: >-
                The capabilities entry of the list's entity
                (GET /api/search/capabilities), so the page can offer
                the engine's options; present only with an engine
                configured. The page's query takes the search API's
                options for its search text: fuzzy=1, highlight=1,
                facets=1 and engine=mysql.
              $ref: '#/components/schemas/SearchEngineEntity'
    MessageProps:
      type: object
      required: [message]
      properties:
        message:
          $ref: '#/components/schemas/MessageFull'
    ChatProps:
      type: object
      description: >-
        The chat page's first window (getChatMessages, limit 60 or the
        page's ?limit=, clamped to 1..100). The page's query opens it,
        by the first of these that parses: ?at=<message id> around
        that message; ?after_ts=<unix time> at the first message sent
        then or later (the Drogon page's links); ?date= around the
        first message at or after a day or a time in the viewer's
        timezone (Viewer.timezone: YYYY-MM-DD, YYYY-MM-DDTHH:MM,
        YYYY-MM-DD HH:MM, either with :SS, or RFC 3339 with its own
        offset); ?after=<message id> at the messages after it, and
        ?after=0 at the oldest messages. Without one, or past the end,
        the newest messages. `at` names the message opened at: the
        found one, or for ?after= the window's first. The Drogon
        page's #msg-<message id> anchors name message_id, so a client
        maps them to it. ?topic=<topic id> limits the window to one
        forum topic's messages, as the chat window's topic does.
      required: [chat, messages, has_older, has_newer, at, topics, topic]
      properties:
        chat:
          oneOf:
            - type: object
              required: [kind, group]
              properties:
                kind:
                  const: group
                group:
                  allOf:
                    - $ref: '#/components/schemas/GroupSummary'
                    - type: object
                      required: [members, msg_count, member_count, member_count_at]
                      properties:
                        members:
                          type: integer
                          description: >-
                            How many people the archive has seen in the
                            group: the distinct users who sent a
                            message there and its administrators.
                            Telegram's own count is member_count.
                        msg_count:
                          type: integer
            - type: object
              required: [kind, user, count]
              properties:
                kind:
                  const: user
                user:
                  type: object
                  required: [id, name, photo]
                  properties:
                    id:
                      type: integer
                      format: int64
                    name:
                      type: string
                    photo:
                      type: [string, 'null']
                count:
                  type: integer
                  format: int64
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        has_older:
          type: boolean
        has_newer:
          type: boolean
        at:
          type: [integer, 'null']
          format: int64
          description: The message the page was opened at, if any.
        topics:
          type: array
          description: >-
            A forum group's topics, pinned ones first, then the newest;
            empty for other chats.
          items:
            $ref: '#/components/schemas/ChatTopic'
        topic:
          type: [integer, 'null']
          format: int64
          description: The topic ?topic= limits the window to, or null.
    SettingsProps:
      type: object
      required: [account, notices]
      properties:
        account:
          type: object
          required: [username, name, role, email, email_verified]
          properties:
            username:
              type: string
            name:
              type: string
            role:
              type: string
            email:
              type: [string, 'null']
            email_verified:
              type: boolean
        notices:
          type: array
          items:
            type: string
    Prefs:
      type: object
      description: Every field null or absent is the site default.
      properties:
        timezone:
          type: [string, 'null']
        date_format:
          type: [string, 'null']
          enum: [24h, 12h, iso, null]
        lang:
          type: [string, 'null']
          enum: [en, id, null]
        theme:
          type: [string, 'null']
          enum: [system, light, dark, null]
        sidebar:
          type: [string, 'null']
          enum: [open, collapsed, null]
          description: Whether the menu starts open or collapsed; null is open.
        dashboard_numbers:
          type: [string, 'null']
          enum: [exact, compact, null]
          description: The dashboard's figures in full (12,345) or shortened (12k); null is exact.
        dashboard_period:
          type: [string, 'null']
          enum: [minute, hour, 4h, day, week, month, quarter, year, null]
          description: The dashboard chart's period; null is hour.
        dashboard_variant:
          type: [string, 'null']
          enum: [bars, line, area, total, null]
          description: >-
            How the dashboard chart draws its series: bars, a line, an
            area (the line filled) or the running total; null is bars.
        dashboard_start:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: >-
            The start of the chart's fixed range (unix seconds), set
            with dashboard_end; null with a range that ends now.
        dashboard_end:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: >-
            The end of the chart's fixed range (unix seconds), after
            dashboard_start; null is a range that ends now.
        dashboard_last:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: >-
            The length in seconds of a range that ends now; null is 48
            hours (at most the period's limit).
        rows_per_page:
          type: [integer, 'null']
        landing:
          type: [string, 'null']
        chat_auto_load:
          type: [boolean, 'null']
        chat_live:
          type: [boolean, 'null']
        chat_media:
          type: [string, 'null']
          enum: [auto, click, null]
        chat_show_deleted:
          type: [boolean, 'null']
        chat_show_edited:
          type: [boolean, 'null']
        chat_show_service:
          type: [boolean, 'null']
    PreferencesProps:
      type: object
      required: [prefs, timezones, landing_options, pinned, saved_searches]
      properties:
        prefs:
          $ref: '#/components/schemas/Prefs'
        timezones:
          type: array
          items:
            type: string
        landing_options:
          type: array
          description: Pairs of [path, label].
          items:
            type: array
            prefixItems:
              - type: string
              - type: string
            minItems: 2
            maxItems: 2
        pinned:
          type: array
          items:
            type: object
            required: [id, title, photo]
            properties:
              id:
                type: integer
                format: int64
              title:
                type: string
              photo:
                type: [string, 'null']
        saved_searches:
          type: array
          items:
            type: object
            required: [id, title, url]
            properties:
              id:
                type: integer
                format: int64
              title:
                type: string
              url:
                type: string
    SessionsProps:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            type: object
            required: [id, device, ip, place, started, last, current]
            properties:
              id:
                type: string
              device:
                type: string
              ip:
                type: string
              place:
                type: string
              started:
                type: string
              last:
                type: string
              current:
                type: boolean

    # Accounts and federations.
    Ability:
      type: string
      enum: [forward, fetch_files, mcp_tokens]
    Fed:
      type: object
      required: [id, name, default]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        default:
          type: boolean
    Restrict:
      type: object
      description: An admin's restrictions (web-accounts.md section 4).
      required: [hide_private, hide_groups, join_chat]
      properties:
        hide_private:
          type: boolean
        hide_groups:
          type: array
          items:
            $ref: '#/components/schemas/PickItem'
        join_chat:
          type: boolean
          description: >-
            Whether the admin may join chats (the join_chat page,
            previewJoin and joinChat); off by default, granted by a
            superadmin.
    AccountRow:
      type: object
      required: [id, username, name, email, email_verified, invited, role, active, last_signin, last_superadmin, admin_of, restrict, grants, abilities, audit]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
        email:
          type: [string, 'null']
        email_verified:
          type: boolean
          description: >-
            The address is verified: by its verification link, or by
            setting the password from a link sent to it.
        invited:
          type: boolean
          description: >-
            Has not set its own password yet: it has none (invited, or
            reset by link, waiting for its link) or one set for it (typed
            by its creator, or a temporary one) that it must change.
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean
        last_signin:
          type: [string, 'null']
        last_superadmin:
          type: boolean
        admin_of:
          type: array
          items:
            type: integer
            format: int64
        restrict:
          oneOf:
            - $ref: '#/components/schemas/Restrict'
            - type: 'null'
        grants:
          type: array
          description: >-
            A member's federations, each with the groups granted to it
            there, ascending by id; [] for the other roles. A group the
            archive no longer has is named by its id ("#-100..."). An
            admin is shown only the groups of federations it
            administers that it sees: a group hidden from it, or
            granted in another federation, is left out, and its id
            reads "hidden" in the audit lines. Such a grant is not the
            admin's to change: a PATCH from it keeps it.
          items:
            type: object
            required: [fed, groups]
            properties:
              fed:
                type: integer
                format: int64
              groups:
                type: array
                items:
                  $ref: '#/components/schemas/PickItem'
        abilities:
          type: array
          description: A member's abilities, as stored; [] for the other roles.
          items:
            $ref: '#/components/schemas/Ability'
        audit:
          type: array
          items:
            type: object
            required: [what, by, at]
            properties:
              what:
                type: string
              by:
                type: string
              at:
                type: string
    GrantWrite:
      type: object
      required: [fed, group_ids]
      properties:
        fed:
          type: integer
          format: int64
        group_ids:
          type: array
          items:
            type: integer
            format: int64
    AccountCreate:
      type: object
      required: [username, name, role]
      properties:
        username:
          type: string
        name:
          type: string
        email:
          type: [string, 'null']
          description: The address; optional (absent, null or "" for none).
        role:
          $ref: '#/components/schemas/Role'
        password:
          type: [string, 'null']
          description: >-
            The first password, at least 8 bytes; absent, null or ""
            has the server generate a temporary one (temporary_password).
            The account changes it at its first sign-in. Not with
            invite.
        invite:
          type: boolean
          description: >-
            Mail a set-password link instead of giving a password;
            needs an address and mail set up (409 otherwise).
        grants:
          type: array
          description: >-
            A member's federations and groups. Required, with at least
            one federation the viewer administers, when an admin
            creates the member (else 400 grants_required). group_ids
            are the groups granted in the federation.
          items:
            $ref: '#/components/schemas/GrantWrite'
    AccountCreated:
      type: object
      required: [id, invited]
      properties:
        id:
          type: integer
          format: int64
        invited:
          type: boolean
          description: >-
            true: an invitation was mailed (invite was asked for); the
            account has no password until it sets one from the link.
        temporary_password:
          type: string
          description: >-
            Present only when the server generated the first password:
            shown once; give it to the account's owner, who must change
            it at the first sign-in.
    PasswordReset:
      type: object
      required: [link_sent]
      properties:
        link_sent:
          type: boolean
          description: >-
            true: the password is removed and a set-password link went
            to the verified address. false: temporary_password is the
            account's new password.
        temporary_password:
          type: string
          description: >-
            Present when link_sent is false: shown once; the account
            must change it at its next sign-in.
    AccountPatch:
      type: object
      description: The fields to change; the others stay.
      properties:
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        email:
          type: string
          format: email
        admin_of:
          type: array
          description: >-
            The federations an admin administers, replacing its list;
            superadmins only.
          items:
            type: integer
            format: int64
        restrict:
          type: object
          description: An admin's restrictions; superadmins only.
          required: [hide_private, hide_groups, join_chat]
          properties:
            hide_private:
              type: boolean
            hide_groups:
              type: array
              items:
                type: integer
                format: int64
            join_chat:
              type: boolean
        grants:
          type: array
          description: >-
            A member's grants, replacing the federations it is filed
            in. An admin changes only those in its own federations; the
            others stay.
          items:
            $ref: '#/components/schemas/GrantWrite'
        abilities:
          type: array
          description: >-
            A member's abilities, replacing its list: forward (set up
            forwarding of its groups, seeing only its own
            configurations), fetch_files (have the daemon fetch
            files the store does not hold) and mcp_tokens (mint and
            manage its own MCP tokens). [] removes them; removing
            mcp_tokens leaves the member's tokens working until they
            are revoked.
          items:
            $ref: '#/components/schemas/Ability'
    AccountsProps:
      type: object
      required: [accounts, federations, all_federations, editable]
      properties:
        mail:
          type: boolean
          description: >-
            Whether mail is configured. Without it, set-password links
            cannot be sent: creating with invite, and resending an
            invitation, answer 409 mail_off, so the page should not
            offer them. The service always sends it.
        editable:
          type: object
          description: >-
            Which parts of an account the server can change today; the
            page offers only those. federations (admin_of, and the
            federations of grants), group_grants (the groups inside a
            grant) and abilities (a member's forward, fetch_files and
            mcp_tokens) are true. restrictions is true: every admin
            restriction (hide_private, hide_groups and the join_chat
            grant) can be set. restrict_private and restrict_groups stay
            true as well; they named the restrictions that could be set
            while restrictions was still false.
          required: [federations, group_grants, restrictions, restrict_private, restrict_groups, abilities]
          properties:
            federations:
              type: boolean
            group_grants:
              type: boolean
            restrictions:
              type: boolean
            restrict_private:
              type: boolean
            restrict_groups:
              type: boolean
            abilities:
              type: boolean
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountRow'
        federations:
          type: array
          description: >-
            The federations the viewer administers (every one for a
            superadmin), Default first and then by name, with how many
            groups it can see in each; the groups come from the chat
            search.
          items:
            allOf:
              - $ref: '#/components/schemas/Fed'
              - type: object
                required: [group_count]
                properties:
                  group_count:
                    type: integer
        all_federations:
          type: array
          description: >-
            Every federation, Default first and then by name, to name
            a member's federations the viewer does not administer.
          items:
            $ref: '#/components/schemas/Fed'
    FedPerson:
      type: object
      required: [id, username, name]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
    FederationRow:
      type: object
      required: [id, name, description, default, created, groups, group_count, admins, members]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          description: Free text about the federation; empty for none.
        default:
          type: boolean
        created:
          type: [string, 'null']
        groups:
          type: array
          description: >-
            A preview: at most 12 of the federation's groups the viewer
            can see, busiest first; group_count counts all its groups.
            Default's are the groups in no other federation.
          items:
            $ref: '#/components/schemas/GroupSummary'
        group_count:
          type: integer
        admins:
          type: array
          items:
            $ref: '#/components/schemas/FedPerson'
        members:
          type: array
          items:
            $ref: '#/components/schemas/FedPerson'
    FederationsProps:
      type: object
      required: [federations, editable, admin_options]
      properties:
        federations:
          type: array
          description: >-
            Every federation for a superadmin, the ones it administers
            for an admin; Default first, then by name.
          items:
            $ref: '#/components/schemas/FederationRow'
        editable:
          type: boolean
          description: Whether the viewer changes federations (superadmins).
        admin_options:
          type: array
          description: >-
            The active admins a superadmin may make admins of a
            federation; empty for an admin.
          items:
            $ref: '#/components/schemas/FedPerson'
    FederationDetail:
      type: object
      required: [id, name, description, default, created, created_by, group_count]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          description: Free text about the federation; empty for none.
        default:
          type: boolean
        created:
          type: [string, 'null']
          format: date-time
          description: When it was made; null for Default.
        created_by:
          description: >-
            The superadmin that made it; null for Default and when that
            account is gone.
          oneOf:
            - $ref: '#/components/schemas/FedPerson'
            - type: 'null'
        group_count:
          type: integer
          description: How many of its groups the viewer sees.
    FederationCanEdit:
      type: object
      description: >-
        What the viewer may change of the federation: a superadmin
        everything but Default's name, groups and deletion; an admin of
        it the name (not Default's) and the description only.
      required: [name, description, groups, admins, delete]
      properties:
        name:
          type: boolean
        description:
          type: boolean
        groups:
          type: boolean
        admins:
          type: boolean
        delete:
          type: boolean
    FederationGroupsPage:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroupCounted'
        next_cursor:
          type: [string, 'null']
        total:
          type: integer
          description: How many groups match, on every page.
    FederationDetailProps:
      type: object
      required: [federation, admins, members, groups, can_edit]
      properties:
        federation:
          $ref: '#/components/schemas/FederationDetail'
        admins:
          type: array
          description: Its admins, by username (superadmins are not listed).
          items:
            $ref: '#/components/schemas/FedPerson'
        members:
          type: array
          description: The members filed in it, by username.
          items:
            $ref: '#/components/schemas/FedPerson'
        groups:
          $ref: '#/components/schemas/FederationGroupsPage'
        can_edit:
          $ref: '#/components/schemas/FederationCanEdit'
    FederationWrite:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          maxLength: 2000
          description: >-
            Free text about the federation, trimmed: at most 2000
            characters, with no control characters but newline and tab
            (CR LF counts as a newline). An empty one clears it.
        group_ids:
          type: array
          description: Not for the Default federation.
          items:
            type: integer
            format: int64
        admin_ids:
          type: array
          items:
            type: integer
            format: int64

    # Forwarding.
    T2DType:
      type: string
      description: >-
        A kind of content a Telegram to Discord route may forward, in
        the order of type_options. A message is filtered part by part:
        its text or caption follows text, each file its type, and a
        kind's summary line (a location, a contact, a poll, ...) its
        kind. poll covers quizzes, location venues and live locations.
        service is service messages. other is everything without a type
        of its own: rich messages, calls, giveaways and every kind added
        later.
      enum: [text, photo, video, animation, video_note, document, sticker, voice, audio, poll, checklist, dice, game, location, contact, story, paid_media, invoice, service, other]
    D2TType:
      type: string
      description: >-
        A kind of content a Discord to Telegram route may forward, in
        the order of type_options. audio is audio/* attachments;
        animation is image/gif attachments and animated stickers; any
        other attachment is a photo (image/*), a video (video/*) or a
        document. voice is a voice message, sent as a voice note; embed
        is a bot's or webhook's rich embeds, poll a poll's question and
        answers, and system a system message (a member joining, a pin,
        a boost, ...), each rendered as text lines.
      enum: [text, photo, video, animation, document, sticker, audio, voice, embed, poll, system]
    T2DTypes:
      type: array
      description: >-
        The kinds of content forwarded, in the order of type_options.
        A write takes the whole set: an unknown type or an empty set is
        400 bad_request (disabling a route is how it stops).
      items:
        $ref: '#/components/schemas/T2DType'
    D2TTypes:
      type: array
      description: >-
        The kinds of content forwarded, in the order of type_options.
        A write takes the whole set: an unknown type or an empty set is
        400 bad_request (disabling a route is how it stops).
      items:
        $ref: '#/components/schemas/D2TType'
    FwdPerson:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          type: string
        active:
          type: boolean
    Owned:
      type: object
      description: >-
        The owner is the account that created the configuration, with
        its role and whether it is active (a disabled owner's
        configurations keep forwarding; the page flags them "owner
        disabled" for an admin to transfer). One without an owner, made
        before ownership was recorded, counts as the superadmins' and
        is answered as shared: owner id 0, named "Shared", active. The
        federation is the one chosen at creation; one made before
        federations were stored, or whose federation was deleted, is
        in Default. transfer_candidates is who the viewer may give it
        to, its owner left out: for a superadmin every active account;
        for an admin that administers its federation, the federation's
        active admins and its active members holding forward to whom
        the configuration's group is granted; empty otherwise, and
        always for a member.
      required: [id, owner, federation, transfer_candidates]
      properties:
        id:
          type: integer
          format: int64
        owner:
          allOf:
            - $ref: '#/components/schemas/FwdPerson'
            - type: object
              required: [active]
              properties:
                active:
                  type: boolean
        federation:
          $ref: '#/components/schemas/FedRef'
        transfer_candidates:
          type: array
          items:
            $ref: '#/components/schemas/FwdPerson'
    FedRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    T2DRoute:
      allOf:
        - $ref: '#/components/schemas/Owned'
        - type: object
          required: [chat, url_masked, types, enabled, sent, last_sent]
          properties:
            chat:
              description: >-
                The route's Telegram chat. Its photo is the group's
                photo or, for a private chat, the user's profile photo:
                a /files/ URL when the bytes are stored, else null.
              $ref: '#/components/schemas/PickItem'
            url_masked:
              type: string
              description: The webhook URL with its secret part cut off.
            types:
              $ref: '#/components/schemas/T2DTypes'
            enabled:
              type: boolean
            sent:
              type: integer
              format: int64
              description: >-
                Posts made to the webhook's URL; a message sent as a
                caption and its media counts twice.
            last_sent:
              type: [string, 'null']
    D2TRoute:
      allOf:
        - $ref: '#/components/schemas/Owned'
        - type: object
          required: [channel_id, channel_name, chat, discord_bot, telegram_bot, types, enabled, sent]
          properties:
            channel_id:
              type: string
            channel_name:
              type: string
            chat:
              description: >-
                The route's Telegram chat. Its photo is the group's
                photo or, for a private chat, the user's profile photo:
                a /files/ URL when the bytes are stored, else null.
              $ref: '#/components/schemas/PickItem'
            discord_bot:
              description: >-
                The Discord bot that reads the channel, with its state;
                null for a route made before the Discord bots were
                stored, until the deployment's import gives it one (it
                forwards nothing meanwhile).
              oneOf:
                - $ref: '#/components/schemas/BotRef'
                - type: 'null'
            telegram_bot:
              $ref: '#/components/schemas/BotRef'
              description: >-
                The Telegram bot that sends into the chat, with its
                state. A route forwards only while it and both its bots
                are enabled.
            types:
              $ref: '#/components/schemas/D2TTypes'
            enabled:
              type: boolean
            sent:
              type: integer
              format: int64
    FwdCounts:
      type: object
      required: [active, total, sent]
      properties:
        active:
          type: integer
        total:
          type: integer
        sent:
          type: integer
          format: int64
    ForwardingIndexProps:
      type: object
      required: [t2d, d2t]
      properties:
        t2d:
          $ref: '#/components/schemas/FwdCounts'
        d2t:
          $ref: '#/components/schemas/FwdCounts'
    T2DProps:
      type: object
      required: [routes, federations, type_options]
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/T2DRoute'
        type_options:
          type: array
          description: >-
            Every type this direction's bridge honours, in the order the
            form lists them. Groups, labels and presets are the app's; a
            type the app does not know is shown under "Other kinds" by
            its name.
          items:
            $ref: '#/components/schemas/T2DType'
        federations:
          type: array
          description: >-
            The federations the viewer administers, Default first. The
            choices for one chat are GET /api/forwarding/federations.
          items:
            $ref: '#/components/schemas/FedRef'
    D2TProps:
      type: object
      required: [routes, federations, type_options]
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/D2TRoute'
        type_options:
          type: array
          description: >-
            Every type this direction's bridge honours, in the order the
            form lists them. Groups, labels and presets are the app's; a
            type the app does not know is shown under "Other kinds" by
            its name.
          items:
            $ref: '#/components/schemas/D2TType'
        federations:
          type: array
          description: >-
            The federations the viewer administers, Default first. The
            choices for one chat are GET /api/forwarding/federations.
          items:
            $ref: '#/components/schemas/FedRef'
    T2DCreate:
      type: object
      required: [chat_id, chat_kind, webhook_url, types, enabled]
      properties:
        chat_id:
          type: integer
          format: int64
        chat_kind:
          type: string
          enum: [group, user]
        webhook_url:
          type: string
          description: A Discord webhook URL; anything else is 400 bad_webhook.
        types:
          $ref: '#/components/schemas/T2DTypes'
        enabled:
          type: boolean
        federation_id:
          type: [integer, 'null']
          format: int64
          description: >-
            One of GET /api/forwarding/federations for the chat; needed
            only when it answers more than one.
    D2TCreate:
      type: object
      required: [discord_channel_id, chat_id, discord_bot_id, telegram_bot_id, types, enabled]
      properties:
        discord_channel_id:
          type: string
        chat_id:
          type: integer
          format: int64
        types:
          $ref: '#/components/schemas/D2TTypes'
        enabled:
          type: boolean
        federation_id:
          type: [integer, 'null']
          format: int64
          description: >-
            One of GET /api/forwarding/federations for the chat; needed
            only when it answers more than one.
        discord_bot_id:
          type: integer
          format: int64
          description: The Discord bot to read the channel with, one the viewer may use.
        telegram_bot_id:
          type: integer
          format: int64
          description: The Telegram bot to send with, one the viewer may use.
    BotKind:
      type: string
      enum: [telegram, discord]
      description: >-
        A Telegram bot sends into Telegram chats (Discord to Telegram
        routes); a Discord bot reads Discord channels for them.
    BotStatus:
      type: string
      enum: [connected, connecting, intent_missing, token_refused, disabled]
      description: >-
        As discordd last saw the bot: connected; connecting (enabled,
        not logged in yet, or trying again after an enable);
        intent_missing (Discord only: the Message Content intent is off
        in the developer portal); token_refused (the platform refused
        the token; the bot is disabled and not retried in a loop);
        disabled (switched off by its owner).
    BotIdentity:
      type: object
      description: >-
        Who the bot is on its platform, once it has logged in: the
        Telegram bot's user id (the non-secret half of its token) or the
        Discord bot user's id, and its username. Never any part of the
        token's secret.
      required: [user_id, username]
      properties:
        user_id:
          type: string
        username:
          type: [string, 'null']
    BotRef:
      type: object
      description: A bot as pickers and routes show it.
      required: [id, kind, name, identity, status, enabled]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/BotKind'
        name:
          type: string
        identity:
          oneOf:
            - $ref: '#/components/schemas/BotIdentity'
            - type: 'null'
        status:
          $ref: '#/components/schemas/BotStatus'
        enabled:
          type: boolean
        photo:
          type: [string, 'null']
          description: >-
            A Telegram bot's profile photo, as the archive has it for
            the user of identity.user_id: a /files/ URL when that user
            is in the archive and the photo's bytes are stored, else
            null. Always null for a Discord bot (no third-party URLs).
        profile:
          type: [integer, 'null']
          format: int64
          description: >-
            A Telegram bot's own user id (identity.user_id), for a
            link to its user page (/users/{id}): set when the archive
            has that user and the viewer may open the user's page,
            else null. The service resolves a logged-in bot's user
            through the daemon in the background, so it may appear a
            little after the bot logs in. Always null for a Discord
            bot.
    Bot:
      description: >-
        A bot on the Bots page. Its token is write-only: no answer,
        page or attribute carries it once it is saved
        (decisions/2026-11-18-ownership-and-bots.md).
      allOf:
        - $ref: '#/components/schemas/BotRef'
        - type: object
          required: [owner, transfer_candidates, status_at, status_detail, routes]
          properties:
            owner:
              allOf:
                - $ref: '#/components/schemas/FwdPerson'
                - type: object
                  required: [active]
                  properties:
                    active:
                      type: boolean
            transfer_candidates:
              type: array
              description: >-
                Who the bot may be given to; empty for a member, who
                cannot transfer.
              items:
                $ref: '#/components/schemas/FwdPerson'
            status_at:
              type: [string, 'null']
              format: date-time
              description: When discordd last reported the status.
            status_detail:
              type: [string, 'null']
              description: discordd's own words about the status, shown as they are.
            routes:
              type: integer
              description: How many Discord to Telegram routes use the bot.
    BotsProps:
      type: object
      description: >-
        The viewer's bots: a member with `forward` sees its own only;
        admins and superadmins see every bot, with its owner
        (show_owner).
      required: [bots, show_owner]
      properties:
        bots:
          type: array
          items:
            $ref: '#/components/schemas/Bot'
        show_owner:
          type: boolean
    BotCreate:
      type: object
      required: [kind, name, token]
      properties:
        kind:
          $ref: '#/components/schemas/BotKind'
        name:
          type: string
          description: The account's own label for the bot, 1 to 64 characters.
        token:
          type: string
          description: >-
            Write-only, checked in shape only (whether it works shows in
            the status): Telegram <digits>:<secret>, the secret 30 or
            more of [A-Za-z0-9_-]; Discord three dot-separated base64url
            parts, the first decoding to a Discord id.
    BotUpdate:
      type: object
      description: >-
        The fields given change. A token replaces the bot's credential
        (shape-checked as on creation). Enabling a bot whose token was
        refused, or whose intent was missing, sets it connecting and has
        discordd try it once more.
      properties:
        name:
          type: string
        enabled:
          type: boolean
        token:
          type: string
    Transfer:
      type: object
      required: [owner_id]
      properties:
        owner_id:
          type: integer
          format: int64

    # Join chat.
    JoinChat:
      type: object
      description: >-
        The chat as the daemon resolved it (docs/internal-api.md, POST
        /v1/chats/resolve); username is empty when it has none.
      required: [chat_id, title, type, member_count, username, is_member, needs_approval]
      properties:
        chat_id:
          type: integer
          format: int64
          description: >-
            0 when the account cannot see the chat before joining (the
            daemon's null).
        title:
          type: string
        type:
          type: string
        member_count:
          type: integer
        username:
          type: string
        is_member:
          type: boolean
        needs_approval:
          type: boolean
        banned:
          type: boolean
        paid:
          type: boolean
    JoinOutcome:
      type: object
      required: [outcome, message, chat]
      properties:
        outcome:
          type: string
          description: >-
            The daemon's outcome: ok (a preview that found the chat),
            joined, already_member, request_sent, approval_required,
            declined, not_a_group, not_found, link_invalid, flood_wait,
            banned, too_many_chats or error.
        message:
          type: string
          description: The sentence to show; empty for ok.
        chat:
          oneOf:
            - $ref: '#/components/schemas/JoinChat'
            - type: 'null'
        ref:
          type: string
          description: The reference as the daemon normalised it.
        retry_after:
          type: integer
          description: Seconds to wait, with flood_wait.
        federation_ids:
          type: array
          description: >-
            Join only: the federations the group was filed into
            (outcome joined), or is held for (filing_pending); empty
            when none was chosen or nothing is filed. Absent from a
            preview.
          items:
            type: integer
            format: int64
        filing_pending:
          type: boolean
          description: >-
            Join only: true when federation_ids are held until the
            account is a member (request_sent, approval_required).
            Absent from a preview.
    JoinFiling:
      type: object
      description: >-
        A held filing: a group whose join waits for approval, and a
        federation it goes into once the account is a member.
      required: [id, ref, title, chat_id, federation, by, at]
      properties:
        id:
          type: integer
          format: int64
        ref:
          type: string
          description: The reference as the daemon normalised it.
        title:
          type: string
          description: The chat's title at the request; empty when unknown.
        chat_id:
          type: integer
          format: int64
          description: 0 when the account could not see the chat yet.
        federation:
          $ref: '#/components/schemas/FedRef'
        by:
          type: string
          description: The account that asked, by username.
        at:
          type: string
          description: When it was asked (UTC, RFC 3339).
    JoinChatProps:
      type: object
      required: [federations, recent, pending, api_configured]
      properties:
        api_configured:
          type: boolean
          description: >-
            Whether the service reaches the daemon's API
            (WEB_TGLOGGERD_API); false means no chat can be joined
            from here, and the page says so before anything is tried.
        federations:
          type: array
          description: Federations the viewer may file a joined group into.
          items:
            $ref: '#/components/schemas/FedRef'
        pending:
          type: array
          description: >-
            The held filings, oldest first: an admin's own, every one
            for a superadmin.
          items:
            $ref: '#/components/schemas/JoinFiling'
        recent:
          type: array
          description: >-
            The last attempts, newest first: a superadmin sees every
            account's, an admin only its own. A chat the viewer's
            scope hides is left out, and a non-superadmin gets no
            title for an attempt that does not name its chat id.
          items:
            type: object
            required: [at, by, ref, title, outcome]
            properties:
              at:
                type: string
              by:
                type: string
              ref:
                type: string
              title:
                type: string
              outcome:
                type: string

    # Fetching from Telegram.
    FileFetch:
      type: object
      required: [state, url, size]
      properties:
        state:
          type: string
          enum: [stored, partial]
          description: >-
            stored: the bytes are in the store now (or were already),
            and url serves them from there. partial: a big file, being
            downloaded into TDLib's cache; url streams what has arrived
            and a player asks for further ranges as it goes.
        url:
          type: string
          description: The file's /files/<token> URL.
        size:
          type: integer
          format: int64
          description: The file's size in bytes, 0 when unknown.

    # Contacts.
    LookupName:
      type: object
      required: [user_id, first_name, last_name, contact_first_name, contact_last_name, checked_at]
      properties:
        user_id:
          type: integer
          format: int64
        first_name:
          type: string
          description: The user's own name, as now stored.
        last_name:
          type: string
        contact_first_name:
          type: string
          description: The name the account saved the contact under, as before.
        contact_last_name:
          type: string
        checked_at:
          type: integer
          format: int64
          description: When the name was read, unix seconds.

    # MCP administration.
    McpIndexProps:
      type: object
      description: >-
        exposed_groups and exposed_messages count the exposed groups the
        viewer sees; active_tokens and last_used are over the tokens
        not revoked that the viewer manages (McpTokensProps).
      required: [exposed_groups, exposed_messages, active_tokens, last_used, endpoint]
      properties:
        exposed_groups:
          type: integer
        exposed_messages:
          type: integer
          format: int64
        active_tokens:
          type: integer
        last_used:
          type: [string, 'null']
        endpoint:
          type: string
    McpGroupsProps:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [group, public_now, note, added]
            properties:
              group:
                $ref: '#/components/schemas/GroupCounted'
              public_now:
                type: boolean
              note:
                type: string
              added:
                type: string
    McpTokensProps:
      type: object
      description: >-
        The tokens the viewer manages, newest first: a superadmin's are
        every token, an admin's its own and those of the members it
        manages, a member's its own (createMcpToken). owners is who the
        viewer may mint for and, with can_transfer, transfer to: for a
        superadmin every active account that may hold tokens (a
        superadmin, an admin, or a member holding mcp_tokens), for an
        admin itself and the active members it manages that hold
        mcp_tokens, for a member itself. can_transfer is true for
        superadmins only (transferMcpToken).


        A token's owner is the owning account, with its role and
        whether it is active; a token without an owner record counts as
        the superadmins' and is answered as shared (owner id 0, named
        "Shared", active). minted_by is the account that minted it,
        which its requests are attributed to: when that account is
        disabled the token stops working, whoever owns it.


        A token's scope is what it reads (McpScopeEntry), empty for
        every exposed group. scope_options is what the token form may
        offer: the federations, the exposed groups the viewer can see,
        and private, true for a superadmin (who may give a private
        chat to a token a superadmin owns, or one without an owner
        record).
      required: [tokens, owners, can_transfer, scope_options]
      properties:
        tokens:
          type: array
          items:
            type: object
            required: [id, name, owner, minted_by, created, last_used, revoked, scope]
            properties:
              id:
                type: integer
                format: int64
              name:
                type: string
              scope:
                type: array
                items:
                  $ref: '#/components/schemas/McpScopeEntry'
              owner:
                $ref: '#/components/schemas/FwdPerson'
              minted_by:
                $ref: '#/components/schemas/FwdPerson'
              created:
                type: string
              last_used:
                type: [string, 'null']
              revoked:
                type: [string, 'null']
        owners:
          type: array
          items:
            $ref: '#/components/schemas/FwdPerson'
        can_transfer:
          type: boolean
        scope_options:
          type: object
          required: [federations, groups, private]
          properties:
            federations:
              type: array
              items:
                $ref: '#/components/schemas/FedRef'
            groups:
              type: array
              description: The exposed groups the viewer can see, by title.
              items:
                $ref: '#/components/schemas/FedRef'
            private:
              type: boolean
    McpScopeKind:
      type: string
      description: >-
        federation (a federation's id, 0 for Default), group (a
        group's negative chat id) or private (a one-to-one chat: the
        peer user's id).
      enum: [federation, group, private]
    McpScopeWrite:
      type: array
      description: >-
        A token's scope as written: each entry once, at most 200
        (decisions/2026-11-20-mcp-token-scope.md).
      items:
        type: object
        required: [kind, id]
        properties:
          kind:
            $ref: '#/components/schemas/McpScopeKind'
          id:
            type: integer
            format: int64
    McpScopeEntry:
      type: object
      description: >-
        One entry of a token's scope, federations first, then groups,
        then private chats, each by id. name is the federation's name,
        the group's title or the user's name ("" when it no longer
        exists). active is whether the entry reaches anything now: a
        federation that exists, a group exposed to MCP, a private chat
        on a token whose owner is a superadmin (or that has no owner
        record). An inactive entry is kept and reaches nothing; a token
        whose entries are all inactive reads nothing, never every
        exposed group.
      required: [kind, id, name, active]
      properties:
        kind:
          $ref: '#/components/schemas/McpScopeKind'
        id:
          type: integer
          format: int64
        name:
          type: string
        active:
          type: boolean
    # The MCP endpoint (web/docs/mcp.md).
    McpMessage:
      type: object
      description: >-
        A JSON-RPC 2.0 request (with an id) or notification (without).
        The methods answered are initialize, ping, tools/list and
        tools/call ({name, arguments}); tools/list describes each
        tool's arguments.
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        id:
          type: [string, number, 'null']
        method:
          type: string
        params:
          type: object
          additionalProperties: true
    McpAnswer:
      type: object
      description: >-
        A JSON-RPC 2.0 answer: result, or error. A tools/call result is
        {content: [{type: text, text}], structuredContent, isError}; the
        text is the structured content serialised, or the error message
        when isError is true.
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        id:
          type: [string, number, 'null']
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
            message:
              type: string
