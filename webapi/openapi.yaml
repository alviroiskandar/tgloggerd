# SPDX-License-Identifier: GPL-2.0-or-later
#
# The API contract of the Go web service (webapi/). Every route the
# service serves is described here, and every operation described is
# served unless it carries `x-tgd-status: planned`;
# internal/server/openapi_test.go checks both. The React application
# generates its client from this file (web/app, `npm run gen:api`).
#
# The test reads the file with a small reader of its own, so keep to
# this layout: two-space indentation, block mappings, sequences
# indented under their key, flow collections ([a, b], {}) on one line,
# and long text as a block scalar (>- or |), never a plain scalar
# continued on the next line.
openapi: 3.1.0
info:
  title: tgloggerd web API
  version: 0.1.0
  license:
    name: GPL-2.0-or-later
    identifier: GPL-2.0-or-later
  description: >-
    The JSON API of the tgloggerd web service, and the file URLs it
    serves. The React dashboard is one client of it; every feature of
    the dashboard that reads from or acts on the backend is an
    operation here, so other clients can do the same through the same
    operations and the same request scope (docs/design/web-go.md
    section 6).


    Operations marked `x-tgd-status: planned` are designed but not
    served yet; until they are, they answer 404 like any unknown
    path. Their shapes follow the React pages that already call them
    and docs/design/web-accounts.md, and may still change when they
    are built.


    Authentication is the browser session: the signed cookie
    tgw_session, set by POST /api/login. Every state-changing request
    carries a CSRF token in the X-CSRF-Token header: for a signed-in
    request the token GET /api/session or POST /api/login answers; for
    POST /api/login the pre-login token of GET /api/login. A signed-in
    page also carries the session's token in its csrf-token meta tag.
    Per-account bearer tokens for clients that cannot keep cookies
    (native apps, scripts) are planned (web-accounts.md section 7); see
    the apiToken scheme.


    Errors of the JSON operations are an object with a machine-readable
    `error` code and, where a person may read it, a `message`
    sentence (the Error schema). Visibility follows the request scope
    of web-accounts.md section 9: something the viewer may not see
    answers exactly like something that does not exist, 404
    not_found, never 403. A forbidden action on something the viewer
    may see answers 403 forbidden.


    Gates: an account with a password set for it (typed by its
    creator, or a generated temporary one;
    SessionUser.must_change_password) must choose its own first
    (decisions/2026-11-18-temporary-passwords.md and
    2026-11-18-email-optional.md). Until it does, every
    operation that needs a session answers 403
    password_change_required, except GET /api/session, POST
    /api/logout and POST /api/account/password; page data answers the
    password_change route, except for the three link pages. The link
    operations (setPassword, verifyEmail, forgotPassword) need no
    session. An email address is optional, for each account and for
    the service: there is no gate on a missing or unverified one.


    Email links: a set-password link (an invitation, or a reset) is
    <site>/password/set#token=<token>, a verification link
    <site>/account/email/verify#token=<token>. The token is in the
    fragment, so it reaches no server log and no Referer header; the
    page posts it to setPassword or verifyEmail only when the person
    acts, so a mail scanner opening the link uses nothing up. Links
    work once, expire, and stop working when a newer link of the same
    kind is sent to the account. Links and security notices go out only
    when the account has an address (verified, except for an
    invitation and a verification) and mail is set up (an SMTP relay
    and the site's URL); otherwise nothing is sent and nothing waits
    for mail. Only an invitation asked for explicitly answers 409
    mail_off then.
servers:
  - url: /
security:
  - session: []
tags:
  - name: service
    description: Health of the service.
  - name: auth
    description: Signing in and out, the current session.
  - name: files
    description: File bytes behind /files/<token> links.
  - name: pages
    description: Page data for the React application (docs/design/web-ssr.md).
  - name: chats
    description: Chat message windows and the chat search of the pickers.
  - name: account
    description: The signed-in account's own settings.
  - name: accounts
    description: Administration of accounts and federations.
  - name: forwarding
    description: Telegram to Discord and Discord to Telegram forwarding.
  - name: join-chat
    description: Joining Telegram groups and channels with the logging account.
  - name: mcp
    description: The MCP endpoint, and the administration of its exposed groups and tokens.
  - name: live
    description: Live updates as Server-Sent Events.
  - name: search
    description: The advanced search over the logged users, groups, files and messages.
  - name: contacts
    description: Actions on the logging account's Telegram contacts.
  - name: history
    description: The change timelines of users and groups, page by page.
  - name: groups
    description: A group's members and web settings.

paths:

  /api/health:
    get:
      operationId: getHealth
      tags: [service]
      summary: Check both database pools
      description: >-
        Needs no session; for probes and for checking the routing. The
        answer says only which pool failed; the reason goes to the
        service's log.
      security: []
      responses:
        '200':
          description: Both pools answer.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: >-
            A pool did not answer within a few seconds; its check reads
            "unavailable" and so does status.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/login:
    get:
      operationId: getLogin
      tags: [auth]
      summary: Start a sign-in
      description: >-
        Answers a pre-login CSRF token and sets it as the tgw_csrf
        cookie (path /api/login), to be sent back with POST
        /api/login. A request whose session cookie has a valid
        signature gets signed_in true and no token; the cookie's
        session_epoch is not checked here, as the Drogon login page
        does not check it either.
      security: []
      responses:
        '200':
          description: The sign-in state, and a token when signed out.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: tgw_csrf, the pre-login token, when signed_in is false.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginState'
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      description: >-
        Checks, in this order: the pre-login CSRF token against its
        cookie, the body, the login throttle (per client address and
        username, in the process's memory), then the account and its
        password. Each attempt past the CSRF check and the body is
        audited (login_ok, login_fail or login_ratelimited). Refused
        attempts answer a fresh pre-login token in `csrf` and set it as
        the cookie, so the client can try again.
      security:
        - loginCsrf: []
          loginCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; the session cookie is set.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: tgw_session, the signed session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: The body is not a JSON object (error bad_request).
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: >-
            No such account, a disabled one, or a wrong password (error
            invalid_credentials), with a fresh token.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/LoginCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
        '403':
          description: >-
            The token or its cookie is missing or wrong (error csrf),
            with a fresh token.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/LoginCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
        '429':
          description: >-
            Too many failures for this address and username within the
            throttle's window (error rate_limited), with a fresh token.
            No Retry-After is sent.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/LoginCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
        '500':
          $ref: '#/components/responses/Internal'

  /api/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out this browser
      description: >-
        Clears the session cookie, ends the session's record, so a copy
        of the cookie stops working on both web services, and audits a
        logout when the cookie opens. The account's other sessions stay
        signed in. The CSRF
        token must match the session cookie; a request without a
        session cookie fails that check.
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Signed out; the session cookie is cleared.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: tgw_session, expired.
              schema:
                type: string
        '403':
          description: The CSRF token is missing or wrong (error csrf).
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'

  /api/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Who is signed in
      description: >-
        The account of a valid session (signature, expiry, the
        account's session_epoch, and an account that is not disabled)
        and the CSRF token to send with it. The role is the account's
        current one, read on every request, not the one the cookie was
        issued with.
      responses:
        '200':
          description: The session's account and CSRF token.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /files/{token}:
    get:
      operationId: getFile
      tags: [files]
      summary: A file's bytes
      description: >-
        Serves a logged file, from the store or fetched from Telegram
        through the daemon; web/docs/media.md has the details. The
        token is the encrypted file id; one that does not open answers
        like an unknown id. The route is public: a session only allows
        fetching big files and makes the request audited. A signed-in
        account that does not hold fetch_files (a member not given it)
        has no unstored file fetched at all. The JSON answers link a big
        unstored file only through fetchFile, so no page view fetches
        one by itself; the link fetchFile answers with is served here
        as any other. HEAD is answered like GET, without the body.


        Error answers are small HTML pages, not JSON, since a browser
        following a link or loading an image gets them.
      security:
        - {}
        - session: []
      parameters:
        - name: token
          in: path
          required: true
          description: The file token, as minted into the pages and the API.
          schema:
            type: string
        - name: download
          in: query
          required: false
          description: >-
            1 sends the file as a download (Content-Disposition
            attachment) whatever its type; any other value, or none,
            leaves the choice to the file (see Content-Disposition).
          schema:
            type: string
        - name: Range
          in: header
          required: false
          description: >-
            A byte range. A stored file honours several ranges
            (multipart/byteranges); a partial file from TDLib's cache
            answers at most the bytes it holds from the first range's
            start.
          schema:
            type: string
        - name: If-Range
          in: header
          required: false
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The whole file.
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            Cache-Control:
              $ref: '#/components/headers/FileCacheControl'
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            X-Content-Type-Options:
              $ref: '#/components/headers/FileNoSniff'
            Content-Security-Policy:
              $ref: '#/components/headers/FileSandbox'
            Last-Modified:
              description: For a stored file.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '206':
          description: >-
            The requested range, or for a file still being fetched the
            part of it already there; Content-Range carries the file's
            full size.
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            Cache-Control:
              $ref: '#/components/headers/FileCacheControl'
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            X-Content-Type-Options:
              $ref: '#/components/headers/FileNoSniff'
            Content-Security-Policy:
              $ref: '#/components/headers/FileSandbox'
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
            multipart/byteranges:
              schema:
                type: string
        '304':
          description: Not modified since If-Modified-Since (a stored file).
        '403':
          description: >-
            Not in the store and too big to fetch without a session
            ("Sign in to load this file").
          content:
            text/html:
              schema:
                type: string
        '404':
          description: >-
            No such file, a token that does not open, or not in the
            store while fetching from Telegram is not configured or the
            signed-in account may not fetch files (fetch_files).
          content:
            text/html:
              schema:
                type: string
        '410':
          description: The file is no longer available on Telegram.
          content:
            text/html:
              schema:
                type: string
        '416':
          description: The range is outside the file.
          headers:
            Content-Range:
              description: bytes */<size>, when the size is known.
              schema:
                type: string
        '500':
          description: The file could not be served.
          content:
            text/html:
              schema:
                type: string
        '502':
          description: The daemon answered something unexpected.
          content:
            text/html:
              schema:
                type: string
        '503':
          description: >-
            The daemon is busy, unreachable or not signed in to
            Telegram, or the file moved while it was being opened; try
            again after Retry-After seconds.
          headers:
            Retry-After:
              description: Seconds to wait before asking again.
              schema:
                type: integer
          content:
            text/html:
              schema:
                type: string
        '504':
          description: >-
            Telegram took too long; the fetch goes on in the background.
          content:
            text/html:
              schema:
                type: string

  /api/files/{token}/fetch:
    post:
      operationId: fetchFile
      tags: [files]
      summary: Fetch an unstored file from Telegram
      description: >-
        "Fetch from Telegram" (web/docs/media.md): asks the daemon to
        fetch a file the store does not hold and answers with the
        /files/<token> URL to view or download it from then on. The
        path is the fetch value of the file in a JSON answer
        (ChatMedia, FileRow, GroupFileRow), which is given exactly when
        fetchable is true; its token is the file token of its url. A
        page view links a small unstored file (under the store's
        per-file cap) itself, so opening it fetches it; a bigger one
        has url null and is fetched only through this operation. For
        accounts that hold fetch_files (every superadmin and admin, a
        member given it); a member without it gets 403
        fetch_not_allowed. A file already in the store is answered at
        once, without asking the daemon. A small file is stored whole
        (state stored); a big one is never copied into the store: the
        daemon starts downloading it into TDLib's cache from its first
        byte (state partial), and url then streams it as it arrives,
        for signed-in requests only. Every request that reaches the
        daemon writes one file_fetch audit row, "file <id>: ok" or the
        error code.
      security:
        - session: []
          csrf: []
      parameters:
        - name: token
          in: path
          required: true
          description: The file token, as in the file's url and fetch.
          schema:
            type: string
      responses:
        '200':
          description: The file is stored, or its download has begun.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileFetch'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: >-
            The CSRF token is missing or wrong (error csrf), a gate is
            up, or the account may not fetch files from Telegram (error
            fetch_not_allowed: a member without fetch_files).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            No such file, a token that does not open, or a file the
            daemon does not know (error not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: >-
            The file is no longer available on Telegram (error gone).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/DaemonFailed'
        '503':
          description: >-
            The daemon is busy or not signed in to Telegram (error
            unavailable); try again after Retry-After seconds.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: >-
            Telegram took too long (error timeout); the download goes on
            in the background, so asking again soon is cheap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/events:
    get:
      operationId: getEvents
      tags: [live]
      summary: Live updates as Server-Sent Events
      description: >-
        What changes in the archive, as a text/event-stream for as long
        as the connection stays open (docs/design/web-live.md). An
        event says what changed, never the new content; the page
        refetches what it names through the other operations. Only
        events about chats and users the viewer may see are sent, so
        the stream reveals no activity in a hidden group.


        Framing: a `retry:` line first, then one frame per event with
        `id:` its seq, `event:` its kind and `data:` the LiveEvent as
        JSON. The first event is a `hello` (the events after its seq
        follow) or a `resync` (what the client missed cannot be sent:
        refetch what is shown, the events after its seq follow). A
        `resync` can also come later, when the client reads too slowly
        to keep up. A comment line (`: keepalive`) about every 15
        seconds keeps a quiet stream alive. A `session` event, without
        an id, ends the stream when the session was revoked or expired
        (reason revoked: sign in again) or the viewer's access changed
        (reason scope_changed: refetch everything, then reconnect).
        The server also closes the stream without an event when the
        daemon stays away; reconnecting then answers 503.


        To resume, reconnect with the last seq seen, as `last` or as
        the Last-Event-ID header the browser sends on its own
        reconnect (the header wins). Recent events are kept, so a
        short disconnect loses nothing; a longer one, or one across a
        restart of the daemon, starts with a resync.


        Topics: `chat:<chat_id>` (message.new, message.edited,
        message.deleted and file.stored of one chat), `messages` (the
        same for every chat the viewer may see), `user:<id>`
        (user.updated), `group:<chat_id>` (group.updated), `stats`
        (stats.changed) and `bots` (bot.updated, for the bots the
        viewer may see). Repeats count once; at most 2000 topics, and
        the request line may run to tens of kilobytes. Kinds may be
        added; a client skips kinds it does not know.


        Signed out: a visitor reading the public chat of an exposed
        group (MCP exposure) may open a stream without a session, for
        `chat:<chat_id>` topics of exposed groups only, at most 4 per
        stream (WEBAPI_LIVE_PUBLIC_TOPICS). Any other topic, a group
        that is not exposed or does not exist, or more chats than that
        answer 401 unauthenticated alike, as the chat window answers a
        visitor. Such a stream differs from a signed-in one: its frames
        carry no `id:` line and its events no seq (no resuming: `last`
        and Last-Event-ID are ignored and every stream starts with a
        `resync`, whose `refetch_interval` is the least number of
        seconds the client leaves between two refetches of a chat
        window); file.stored carries no file_id; the `retry:` is longer
        and varies per stream. A group withdrawn from exposure ends the
        stream with a session event of reason scope_changed, never
        revoked. Visitors' streams have caps of their own, apart from
        the signed-in ones, which keep their slots when the visitors'
        are taken: in all, per client address (an IPv4 address or an
        IPv6 /64) and opens per address per minute; a refused visitor
        gets 503 unavailable with Retry-After and should then refetch
        its chat every 30 seconds at most, not poll the tail.
      security:
        - {}
        - session: []
      parameters:
        - name: topics
          in: query
          required: true
          description: >-
            Comma-separated topics, e.g.
            chat:-1001234567890,user:42,messages,stats.
          schema:
            type: string
        - name: last
          in: query
          required: false
          description: >-
            The last seq the client has seen; without it the stream
            starts from now. Ignored on a signed-out stream.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: Last-Event-ID
          in: header
          required: false
          description: >-
            Set by the browser's EventSource on its own reconnect;
            wins over last. A value that is not a seq resumes nothing
            (a resync). Ignored on a signed-out stream.
          schema:
            type: string
      responses:
        '200':
          description: >-
            The stream. Each frame's data is a LiveEvent, as JSON.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Accel-Buffering:
              description: no, so nginx passes each frame on at once.
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
              x-tgd-event:
                $ref: '#/components/schemas/LiveEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            No valid session, and the topics are not ones a signed-out
            stream may have (error unauthenticated); a revoked session
            cookie is cleared.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Gate'
        '503':
          description: >-
            No stream: live updates are off or the daemon's stream is
            not connected (error live_off), too many streams are open
            (error unavailable), or the session could not be checked
            (error unavailable). For a signed-out stream also: the
            visitors' streams in all or from this address are at their
            cap, or this address opened too many streams in the last
            minute (error unavailable). A signed-in client polls
            meanwhile; every client tries again after Retry-After
            seconds.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/page/{path}:
    get:
      operationId: getPage
      tags: [pages]
      summary: A page's data
      description: >-
        The data of the page at /<path>, the same object the server
        embeds in the page's HTML on a first load (web-ssr.md sections
        5 and 7), for navigation in the browser. `path` is the page's
        path without its leading slash (empty for the dashboard at /);
        its slashes may be sent as they are or encoded as %2F. The
        page's query string (search, filters, sort, page) is passed on
        as the query string of this request.


        The route ids and their page paths:
        login /login;
        dashboard /;
        users /users;
        user /users/{id};
        user_history /users/{id}/history;
        user_chat /users/{id}/chat;
        groups /groups;
        group /groups/{id};
        group_admins /groups/{id}/admins;
        group_history /groups/{id}/history;
        group_members /groups/{id}/members;
        group_files /groups/{id}/files;
        group_polls /groups/{id}/polls;
        group_chat /groups/{id}/chat;
        files /files;
        group_messages /group_messages;
        private_messages /private_messages;
        message /messages/{group|private}/{id};
        settings /settings;
        settings_preferences /settings/preferences;
        settings_sessions /settings/sessions;
        accounts /settings/accounts;
        federations /settings/federations;
        federation /settings/federations/{id};
        platform_fwd /platform-fwd;
        fwd_telegram_discord /platform-fwd/telegram-discord;
        fwd_discord_telegram /platform-fwd/discord-telegram;
        bots /platform-fwd/bots;
        join_chat /join-chat;
        mcp /mcp-admin;
        mcp_groups /mcp-admin/groups;
        mcp_tokens /mcp-admin/tokens;
        password_forgot /password/forgot;
        password_set /password/set;
        email_verify /account/email/verify.


        /messages/{group|private}, the Drogon message lists that its
        message pages link to, answers {"reload": true}: its document
        redirects (302) to /group_messages or /private_messages,
        filtered by its ?chat_id= and with ?per= its ?limit=.


        password_forgot, password_set and email_verify are served to
        signed-out and signed-in visitors alike, and their GETs change
        nothing: the link token travels in the URL's fragment, which
        never reaches the server, and is posted only when the person
        acts on the page.


        A signed-in account that must change its password gets the
        password_change route for every page path except those three,
        until it has chosen its own (see Gates). There is no page gate
        on a missing email address.


        A path the service does not serve as a React page yet answers
        {"reload": true}, and the browser loads it in full. Something
        the viewer may not see answers 404 with the not_found route,
        exactly like something that does not exist; so does a path that
        is no page at all. A signed-out visitor gets 401 for every path
        but login, the three link pages and the public pages of exposed
        groups (group, group_chat, group_files and group_polls).


        So far the service loads the data of login, dashboard, user,
        user_history, user_chat, group, group_admins, group_history,
        group_members, group_files, group_polls, group_chat and message, of the list pages users, groups,
        files, group_messages and private_messages, of the settings
        pages, of the administration pages accounts, federations,
        federation, platform_fwd, fwd_telegram_discord, fwd_discord_telegram,
        join_chat, mcp, mcp_groups and mcp_tokens (each only for a
        viewer whose menu has it, not_found otherwise; the menu's mcp
        entry is for viewers holding mcp_tokens, and mcp_groups only for
        those holding mcp as well, so a member given mcp_tokens has mcp
        and mcp_tokens but not mcp_groups), of the three
        link pages (whose props are empty), and not_found. A signed-out
        visitor asking for the group_chat, group_files or group_polls
        of a group that is not exposed is asked to sign in (401 here, the redirect for the
        document), whether or not the group exists. A list page reads
        its list state from its query string (q, f the filters as a
        JSON array of Cond, sort, dir, page, per) through the advanced
        search (searchEntity) and the request scope. The users, groups,
        group_messages and private_messages lists take every field of
        their search registry (ListState.fields) with the search's
        operators and connectors, besides their own filter keys, and
        sort by the registry's sortable fields too; a filter or search
        text they refuse, or a search that runs out of time, answers
        the whole list with ListState.error, as the Drogon lists did.
        The files list drops a filter it does not take, not echoed in
        conds. per defaults to the viewer's rows_per_page and goes up
        to 1000. archive_total is there only for a viewer who sees the
        whole archive of that list. A Drogon list URL (search, offset,
        limit, order, without f, page, per and dir) is read as the
        same list, and the answer's url is the translated one, to put
        in the address bar. The user and group pages and their history
        pages take before, the history cursor (history_next).
        group_files takes kind (FileKind) and before, and group_polls
        before, as getGroupFiles and getGroupPolls do, except that a
        value that does not parse is ignored instead of answering 400.
        The
        page's document
        (its HTML, web-ssr.md section 5) is served at the page's own
        path for each route whose data the service loads, and there a
        signed-out visitor asking for a page that needs a session is
        redirected (302) to /login?next=<path and query>.
      security:
        - {}
        - session: []
      parameters:
        - name: path
          in: path
          required: true
          description: The page's path without the leading slash.
          schema:
            type: string
        - name: query
          in: query
          required: false
          description: The page's own query string, passed on unchanged.
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        '200':
          description: The page data, or a request to load the page in full.
          headers:
            Cache-Control:
              description: >-
                public, max-age=60 for a public page asked for without a
                session cookie; private, no-store otherwise, and for
                {"reload": true}.
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PageAnswer'
                  - $ref: '#/components/schemas/PageReload'
        '401':
          description: >-
            The page needs a session and the request has none (error
            unauthenticated); the browser loads the page in full and
            lands on the sign-in page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such page or nothing the viewer may see.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageNotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /app/assets/{file}:
    get:
      operationId: getAsset
      tags: [pages]
      summary: A file of the client bundle
      description: >-
        The content-hashed files vite build wrote to the bundle's
        assets/ directory (WEBAPI_APP_DIST), which page documents link
        (web-ssr.md section 6). Nothing outside that directory is
        served.
      security: []
      parameters:
        - name: file
          in: path
          required: true
          description: The file's path under assets/.
          schema:
            type: string
      responses:
        '200':
          description: The file.
          headers:
            Cache-Control:
              description: public, max-age=31536000, immutable
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: No such file, or no bundle.
          content:
            text/plain:
              schema:
                type: string

  /api/chats/{scope}/{id}/messages:
    get:
      operationId: getChatMessages
      tags: [chats]
      summary: A window of a chat's messages
      description: >-
        Messages of a group or a private chat, oldest first, for
        scrolling and live updates. At most one of before, after,
        around and after_ts is given; with none the window is the
        newest messages. after=0 is the oldest messages. Replaces the
        Drogon /v1/chats/{scope}/{id}/messages with the message shape
        of the chat pages; the cursors are the same message ids, and
        limit is clamped to 1..100 as there.


        Messages sent as an album (consecutive rows sharing a media
        album id) come as one message: the first item's ids, date and
        sender, its media as `media` and the other items' as `album`,
        the caption and edits of the item that has one. A window whose
        edge cuts an album is extended to hold all of it, so an album
        always folds the same way; a window after an album's own
        message id therefore starts with that album again, which a
        client drops by `id`.


        Visibility: a group the viewer's scope sees, or any exposed
        group (MCP exposure), whose chat is public; a private chat to a
        viewer that sees private messages. A signed-out visitor may
        read the chats of exposed groups and gets 401 for anything
        else, whether it exists or not; a signed-in viewer gets 404 for
        what it may not see. A reply quotes a message of another chat
        only when the viewer sees that chat (reply_to.chat_id names
        it); otherwise reply_to is null. Senders are shown in full
        (counts, contact name) only to viewers that see all users.


        A signed-out visitor's window is answered from a cache shared
        by every visitor, keyed by the chat and the query, so it may be
        up to WEBAPI_LIVE_PUBLIC_CACHE_SECS (2 by default) old; while
        one is being read, the visitors asking for the same window wait
        for that read instead of starting their own.


        Recheck: serving a window also asks the daemon, in the
        background, to read that stretch of the chat from Telegram
        again (POST /v1/chats/{chat_id}/recheck), so messages, edits
        and deletions the logger missed are stored and arrive as the
        usual live events. The answer never waits for it, and nothing
        in it says whether one was asked. A window without before,
        after, around or after_ts is the newest stretch, asked at most
        once a minute per chat; any other is the stretch around its
        anchor, asked at most once an hour per chat and anchor. The
        requests of all signed-out visitors together share one budget,
        which keeps its last part for newest stretches (webapi/README,
        "Recheck"). The chat and message pages ask the same way.
      security:
        - {}
        - session: []
      parameters:
        - $ref: '#/components/parameters/ChatScope'
        - name: id
          in: path
          required: true
          description: The group's chat id, or the user's id for a private chat.
          schema:
            type: integer
            format: int64
        - name: before
          in: query
          required: false
          description: Messages older than this message id.
          schema:
            type: integer
            format: int64
        - name: after
          in: query
          required: false
          description: Messages newer than this message id.
          schema:
            type: integer
            format: int64
        - name: around
          in: query
          required: false
          description: Messages around this message id, which is included.
          schema:
            type: integer
            format: int64
        - name: after_ts
          in: query
          required: false
          description: >-
            A unix time: the messages from the first one sent then or
            later, as the Drogon API's after_ts; the newest messages
            when none is that recent.
          schema:
            type: integer
            format: int64
        - name: topic
          in: query
          required: false
          description: >-
            Only the messages of this forum topic (ChatTopic.id) of a
            group; the cursors and has_older and has_newer then count
            within the topic. A private chat takes no topic (400).
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 60
      responses:
        '200':
          description: The window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatWindow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Gate'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/chats/search:
    get:
      operationId: searchChats
      tags: [chats]
      summary: Search chats for a picker
      description: >-
        Groups and private chats the viewer may see whose title, name
        or username matches q (a leading @ is ignored, and a number
        also matches the chat's id exactly); an empty q lists every
        one. Busiest first: groups by their message count, private
        chats by the number of their messages. Without kind both kinds
        are searched. A member, or an admin restricted from private
        messages, gets groups only (web-accounts.md sections 4 and 5),
        and only the groups the request scope shows. federation limits
        the answer to that federation's groups, and so to groups: 0 is
        Default, the groups in no other federation; an id that is no
        federation holds none. Paged by an opaque cursor, at most
        100000 rows deep.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [group, user]
        - name: federation
          in: query
          required: false
          description: Only the groups of this federation; 0 is Default.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: cursor
          in: query
          required: false
          description: The next_cursor of the previous page.
          schema:
            type: string
      responses:
        '200':
          description: A page of matches; next_cursor is null on the last.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSearchPage'
        '400':
          description: >-
            A malformed kind, limit, federation or cursor, or a q over
            512 bytes (error bad_request); or a search that ran out of
            time (error search_timeout).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Gate'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/search/{entity}:
    get:
      operationId: searchEntity
      tags: [search]
      summary: Advanced search over one entity
      description: >-
        The advanced search of web/docs/search-api.md: a flat chain of
        conditions over the entity's field registry, sorted and paged,
        with the rows as arrays aligned to `cols`. The same parameters
        and the same answer as the Drogon web's GET /v1/search/{entity},
        which it ports; it is under /api/ like the rest of this
        service, while the Drogon pages keep calling their own until
        they move here.


        Everything is read through the request scope. Private messages
        do not exist (404) for a viewer who may not see private chats.
        The other entities' rows are limited in the query itself, so
        rows, totals and estimates count only what the viewer may see:
        a member sees the users of its visible groups by id, name,
        username, type and photo only (`fields` and `cols` shrink to
        those), and the files and messages of its visible groups. A
        total is the storage engine's estimate of a whole table
        (total_exact false) only for a viewer who sees that whole
        table.


        String cells are HTML-escaped, as Drogon sends them; photo
        cells are /files/<token> URLs, or "" for none.
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
            enum: [users, groups, files, private_messages, group_messages]
        - name: search
          in: query
          required: false
          description: >-
            A JSON array of conditions {c, o, v, n} (field key,
            operator, value, connector AND or OR to the next one), at
            most 8 KB; empty is every row. v is a string, or for the
            operator in (enum fields) a list of 1 to 128 strings.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Read as C's atoi and clamped to 1 to 1000.
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          required: false
          description: Read as C's atoi and clamped to 0 to 500000.
          schema:
            type: integer
            default: 0
        - name: sort
          in: query
          required: false
          description: >-
            A sortable field key; anything else is the default order.
            Without one, a search with a fulltext condition is ordered
            by relevance.
          schema:
            type: string
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: debug
          in: query
          required: false
          description: >-
            1 adds the SQL, its values and its plan, for superadmins
            and admins; it is ignored for anyone else.
          schema:
            type: string
            enum: ['1']
        - name: fuzzy
          in: query
          required: false
          description: >-
            1 matches every plain word of the full-text conditions with
            a few typos, as word~ does for one word. Search engine only
            (GET /api/search/capabilities); ignored without one, and
            listed in backend.ignored when MySQL answers.
          schema:
            type: string
            enum: ['1']
        - name: highlight
          in: query
          required: false
          description: >-
            1 adds highlights, the matching fragments of each row's
            full-text field (a message's text, a user's bio, a group's
            description). Search engine only, like fuzzy.
          schema:
            type: string
            enum: ['1']
        - name: facets
          in: query
          required: false
          description: >-
            1 adds facets, the hits per chat, when the engine answers
            the whole search of a message entity (users and groups have
            none: listed in backend.ignored). Search engine only, like
            fuzzy.
          schema:
            type: string
            enum: ['1']
        - name: engine
          in: query
          required: false
          description: >-
            mysql keeps the search on MySQL even with a search engine
            (backend.fallback asked).
          schema:
            type: string
            enum: [mysql]
      responses:
        '200':
          description: A page of rows.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAnswer'
        '400':
          description: >-
            A search the registry refuses (error bad_search: an unknown
            field, an operator the field does not take, a malformed
            value or JSON, too many conditions), or one that ran out of
            time (error search_timeout); message is Drogon's sentence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Gate'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/search/capabilities:
    get:
      operationId: searchCapabilities
      tags: [search]
      summary: What the search backend offers
      description: >-
        Whether a search engine answers the full-text fields of the
        searches (the messages' text, users' bio, groups' description),
        and which options it offers for them, so a
        client offers those only when they work (web/docs/search-api.md,
        "Search engine"). Without an engine, engine is null and
        entities is empty: search is MySQL's, as before. Only the
        entities the viewer may search are listed; available says
        whether the engine answers now or searches fall back to MySQL.
      responses:
        '200':
          description: The capabilities.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchCapabilities'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Gate'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/entities:
    get:
      operationId: getEntities
      tags: [chats]
      summary: Current names, photos and counts of users and groups
      description: >-
        The current summaries of the users and groups a page shows, for
        the browser's entity cache: lists render names, photos and
        counts from it, and a user.updated, group.updated or
        stats.changed live event makes it ask again for the ids the
        event names. Only what the viewer may see is answered, through
        the same request scope as everything else: an id that is
        hidden from the viewer, or unknown, is left out, and the answer
        never says which. Counts follow the scope too (a member gets
        none, web-accounts.md section 5). At most 200 ids per list.
      parameters:
        - name: users
          in: query
          required: false
          description: Comma-separated user ids.
          schema:
            type: string
        - name: groups
          in: query
          required: false
          description: Comma-separated group chat ids.
          schema:
            type: string
      responses:
        '200':
          description: The visible ones among the ids asked for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entities'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/account/password:
    post:
      operationId: changePassword
      tags: [account]
      summary: Change the password
      description: >-
        Every other session of the account ends (its session_epoch
        moves on), on both web services. This one is issued a new
        session cookie, which changes its CSRF token: the answer
        carries the new one. It also ends a forced change after a
        password set for the account, and is served while that gate is
        up. The new password must differ from the current one. Wrong
        current passwords are throttled per account like sign-ins. The
        account's verified address is told when mail is set up (a
        security notice). Audited as password_change or
        password_change_fail.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  description: At least the minimum length; no maximum below the body limit.
      responses:
        '200':
          description: Changed; a new session cookie is set.
          headers:
            Set-Cookie:
              description: tgw_session, reissued.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '400':
          description: >-
            A wrong current password (error wrong_password), a new one
            shorter than 8 bytes or equal to the current one (error
            weak_password), or a malformed body (error bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '429':
          description: Too many wrong current passwords (error rate_limited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/account/email:
    post:
      operationId: changeEmail
      tags: [account]
      summary: Change the email address
      description: >-
        The current password confirms it is the account's owner; wrong
        ones are throttled like those of changePassword. With mail set
        up, a verification link goes to the new address
        (<site>/account/email/verify#token=<token>); the account's
        address stays the old one until the link is used, and then both
        addresses are told (web-accounts.md section 8). A new link
        replaces any sent before. Without mail, the address is recorded
        at once, unverified, and nothing is sent. An empty email removes
        the account's address (and the old one, if verified, is told).
        Audited as email_change_request, email_change (recorded at
        once) or email_change_fail.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  description: The new address, or "" to remove the account's.
                password:
                  type: string
      responses:
        '200':
          description: >-
            verification_sent true: the link is on its way and the
            address becomes the account's once verified. false: no mail
            (or the address removed); the change is made, unverified.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required: [verification_sent]
                properties:
                  verification_sent:
                    type: boolean
        '400':
          description: >-
            A wrong password (error wrong_password), an address that is
            not one or is the account's already (error bad_email), or a
            malformed body (error bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '409':
          description: Another account has the address (error email_taken).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many wrong passwords (error rate_limited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/account/email/verify:
    post:
      operationId: verifyEmail
      tags: [account]
      summary: Verify an email address
      description: >-
        Takes the token of a verification link (web-accounts.md
        section 8), <site>/account/email/verify#token=<token>. Links
        are single-use and expire. Needs no session: the link may be
        opened in another browser. The address the link went to
        becomes the account's, verified; when it replaces another, the
        new address and the old one (if it was verified) are told.
        Audited as email_verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '204':
          description: The address is verified.
        '400':
          description: >-
            The link is unknown, used, replaced or expired, or its
            account is disabled (error bad_link), or the body is
            malformed (error bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Another account took the address since the link was sent
            (error email_taken); the link is used up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'

  /api/password/forgot:
    post:
      operationId: forgotPassword
      tags: [account]
      summary: Ask for a password reset link
      description: >-
        Sends a one-time reset link (<site>/password/set#token=<token>)
        to the verified address of the active account named, by its
        username or, with an @, by its address (web-accounts.md section
        8). The answer is the same whether or not such an account
        exists or has a verified address, and whether or not mail is
        set up (without it nothing is sent); an unverified address
        receives no reset. The password stays as it is until the link
        is used. Carries the pre-login CSRF token of GET /api/login,
        like a sign-in; GET /api/login sets its cookie for this path
        too. Throttled: a few requests per client address an hour
        (then 429), and a few links per account an hour, past which
        the account silently gets no more (a 429 would tell that it
        exists). Audited as password_forgot,
        password_forgot_ratelimited or password_forgot_unknown.
      security:
        - loginCsrf: []
          loginCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  description: The account's username or email address.
      responses:
        '202':
          description: A link is sent if the account has a verified address and mail is set up.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: The pre-login CSRF token or its cookie is missing or wrong (error csrf).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests from this client (error rate_limited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'

  /api/password/set:
    post:
      operationId: setPassword
      tags: [account]
      summary: Set a password from a link
      description: >-
        Takes the token of a set-password link (a new account's
        invitation, or a reset), <site>/password/set#token=<token>, and
        the new password. Needs no session. The password is checked
        first, so a short one leaves the link working. Every session of
        the account ends, a forced change ends, the address the link
        went to is verified (it received the link), and the account's
        other set-password links stop working; the account then signs
        in with the new password (POST /api/login). A reset is told to
        the verified address (a security notice); a first password is
        not. Audited as password_set_link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
      responses:
        '204':
          description: The password is set; the account can sign in with it.
        '400':
          description: >-
            The link is unknown, used, replaced or expired, or its
            account is disabled (error bad_link), the password is
            shorter than 8 bytes (error weak_password), or the body is
            malformed (error bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'

  /api/dashboard/kpis:
    get:
      operationId: getDashboardKPIs
      tags: [pages]
      summary: The dashboard's cards alone
      description: >-
        The kpis of the dashboard's page data, the same keys and scope,
        for a dashboard that keeps its cards current without loading
        the rest again. The counts come from a cache that keeps them
        for WEBAPI_COUNT_CACHE_SECS (60 by default), so asking more
        often than that gives the same answer.
      security:
        - session: []
      responses:
        '200':
          description: The cards.
          content:
            application/json:
              schema:
                type: object
                required: [kpis]
                properties:
                  kpis:
                    type: array
                    items:
                      $ref: '#/components/schemas/KPI'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/dashboard/series:
    get:
      operationId: getDashboardSeries
      tags: [pages]
      summary: The dashboard's messages per period
      description: >-
        The messages logged per minute, hour, 4 hours, day, week
        (starting Monday), month, quarter (calendar quarters) or year
        over a range, in the viewer's timezone (its timezone
        preference), counted as the dashboard's per-day bars count
        them: the group messages the viewer sees and, when it sees
        them, the private messages. start is snapped down and end up
        to the period's boundaries, and the points cover every period
        of the snapped range, oldest first, zeros included. The range
        asked for (end minus start, end being the time of the request
        for now) may be at most the period's limit: 24 hours for
        minute, 45 days for hour, 180 days for 4h, 1096 days for day
        and 5479 days for week; month, quarter and year are unlimited.
        Finished periods are cached; the period holding the time of
        the request is counted afresh on each request, and periods
        after it are zero.
      security:
        - session: []
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [minute, hour, 4h, day, week, month, quarter, year]
        - name: start
          in: query
          required: true
          description: The range's start, a unix time (seconds, at least 0).
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: end
          in: query
          required: true
          description: >-
            The range's end: a unix time (seconds), or now for the time
            of the request, which makes the series live.
          schema:
            type: string
            pattern: '^(now|[0-9]+)$'
      responses:
        '200':
          description: The series.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSeries'
        '400':
          description: >-
            An unknown period, a start or end that is not a unix time
            (or now for end) or lies past the year 9999, a start not
            before the end, or a range longer than the period's limit
            (error bad_request, with a message; for a range over the
            limit the message of dashboard.range_too_long).
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/account/preferences:
    get:
      operationId: getPreferences
      tags: [account]
      summary: The account's preferences, pins and saved searches
      description: >-
        The preferences page's data: the preferences as stored (null is
        the site default), the time zones offered (any IANA zone is
        accepted), the landing pages the viewer may open, its pinned
        groups that it may see and its saved searches.
      responses:
        '200':
          description: The preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesProps'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
    put:
      operationId: putPreferences
      tags: [account]
      summary: Save the account's preferences
      description: >-
        Replaces every preference; null (or a missing field) is the
        site default. A field that is not a preference, or a value its
        key does not take, refuses the whole body with 400 bad_request
        naming the key in `field`: timezone an IANA zone name,
        date_format 24h, 12h or iso, lang en or id, theme system, light
        or dark, sidebar open or collapsed, dashboard_numbers exact or
        compact, rows_per_page 25, 50 or 100, dashboard_period a period
        of getDashboardSeries, dashboard_variant bars, line, area or
        total, dashboard_start and dashboard_end unix times from 0 to
        the end of the year 9999, dashboard_last a number of seconds from
        1 to the same bound,
        landing a path on this
        site (one leading slash, at most 255 bytes), chat_media auto or
        click, the chat_* switches booleans. The dashboard's range is
        checked as a whole too, with the stored preferences for the keys
        the body leaves out (PATCH): dashboard_start and dashboard_end
        are both set or both null, the start before the end, and the
        fixed range or dashboard_last at most the limit of the period
        in effect (getDashboardSeries); otherwise 400 bad_request with
        field dashboard_start, dashboard_end or dashboard_last. The
        viewer of the next page data carries the settings in effect
        (web/docs/settings.md).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prefs'
      responses:
        '200':
          description: The saved preferences.
          content:
            application/json:
              schema:
                type: object
                required: [prefs]
                properties:
                  prefs:
                    $ref: '#/components/schemas/Prefs'
        '400':
          description: A malformed body, an unknown key or a refused value (error bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
    patch:
      operationId: patchPreferences
      tags: [account]
      summary: Change some of the account's preferences
      description: >-
        Changes only the preferences the body names, each as PUT takes
        it (null is the site default again); the others stay as stored,
        so a control saving one key (the theme toggle, the menu's
        collapse) cannot undo a save of other keys made at the same
        time. The same refusals as PUT, for the keys given. Answers
        every preference as now stored.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prefs'
      responses:
        '200':
          description: Every preference, as now stored.
          content:
            application/json:
              schema:
                type: object
                required: [prefs]
                properties:
                  prefs:
                    $ref: '#/components/schemas/Prefs'
        '400':
          description: A malformed body, an unknown key or a refused value (error bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/account/pinned/{group_id}:
    put:
      operationId: pinGroup
      tags: [account]
      summary: Pin a group
      description: >-
        Pins a group the viewer may see to the top of its menu
        (Viewer.pinned), after the ones pinned before. A group that
        does not exist or that the request scope hides answers 404. An
        account keeps at most 50 pins (400 too_many); a pin of a group
        the viewer can no longer see is kept, counts, and shows nowhere.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: Pinned (also when it already was; it keeps its place).
        '400':
          description: The account has 50 pins already (error too_many).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: unpinGroup
      tags: [account]
      summary: Unpin a group
      description: >-
        404 when the group is not pinned, or when the request scope
        hides it, like a group that does not exist.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: Unpinned.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/account/saved-searches:
    post:
      operationId: saveSearch
      tags: [account]
      summary: Save a search
      description: >-
        title is trimmed and must keep 1 to 128 characters; url must be
        a path on this site (one leading slash, no backslash or control
        character) of at most 2048 bytes. Otherwise 400 bad_request
        names the field. An account keeps at most 100 (400 too_many).
        The preferences page lists them.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, url]
              properties:
                title:
                  type: string
                url:
                  type: string
                  description: The search page's path and query string.
      responses:
        '201':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Created'
        '400':
          description: >-
            A refused title or url (error bad_request, with field), or
            the account has 100 already (error too_many).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'

  /api/account/saved-searches/{id}:
    delete:
      operationId: deleteSavedSearch
      tags: [account]
      summary: Delete a saved search
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/account/sessions:
    get:
      operationId: listSessions
      tags: [account]
      summary: The account's sessions
      description: >-
        Every live session of the account, this one first, then by last
        use: the sessions page's data (web/docs/settings.md). A session
        signed in on the Drogon web is listed once it has reached this
        service. device is a short description of the browser's
        User-Agent, ip the address of its last use, place empty (no
        location source yet); started and last are UTC.
      responses:
        '200':
          description: The sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsProps'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/account/sessions/{id}:
    delete:
      operationId: endSession
      tags: [account]
      summary: Sign out one of the account's other sessions
      description: >-
        That session ends on both web services. Ending this browser's
        own session signs it out and clears its cookie. An id that is
        not one of the account's live sessions answers 404.
      security:
        - session: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          description: The session's id from the sessions page.
          schema:
            type: string
      responses:
        '204':
          description: That session is signed out.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/account/sessions/sign-out-others:
    post:
      operationId: endOtherSessions
      tags: [account]
      summary: Sign out every other session of the account
      description: >-
        Every other session ends on both web services, listed or not,
        as after a password change. This one stays signed in with a new
        cookie, and its CSRF token changes: send the answered one from
        now on.
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: Every other session is signed out; this one stays.
          headers:
            Set-Cookie:
              description: tgw_session, reissued.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'

  /api/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: The accounts the viewer manages
      description: >-
        A superadmin gets every account, an admin the members filed in
        a federation it administers, by username (web-accounts.md
        sections 2 and 3). To a member the accounts administration does
        not exist (404).
      parameters:
        - name: role
          in: query
          required: false
          description: Only accounts of this role.
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: The accounts.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountRow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Gate'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create an account
      description: >-
        A superadmin creates any role. An admin creates members only,
        and must file them in at least one federation it administers
        (grants), since it manages only the members of its federations
        (web-accounts.md sections 2 and 3).


        The first password (decisions/2026-11-18-email-optional.md):
        the one the creator types (password, at least 8 bytes), or,
        with password absent or empty, a random temporary one the
        server generates, answered once here as temporary_password and
        never stored or logged in plain text. Either way the account
        must change it at its first sign-in (see Gates). Instead, with
        "invite": true, the account gets no password and a
        set-password link (an invitation, see Email links) goes to its
        address, valid for WEBAPI_INVITE_LINK_TTL; setting the password
        from it verifies the address, and resendInvite sends a new one.
        An invitation needs an address (409 no_email) and mail (409
        mail_off), and takes no password (400). The address is
        optional otherwise.


        A grant files the member in a federation (fed 0 is Default)
        and grants it group_ids there, groups of that federation
        (checked as updateAccount checks them). A superadmin may name
        any federation, and its member without grants is filed in
        Default (grants [] files it in none, which leaves it to
        superadmins). Audited as account_create, with the federations
        and the granted groups, without the password.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreated'
        '400':
          description: >-
            A malformed body or role (error bad_request), a username
            that is not 1 to 64 letters, digits, dots, dashes or
            underscores starting with a letter or digit (bad_username),
            a name over 128 characters or with control characters
            (bad_name), not an address (bad_email), a typed password
            under 8 bytes (weak_password), an admin's member
            without grants (grants_required), a federation that does
            not exist (bad_federation), or a group in a grant that is
            not one of its federation's (bad_request, field grants).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: >-
            The CSRF token is wrong (error csrf), the role or a
            federation is not the viewer's to give (error forbidden),
            or a gate is up (see Gates).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The username is taken (error taken), the address is
            another account's (error email_taken), or an invitation was
            asked for without an address (error no_email) or without
            mail set up (error mail_off).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: One account the viewer manages
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The account as the accounts page shows it.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRow'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Gate'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Change an account
      description: >-
        Changes the fields given: name, email, role, an admin's
        federations (admin_of) and restrictions, a member's grants
        (its federations and the groups granted in them) and abilities.
        A role change ends the account's sessions on both services, and
        drops what belonged to the old role: a member made admin leaves
        its federations, and its grants and abilities go; an admin made
        member administers none, loses its restrictions and is filed in
        Default, with no groups granted, unless grants say otherwise.


        admin_of and restrict are a superadmin's to send (403
        otherwise); admin_of is for admins (an empty list for anyone).
        grants replace the member's federations among those the viewer
        administers, all of them for a superadmin; the others stay. A
        grant naming a federation files the member in it, and leaving
        a federation out unfiles the member there, which drops the
        groups granted there. group_ids replaces the groups granted in
        that federation: each must be a group of the federation (its
        groups; for Default, a group of the archive that no other
        federation holds) that the viewer sees, else 400 bad_request
        with field grants. A grant of a federation the member is in
        already and the viewer does not administer passes, so the
        accounts page can send the member's whole list, and changes
        nothing there, its group_ids included; one that files it in a
        federation the viewer does not administer answers 403. From the
        member's next request it sees exactly its granted groups, the
        union over its federations, and the people who appear in them
        (web-accounts.md section 5). A grant goes when its group leaves
        the federation (for Default: joins another federation), when
        the member leaves the federation, and when the account stops
        being a member. abilities (forward, fetch_files, mcp_tokens) replace a
        member's abilities; they are for an account that is, or this
        change makes, a member (400 bad_request otherwise), and an
        unknown one answers 400 bad_request with field abilities. A
        superadmin, and an admin managing the member, sets them. restrict.hide_private hides private chats and
        their messages from an admin at once (every private page, chat,
        search and count answers 404 or leaves them out); it is for an
        account that is, or this change makes, an admin (400
        bad_request otherwise), and it is cleared when an admin becomes
        another role. restrict.hide_groups (group ids) replaces the
        groups hidden from an admin: from its next request they are in
        no list, search, count or chat search, their pages and APIs
        answer 404, and messages elsewhere that refer to them (posted
        as, forwarded from, replying from one) do not name them. A
        non-empty list is for an admin as hide_private is, a group the
        archive does not have answers 400 bad_request with field
        hide_groups, and the list is cleared when an admin becomes
        another role. Exposed groups stay public. restrict.join_chat
        grants an admin Join chat (off by default): from its next
        request the join_chat page and menu entry are its, and
        previewJoin and joinChat answer it; without it they answer 404.
        It is for an admin as hide_private is, and it is cleared when an
        admin becomes another role. Superadmins always may join chats,
        and an admin cannot grant it, as it sends no restrict at all.


        The address is an account's own to change (changeEmail); an
        empty one removes it. An admin may correct another account's
        only while that account is invited (its password not set yet),
        and then, with mail, the invitation goes to the new address and
        earlier ones stop working. A superadmin may change any
        account's, for one that lost its mailbox; the new address is
        unverified and, with mail, gets a verification link. A changed
        address is told to the old one if it was verified, and a
        changed role to the account's verified address (when mail is
        set up). Audited as account_update, naming the fields changed,
        the federations, the granted groups of each federation changed
        and the abilities, before and after.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
      responses:
        '200':
          description: The account as the accounts page shows it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRow'
        '400':
          description: >-
            A malformed body or role, or admin_of, grants or
            abilities for an account of another role (error
            bad_request), a group in a grant that is not its
            federation's (bad_request, field grants), an unknown
            ability (bad_request, field abilities), bad_name,
            bad_email, a federation that does not exist
            (bad_federation), or a restriction (hide_private, a
            hidden group or join_chat) for an account that does not
            end as an admin (bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: >-
            The CSRF token is wrong (error csrf), the change is not
            the viewer's to make, such as an admin changing the address
            of an account that is not invited (error forbidden), or a
            gate is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The change would demote the last active superadmin (error
            last_superadmin), or the address is another account's
            (error email_taken).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/accounts/{id}/disable:
    post:
      operationId: disableAccount
      tags: [accounts]
      summary: Disable an account
      description: >-
        Accounts are disabled, never deleted. Its sessions end on both
        services; it can no longer sign in, and its links stop working.
        Its forwarding keeps running, and the forwarding lists answer it
        as an owner that is not active ("owner disabled"). The account's
        verified address is told (a security notice). Audited as
        account_disable; disabling a disabled account changes nothing
        and tells nothing.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Disabled.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LastSuperadmin'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/accounts/{id}/enable:
    post:
      operationId: enableAccount
      tags: [accounts]
      summary: Enable a disabled account
      description: Audited as account_enable.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Enabled.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/accounts/{id}/password-reset:
    post:
      operationId: resetAccountPassword
      tags: [accounts]
      summary: Reset an account's password
      description: >-
        Every session of the account ends on both services. Two answers
        (decisions/2026-11-18-email-optional.md): when the account has
        a verified address and mail is set up, its password is removed
        and a set-password link (see Email links) goes to the address,
        valid for WEBAPI_INVITE_LINK_TTL, and the account signs in
        again once it has set a new one ({"link_sent": true});
        otherwise the account gets a random temporary password,
        answered once here and never stored or logged in plain text,
        which it must change at its next sign-in ({"link_sent": false,
        "temporary_password": "..."}). Audited as
        account_password_reset, without the password.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The link is on its way, or the temporary password, shown once.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordReset'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/accounts/{id}/resend-invite:
    post:
      operationId: resendInvite
      tags: [accounts]
      summary: Email a new set-password link to an invited account
      description: >-
        For an account that has not set its own password yet (invited:
        a new account, one whose password was reset by link, or one
        with a password set for it): a new set-password link to its
        address, valid for WEBAPI_INVITE_LINK_TTL. Earlier ones stop
        working. The address need not be verified: setting the password
        from the link verifies it. Audited as account_invite_resend.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: The link is on its way; earlier ones stop working.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The account has set its own password (error not_invited;
            reset it instead), has no address (error no_email), or mail
            is not set up (error mail_off).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/accounts/{id}/sign-out-everywhere:
    post:
      operationId: signOutAccountEverywhere
      tags: [accounts]
      summary: End every session of an account
      description: >-
        On both services, by moving the account's session_epoch on;
        the viewer's own sessions too when it is the viewer's account.
        Audited as account_signout_everywhere.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Every session of the account has ended.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/federations:
    post:
      operationId: createFederation
      tags: [accounts]
      summary: Create a federation
      description: >-
        Superadmins only; anyone else gets 404. name is required;
        group_ids are groups of the logger and admin_ids accounts with
        the admin role (superadmins administer every federation
        without being listed). A group may be in several federations;
        the groups put into one leave Default. The new id is the
        highest so far plus one. Audited as federation_create.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationWrite'
      responses:
        '201':
          description: Created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Created'
        '400':
          description: >-
            A malformed body or more than 50000 groups (error
            bad_request), a name that is empty, over 64 characters or
            with control characters (bad_name), a description over 2000
            characters or with control characters other than newline
            and tab (bad_description), an id that is no group
            (bad_group), or an account that is not an admin
            (bad_admin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another federation has the name (error taken).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/federations/{id}:
    get:
      operationId: getFederation
      tags: [accounts]
      summary: A federation's details
      description: >-
        The federation page's props (route federation,
        /settings/federations/{id}): the federation with its
        description, creator and how many of its groups the viewer
        sees, its admins and members, the first page of its groups (as
        getFederationGroups answers it without q and cursor) and what
        the viewer may change of it. A superadmin sees every
        federation, an admin the ones it administers; anyone else gets
        404, as for a federation that does not exist. Groups hidden
        from an admin are neither listed nor counted.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The federation.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationDetailProps'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Gate'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
    patch:
      operationId: updateFederation
      tags: [accounts]
      summary: Change a federation
      description: >-
        A superadmin changes any federation. An admin of the
        federation (one it administers) may send name and description
        only; group_ids or admin_ids from it answer 403 forbidden.
        Anyone else gets 404, as does a federation that does not exist
        or that the admin does not administer. The fields given replace
        the federation's
        name, description, groups and admins; the others stay. A group
        taken out of its last federation is back in Default. The
        Default federation (id 0) is derived, the groups in no other
        federation, so it takes description and admin_ids only (and
        its own name back unchanged); a new name for it answers 400
        bad_request, whoever sends it. Audited as federation_update,
        with what changed (for the description, only that it was set
        or cleared) and the account that changed it.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationWrite'
      responses:
        '200':
          description: Changed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Created'
        '400':
          description: >-
            As for createFederation, or groups or a new name for
            Default (error bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: >-
            The CSRF token is wrong (error csrf), an admin of the
            federation sent group_ids or admin_ids (error forbidden),
            or a gate is up (see Gates).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another federation has the name (error taken).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
    delete:
      operationId: deleteFederation
      tags: [accounts]
      summary: Delete a federation
      description: >-
        Superadmins only; anyone else gets 404, as does a federation
        that does not exist. Its groups go back to Default unless
        another federation holds them, its admins stop administering
        it, and a member it was the only federation of is filed in
        Default. Default itself cannot be deleted. Audited as
        federation_delete.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '400':
          description: The Default federation (error bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/federations/{id}/groups:
    get:
      operationId: getFederationGroups
      tags: [accounts]
      summary: A federation's groups, page by page
      description: >-
        The federation's groups that the viewer's scope shows, busiest
        first (by message count, then by id, both descending); for
        Default, the groups in no other federation. q keeps the groups
        whose title or active username contains it, without regard to
        case (a leading @ is ignored); total counts every group that
        matches, on every page. Groups hidden from an admin are never
        listed nor counted. Who sees a federation is as for
        getFederation (404 otherwise). Paged by an opaque cursor.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: The next_cursor of the previous page.
          schema:
            type: string
      responses:
        '200':
          description: A page of groups; next_cursor is null on the last.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationGroupsPage'
        '400':
          description: >-
            A malformed limit or cursor, or a q over 512 bytes (error
            bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Gate'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/forwarding/telegram-discord:
    post:
      operationId: createT2D
      tags: [forwarding]
      summary: Add a Telegram to Discord webhook
      description: >-
        For viewers with the forward ability (superadmins and admins
        today); anyone else gets 404, and so does a chat the logger has
        not seen or the viewer may not see. chat_kind must match the
        chat id (group negative, user positive). federation_id is
        needed only when the chat is held by more than one federation
        to choose from (GET /api/forwarding/federations): 400
        federation_required without it, 400 bad_federation for one that
        is not a choice. The viewer becomes its owner. Audited as
        fwd_t2d_create, without the URL, and owner_set.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/T2DCreate'
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Created'
        '400':
          $ref: '#/components/responses/BadWebhook'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/forwarding/telegram-discord/test:
    post:
      operationId: testT2D
      tags: [forwarding]
      summary: Send a test message to a webhook
      description: >-
        To a saved webhook (id) or a URL being entered (webhook_url),
        which must be a Discord webhook URL; a saved URL is checked
        again. Changes nothing and is not audited. The answer never
        carries the URL.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [id]
                  properties:
                    id:
                      type: integer
                      format: int64
                - type: object
                  required: [webhook_url]
                  properties:
                    webhook_url:
                      type: string
      responses:
        '204':
          description: Discord accepted the message.
        '400':
          $ref: '#/components/responses/BadWebhook'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Discord refused the message or did not answer (error send_failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/forwarding/telegram-discord/{id}:
    patch:
      operationId: updateT2D
      tags: [forwarding]
      summary: Change a Telegram to Discord webhook
      description: >-
        The fields given change, the others stay. A new chat comes with
        its chat_kind, checked as on creation (404 for one the logger
        has not seen or the viewer may not see). The webhook URL is
        write-only; leave it out to keep it. Audited as fwd_t2d_update.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: integer
                  format: int64
                chat_kind:
                  type: string
                  enum: [group, user]
                types:
                  $ref: '#/components/schemas/T2DTypes'
                enabled:
                  type: boolean
                webhook_url:
                  type: string
      responses:
        '204':
          description: Changed.
        '400':
          $ref: '#/components/responses/BadWebhook'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteT2D
      tags: [forwarding]
      summary: Delete a Telegram to Discord webhook
      description: Audited as fwd_t2d_delete.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/forwarding/telegram-discord/{id}/transfer:
    post:
      operationId: transferT2D
      tags: [forwarding]
      summary: Give a webhook to another owner
      description: >-
        Admins and superadmins give a webhook to one of its
        transfer_candidates (Owned); anyone else is 400 bad_request,
        and to a member the operation does not exist (404), as for a
        webhook it may not see. A webhook without an owner gets its
        first one. It keeps forwarding, in the same federation.
        Audited as fwd_t2d_transfer, with owner_transfer (or
        owner_set).
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transfer'
      responses:
        '204':
          description: Transferred.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/forwarding/discord-telegram:
    post:
      operationId: createD2T
      tags: [forwarding]
      summary: Add a Discord to Telegram route
      description: >-
        The viewer becomes its owner. The route is read by the Discord
        bot discord_bot_id and sent through the Telegram bot
        telegram_bot_id, both bots the viewer may use (GET /api/bots);
        no token is typed on a route. The chat is a group, a channel or
        a private chat (a positive chat_id). Refusals: 400 bad_channel
        (not a Discord id), bad_request (a bot of the other kind, a
        missing field), federation_required and bad_federation as on
        Telegram to Discord; 404 for a chat or a bot the viewer may not
        use; 409 duplicate when the channel already forwards to the
        chat. federation_id is needed only when the chat is held by
        more than one federation to choose from (GET
        /api/forwarding/federations). Audited as fwd_d2t_create and
        owner_set.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/D2TCreate'
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/forwarding/discord-telegram/{id}:
    patch:
      operationId: updateD2T
      tags: [forwarding]
      summary: Change a Discord to Telegram route
      description: >-
        The fields given change, the others stay: the channel, the chat
        and either bot too, each checked as on creation (409 duplicate
        when the channel already forwards to the new chat). The bots
        the route had stay, for other routes. Audited as
        fwd_d2t_update.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discord_channel_id:
                  type: string
                chat_id:
                  type: integer
                  format: int64
                types:
                  $ref: '#/components/schemas/D2TTypes'
                enabled:
                  type: boolean
                discord_bot_id:
                  type: integer
                  format: int64
                telegram_bot_id:
                  type: integer
                  format: int64
      responses:
        '204':
          description: Changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteD2T
      tags: [forwarding]
      summary: Delete a Discord to Telegram route
      description: >-
        A route that has sent messages is refused (409 in_use): those
        rows map Discord messages to their Telegram copies for replies
        and edits; disable it instead. Audited as fwd_d2t_delete.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/forwarding/discord-telegram/{id}/transfer:
    post:
      operationId: transferD2T
      tags: [forwarding]
      summary: Give a route to another owner
      description: >-
        Admins and superadmins give a route to one of its
        transfer_candidates (Owned); anyone else is 400 bad_request,
        and to a member the operation does not exist (404), as for a
        route it may not see. A route without an owner gets its first
        one. It keeps forwarding, in the same federation. Giving it to
        a member needs both its bots to be the member's (409
        bot_not_owned): a member uses only its own bots. Audited as
        fwd_d2t_transfer, with owner_transfer (or owner_set).
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transfer'
      responses:
        '204':
          description: Transferred.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/forwarding/federations:
    get:
      operationId: fwdFederations
      tags: [forwarding]
      summary: The federations a new configuration of a chat may go into
      description: >-
        For the create forms, once a chat is picked: the federations
        holding the chat that the viewer may file a configuration into,
        Default first. The federations holding a group are those whose
        groups it is in, or Default when it is in none; a private chat
        is held by Default. Of those, the viewer's own: for a
        superadmin all of them, for an admin those it administers, for
        a member those in which the group is granted to it. When none
        is the viewer's own, every federation holding the chat. With
        more than one the form asks, and create needs federation_id;
        with one, create files the configuration there by itself. A
        chat the logger has not seen or the viewer may not see is 404,
        and so is the operation to a viewer without the forward
        ability.
      parameters:
        - name: chat_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The choices.
          content:
            application/json:
              schema:
                type: object
                required: [federations]
                properties:
                  federations:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/FedRef'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/bots:
    get:
      operationId: listBots
      tags: [forwarding]
      summary: The bots the viewer may use
      description: >-
        For the bot pickers of the route forms: a member with `forward`
        gets its own bots, admins and superadmins every bot
        (decisions/2026-11-18-ownership-and-bots.md). Others get 404.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BotKind'
      responses:
        '200':
          description: The bots.
          content:
            application/json:
              schema:
                type: object
                required: [bots]
                properties:
                  bots:
                    type: array
                    items:
                      $ref: '#/components/schemas/BotRef'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createBot
      tags: [forwarding]
      summary: Add a bot
      description: >-
        The viewer becomes its owner; it starts connecting. The token is
        write-only and never answered. Re-adding one of the viewer's own
        bots answers that bot. Refusals: 400 bad_token (its shape), 400
        bad_request (a name that is empty or over 64 characters); 409
        token_in_use when another account has the bot, without saying
        which. Audited as bot_create, without the token.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotCreate'
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/bots/{id}:
    patch:
      operationId: updateBot
      tags: [forwarding]
      summary: Rename, enable or disable a bot, or replace its token
      description: >-
        One of the viewer's bots (any bot for admins and superadmins);
        others answer 404. Audited as bot_update, without the token.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotUpdate'
      responses:
        '200':
          description: The bot as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteBot
      tags: [forwarding]
      summary: Remove a bot
      description: >-
        Refused with 409 bot_in_use, with a message saying how many
        routes use it, while Discord to Telegram routes use the bot.
        Audited as bot_delete.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/bots/{id}/transfer:
    post:
      operationId: transferBot
      tags: [forwarding]
      summary: Give a bot to another owner
      description: >-
        Admins and superadmins, to one of the bot's transfer_candidates;
        a member gets 404. A route whose owner no longer owns its bots
        keeps working; giving a route to a member needs both its bots to
        be the member's (409 bot_not_owned on the route's transfer).
        Audited as bot_transfer.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transfer'
      responses:
        '204':
          description: Transferred.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/join-chat/preview:
    post:
      operationId: previewJoin
      tags: [join-chat]
      summary: Look up a group or channel before joining it
      description: >-
        Read-only on the account, but behind CSRF since each lookup
        costs a rate-limited Telegram request (web/docs/join-chat.md).
        A lookup that found nothing still answers 200, with chat null
        and the reason in message. For superadmins and admins holding
        join_chat; anyone else gets 404.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref]
              properties:
                ref:
                  type: string
                  description: An invite link or a public username, at most 256 bytes.
      responses:
        '200':
          description: The outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinOutcome'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/DaemonFailed'

  /api/join-chat/join:
    post:
      operationId: joinChat
      tags: [join-chat]
      summary: Join a group or channel
      description: >-
        For superadmins and admins holding join_chat (restrict.join_chat,
        granted by a superadmin); anyone else gets 404. Writes one chat_join audit row whatever comes of it, once
        the request passes its checks (web/docs/join-chat.md). A joined
        group is added to the chosen federations, which must be ones
        the viewer administers (404 otherwise, before anything is
        joined); none leaves it in Default (web-accounts.md section 3).
        The group is filed when the outcome is joined; after
        request_sent or approval_required the choice is held
        (filing_pending) and applied once the account is a member. A
        group the account was already in (already_member) is not
        filed: moving an existing group is the federation editor's.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref]
              properties:
                ref:
                  type: string
                federation_ids:
                  type: array
                  description: >-
                    The federations to file the joined group into; 0
                    (Default) and none leave it in Default.
                  items:
                    type: integer
                    format: int64
      responses:
        '200':
          description: The outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinOutcome'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/DaemonFailed'

  /api/join-chat/pending/{id}:
    delete:
      operationId: cancelJoinFiling
      tags: [join-chat]
      summary: Drop a held filing of a group not yet joined
      description: >-
        Drops one held filing (JoinChatProps.pending), so the group is
        not filed into that federation when the account becomes a
        member. Admins drop their own, superadmins any. Audited
        (chat_join_cancel). Anyone else, and an id that is not held
        or not the viewer's, gets 404.
      security:
        - session: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Dropped.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/lookup-name:
    post:
      operationId: lookupName
      tags: [contacts]
      summary: Look up a contact's own name
      description: >-
        "Look up real name" (web/docs/contact-names.md): the daemon
        removes the contact, reads the name the user gave itself and
        adds the contact back exactly as it was. It changes the logging
        account's contacts, so it is for superadmins only; anyone else,
        and a user the viewer may not see or the logger never saw, gets
        404. A user the logger does not record as a contact is 409
        not_a_contact before the daemon is asked. Otherwise the daemon's
        answer is passed on: its errors (docs/internal-api.md) keep
        their code, with the status 404 not_found, 409 not_a_contact or
        unsupported, 429 rate_limited or flood_wait, 503 unavailable or
        restore_pending, 504 timeout, 502 telegram_error, and
        Retry-After when the daemon sent one; any other failure is 502
        daemon. Every request that reaches the daemon writes one
        contact_lookup audit row, "user <id>: ok" or the error code.
      security:
        - session: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          description: The user's Telegram id.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The own name, now stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupName'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: The daemon allows no lookup now (error rate_limited or flood_wait).
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/DaemonFailed'
        '503':
          description: >-
            The daemon is busy or not connected (error unavailable), or a
            contact is removed and not added back yet (error
            restore_pending).
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: >-
            The contact is added back, but Telegram did not report the
            own name in time (error timeout); nothing was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/mcp/groups:
    post:
      operationId: exposeMcpGroup
      tags: [mcp]
      summary: Expose a group through the MCP endpoint
      description: >-
        For viewers with the mcp ability (superadmins and admins
        today), and only groups the viewer may see (web-accounts.md
        section 4): a hidden or unknown group is 404. The note is cut
        to 255 characters. A group already exposed is 409
        already_exposed; its note changes by setMcpGroupNote. Exposing also makes the group's chat public on the web
        (web/docs/mcp.md). Audited as mcp_expose.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id]
              properties:
                group_id:
                  type: integer
                  format: int64
                note:
                  type: string
      responses:
        '201':
          description: Exposed.
          content:
            application/json:
              schema:
                type: object
                required: [group_id]
                properties:
                  group_id:
                    type: integer
                    format: int64
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/mcp/groups/{group_id}:
    delete:
      operationId: unexposeMcpGroup
      tags: [mcp]
      summary: Stop exposing a group
      description: >-
        A group the viewer may not see, or one not exposed, is 404.
        Audited as mcp_unexpose.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: No longer exposed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: setMcpGroupNote
      tags: [mcp]
      summary: Change the note of an exposed group
      description: >-
        Under the same permission as exposeMcpGroup. The note is
        trimmed and cut to 255 characters; an empty one clears it. Who
        exposed the group and when stay as they are. A group the
        viewer may not see, or one not exposed, is 404; a body without
        note is 400. Audited as mcp_note, with the old and the new
        note; an unchanged note is not audited.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
      responses:
        '204':
          description: The note is saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/mcp/tokens:
    post:
      operationId: createMcpToken
      tags: [mcp]
      summary: Create an MCP bearer token
      description: >-
        For viewers holding mcp_tokens: superadmins, admins, and members
        given it; anyone else gets 404. The token (tgmcp_ and 64 hex
        digits) is in this answer only; it is stored as its SHA-256 and
        in no log or audit row. The name, 1 to 64 characters after
        trimming, tells tokens apart. owner_id names the account that
        will own it, one of McpTokensProps.owners (the viewer when left
        out): a superadmin mints for any active account that may hold
        tokens, an admin for itself or an active member it manages that
        holds mcp_tokens, a member only for itself; any other owner_id
        is 400 bad_request. The token is always minted by the viewer,
        which stays the account its requests are attributed to
        (minted_by): disabling that account disables the token. Audited
        as mcp_token_create, with the name, and owner_set.


        scope narrows what the token reads (McpScopeWrite; left out or
        empty, it reads every exposed group). It is checked as
        renameMcpToken checks it and, when not empty, audited as
        mcp_token_scope as well.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                owner_id:
                  type: integer
                  format: int64
                scope:
                  $ref: '#/components/schemas/McpScopeWrite'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [id, token]
                properties:
                  id:
                    type: integer
                    format: int64
                  token:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: >-
            The CSRF token is missing or wrong (error csrf), a gate is
            up, or the scope names a private chat the viewer may not
            give this token (error forbidden: the viewer is not a
            superadmin, or the token's owner is not one); message says
            which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/mcp/tokens/{id}:
    patch:
      operationId: renameMcpToken
      tags: [mcp]
      summary: Rename an MCP bearer token, or set its scope
      description: >-
        For whoever manages the token (see revokeMcpToken); a token the
        viewer does not manage is 404 like an unknown one. The body
        carries name, scope or both; with neither it is 400
        bad_request. The name is trimmed and cut to 64 characters and
        must not end up empty (400 bad_request). A revoked token can be
        renamed too. An unchanged name answers 204 and audits nothing; a
        change is audited as mcp_token_rename, with the old and the new
        name.


        scope replaces the token's scope as a whole (McpScopeWrite; an
        empty list makes it read every exposed group again). An entry
        of an unknown kind, with an id of the wrong sign, naming a
        federation that does not exist, a group the viewer cannot see
        or an unknown user, or more than 200 entries, is 400
        bad_request, and nothing is changed. A private entry is
        written only by a superadmin, on a token owned by a superadmin
        or without an owner record; anyone else is 403 forbidden, so an
        admin editing a token that still holds an inactive private
        entry drops it to save. An unchanged scope audits nothing; a
        change is audited as mcp_token_scope, with the entries
        written. The scope is applied from the token's next request
        on.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scope:
                  $ref: '#/components/schemas/McpScopeWrite'
      responses:
        '204':
          description: Renamed, or its scope set.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: >-
            The CSRF token is missing or wrong (error csrf), a gate is
            up, or the scope names a private chat the viewer may not
            give this token (error forbidden: the viewer is not a
            superadmin, or the token's owner is not one); message says
            which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/mcp/tokens/{id}/revoke:
    post:
      operationId: revokeMcpToken
      tags: [mcp]
      summary: Revoke an MCP bearer token
      description: >-
        For whoever manages the token: its owner, an admin when the
        owner is a member it manages (filed in a federation it
        administers), and any superadmin. A token the viewer does not
        manage is 404 like an unknown one, and every token is 404 to an
        account without mcp_tokens. A token without an owner record
        counts as the superadmins'. Stamps the token revoked; the row
        stays for the audit trail. Revoking a revoked token changes
        nothing and answers 204 too. Audited as mcp_token_revoke.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/mcp/tokens/{id}/transfer:
    post:
      operationId: transferMcpToken
      tags: [mcp]
      summary: Give an MCP bearer token to another owner
      description: >-
        Superadmins only (McpTokensProps.can_transfer); anyone else gets
        404. owner_id is one of McpTokensProps.owners: an active account
        that may hold tokens (a superadmin, an admin, or a member
        holding mcp_tokens); any other is 400 bad_request. A revoked
        token can be transferred too. The token keeps working and keeps
        minted_by, the account its requests are attributed to.
        Transferring to the owner it has changes nothing and audits
        nothing. Audited as mcp_token_transfer and owner_transfer
        (owner_set for a token that had no owner record).
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transfer'
      responses:
        '204':
          description: Transferred.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /mcp:
    post:
      operationId: postMcp
      tags: [mcp]
      summary: One MCP message (JSON-RPC 2.0)
      description: >-
        The Model Context Protocol endpoint, read-only, for language
        model clients (web/docs/mcp.md). The body is one JSON-RPC 2.0
        message: a request of initialize, ping, tools/list or
        tools/call, or a notification. The transport is Streamable
        HTTP in its minimal form: every answer is one application/json
        body, there is no SSE stream and no session (no
        Mcp-Session-Id). Protocol 2025-06-18; 2025-03-26 is accepted.


        The tools read only the groups an administrator put on the
        exposure list (telegram_public_groups), narrowed by the token's
        scope when it has one (McpScopeEntry); a superadmin's token may
        also be given private chats, which the message tools then read
        when named by their id. The user tools describe accounts and are
        limited by neither. A tool's failure the caller
        can fix (a bad filter, an unknown id) is a result with isError
        true; a malformed call is a JSON-RPC error. Both are answered
        with 200, and so is a body that is empty or not JSON (error
        -32700).


        Authenticated by an MCP bearer token (tgmcp_ and 64 hex digits,
        made in the MCP administration), in the Authorization header or,
        for clients that can only be given a URL, in the key query
        parameter; the header wins. No session cookie and no CSRF
        token. A refusal is a JSON-RPC error with a null id and no
        WWW-Authenticate header, on purpose (web/docs/mcp.md).
      security:
        - mcpToken: []
        - mcpKey: []
      parameters:
        - name: key
          in: query
          required: false
          description: The token, for clients that cannot set a header.
          schema:
            type: string
        - name: MCP-Protocol-Version
          in: header
          required: false
          description: >-
            The negotiated protocol version. Only its shape is checked
            (YYYY-MM-DD); initialize negotiates the version itself.
          schema:
            type: string
        - name: Origin
          in: header
          required: false
          description: >-
            Checked only when MCP_ALLOWED_ORIGINS is set; any origin is
            accepted otherwise.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpMessage'
      responses:
        '200':
          description: >-
            The JSON-RPC answer: a result, or an error (also for a body
            that is empty, not JSON, a batch or not a JSON-RPC request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAnswer'
        '202':
          description: A notification (or a response) was accepted; no body.
        '400':
          description: MCP-Protocol-Version is not a YYYY-MM-DD date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAnswer'
        '401':
          description: >-
            No token, a malformed one, or one that is unknown, revoked or
            belongs to a disabled account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAnswer'
        '403':
          description: Origin is not in MCP_ALLOWED_ORIGINS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAnswer'
        '413':
          description: The body is larger than 1 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAnswer'
        '500':
          description: The tokens could not be checked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAnswer'
    get:
      operationId: getMcp
      tags: [mcp]
      summary: Declined; no server-to-client stream is offered
      description: >-
        Answers 405 with Allow POST, which the protocol provides for a
        server that never initiates messages. Needs no token.
      security: []
      responses:
        '405':
          description: No SSE stream.
          headers:
            Allow:
              description: POST
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
    delete:
      operationId: deleteMcp
      tags: [mcp]
      summary: Declined; the endpoint keeps no sessions
      security: []
      responses:
        '405':
          description: No session to end.
          headers:
            Allow:
              description: POST
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string

  /api/users/{id}/history:
    get:
      operationId: getUserHistory
      tags: [history]
      summary: A page of a user's change timeline
      description: >-
        The user's names, usernames (every event: added, removed,
        reordered, kind or collectible changed), bios, phone numbers and
        profile photos, newest first, as the user page's history: the
        page carries the first page and history_next, and this answers
        the following ones, from the cursor of the page before. Only for
        a viewer who sees users in full; to a member, as for a user the
        viewer may not see or the logger never saw, it is 404.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          description: The user's Telegram id.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/HistoryBefore'
        - $ref: '#/components/parameters/HistoryLimit'
      responses:
        '200':
          description: The page, and the cursor of the next.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/users/{id}/photos:
    get:
      operationId: getUserPhotos
      tags: [history]
      summary: A user's profile photos, the current one first
      description: >-
        The user's profile photos for the user page's photo carousel,
        at most 500: the current photo (telegram_users.profile_photo_file_id)
        first, then the ones the history records
        (telegram_user_hist_profile_photo) newest first, each file once
        (its newest entry); the photo removals are left out. Opening the
        user page has the daemon add the photos Telegram lists and the
        history lacks, in the background, so a later answer may hold
        more. Each item's id is the photo_id of its photo change in the
        user's history (HistoryEntry), so the timeline can open the
        carousel at that photo; the current photo is item 0 when the
        history has no entry for its file. current_id is the current
        photo's item, the first, or null when the user has no photo.
        A photo whose bytes are not stored has a URL all the same when
        the viewer may have files fetched from Telegram (see url). An
        animated photo also has its video (video_url), for the carousel
        to play with the still as its poster. The same access as the
        history: only for a viewer who sees users in full; to a member,
        as for a user the viewer may not see or the logger never saw,
        it is 404.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          description: The user's Telegram id.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The photos, and which is the current one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPhotos'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/groups/{id}/history:
    get:
      operationId: getGroupHistory
      tags: [history]
      summary: A page of a group's change timeline
      description: >-
        The group's titles, descriptions, usernames (every event),
        photos and admin changes, newest first, as the group page's
        history: the page carries the first page and history_next, and
        this answers the following ones. For a group the viewer sees;
        any other is 404.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          description: The group's Telegram chat id.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/HistoryBefore'
        - $ref: '#/components/parameters/HistoryLimit'
      responses:
        '200':
          description: The page, and the cursor of the next.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/groups/{id}:
    patch:
      operationId: updateGroup
      tags: [groups]
      summary: Change a group's web settings
      description: >-
        Superadmins only: hide_member_list hides a channel's member
        list (GET /api/groups/{id}/members and the group_members page)
        from everyone but the superadmins, who get available false with
        reason hidden in its place, the member count still shown; false
        shows it again (web_hidden_member_lists). Only channels: a
        group's members see each other in Telegram, so a supergroup or
        basic group is 400 bad_request. A group the viewer does not
        see is 404; an admin who sees it gets 403 forbidden. Audited as
        member_list_hide or member_list_show, with the group, when the
        setting changes. The answer is the setting as it now is.
      security:
        - session: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          description: The group's Telegram chat id.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hide_member_list]
              properties:
                hide_member_list:
                  type: boolean
      responses:
        '200':
          description: The setting as it now is.
          content:
            application/json:
              schema:
                type: object
                required: [id, hide_member_list, can_hide_member_list]
                properties:
                  id:
                    type: integer
                    format: int64
                  hide_member_list:
                    type: boolean
                  can_hide_member_list:
                    type: boolean
                    const: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: >-
            The CSRF token is wrong (error csrf), the viewer is not a
            superadmin (error forbidden), or a gate is up (see Gates).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/groups/{id}/members:
    get:
      operationId: getGroupMembers
      tags: [groups]
      summary: A page of a group's members
      description: >-
        The group's members as Telegram lists them to the logging
        account (the daemon's GET /v1/chats/{id}/members, Telegram's
        "recent" order), for the group page's Members tab and its
        background prefetch. For a viewer who sees the group and users
        in full (superadmins and admins); a member, a signed-out
        visitor and a group the viewer does not see get 404, and the
        member count of the group's pages only. The members are named
        from telegram_users, where the daemon stores them; one not
        stored yet is named by its id (type unknown). With q, the
        members matching it instead: Telegram's member search by first
        and last name and username (a basic group's stored members
        filtered the same way), and for a q of only digits (a leading
        - allowed) that user first when a member; each member says how
        it matched (matched_by) and total is the number of matches, or
        null. The id match comes on the first page (offset 0) in
        addition to limit, and later pages leave it out, so a page holds
        up to limit + 1 members: the next page's offset is offset plus
        the members matched_by search. Each page (per group, q, offset
        and limit) is kept for 2 minutes, so a prefetch makes the tab
        instant, except a flood_wait or error answer; the group_members
        page carries the same answer. When the list is not available,
        available is false, members is empty, total is the stored
        member count (null in a search), and reason says why
        (GroupMembersPage).
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          description: The group's Telegram chat id.
          schema:
            type: integer
            format: int64
        - name: offset
          in: query
          description: Members to skip, 0 to 1000000.
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
        - name: limit
          in: query
          description: Members per page, 1 to 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: q
          in: query
          description: >-
            A member search: part of a name or username, or a user id.
            Trimmed, a leading @ dropped; at most 64 characters (400
            when longer or not UTF-8). Empty, or a lone @, is the plain
            list.
          schema:
            type: string
      responses:
        '200':
          description: The page of members, or why there is none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMembersPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Csrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/groups/{id}/photos:
    get:
      operationId: getGroupPhotos
      tags: [history]
      summary: A group's photos, the current one first
      description: >-
        The group's photos for the group page's photo carousel, as
        getUserPhotos answers for a user: the current photo
        (telegram_groups.photo_file_id) first, then the ones the history
        records (telegram_group_hist_photo) newest first, each file
        once, at most 500, the removals left out; opening the group page
        has the daemon add the photos Telegram has that the history
        lacks. Each item's id is the photo_id of its photo change in the
        group's history (GroupHistoryEntry), 0 for a current photo the
        history has no entry for. current_id is the first item's, or
        null when the group has no photo. An animated photo also has
        its video (video_url), as for a user. For a group the viewer sees,
        as the group page and its history; any other, a group hidden
        from an admin included, is 404. Not public, not even for an
        exposed group.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          description: The group's Telegram chat id.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The photos, and which is the current one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPhotos'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/groups/{id}/files:
    get:
      operationId: getGroupFiles
      tags: [groups]
      summary: A page of a group's files
      description: >-
        The files the group's messages carry, by the message that
        carried each, newest message first (by Telegram message id), 50
        a page: the messages of one of the FileKind kinds whose main
        file is their content, or with kind of that kind only. The
        group page's Files tab (route group_files) carries the first
        page of the same list in its props; this answers it and the
        following ones (before = next_before). Each page is one query
        on the group's messages, the senders and the videos' pictures
        in one batch each. For a viewer whose scope sees the group.
        Public for an exposed group (telegram_public_groups), as its
        chat is: a viewer whose scope does not see it (signed out, a
        member not granted it, an admin it is hidden from) gets the same
        list as the public chat shows the group, with its senders named
        and its file links given by the same anonymous rules (a chat
        the viewer does not see is "(hidden chat)"), and the videos'
        pictures from the group's own messages. Any other group is 401
        for a signed-out visitor and 404 for the others, whether or not
        it exists.
      security:
        - {}
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          description: The group's Telegram chat id.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/FileKind'
        - $ref: '#/components/parameters/TabBefore'
      responses:
        '200':
          description: The page, and where the next begins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupFilesPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

  /api/groups/{id}/polls:
    get:
      operationId: getGroupPolls
      tags: [groups]
      summary: A page of a group's polls
      description: >-
        The group's poll messages, newest first (by Telegram message
        id), 50 a page, each with its poll as the chat shows it
        (PollDetail). The group page's Polls tab (route group_polls)
        carries the first page in its props; this answers it and the
        following ones (before = next_before). Each page is one query
        on the group's messages, the senders and the polls in one batch
        each. Who may read it, public for an exposed group, as
        getGroupFiles.
      security:
        - {}
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          description: The group's Telegram chat id.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/TabBefore'
      responses:
        '200':
          description: The page, and where the next begins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupPollsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SessionUnavailable'

components:

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: tgw_session
      description: >-
        The signed session cookie, set by POST /api/login. Valid only
        while it has not expired and its session_epoch is the
        account's; sessions are shared with the Drogon web.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        The session's CSRF token, from GET /api/session, POST
        /api/login or the page's csrf-token meta tag. Required with the
        session on every state-changing request.
    loginCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The pre-login token from GET /api/login.
    loginCookie:
      type: apiKey
      in: cookie
      name: tgw_csrf
      description: The pre-login cookie GET /api/login sets (path /api/login).
    apiToken:
      x-tgd-status: planned
      type: http
      scheme: bearer
      description: >-
        Planned, not accepted yet: per-account API tokens for clients
        that cannot keep cookies or CSRF tokens (native apps, scripts),
        web-accounts.md section 7. How they are issued and what they
        look like is not designed yet; until then the cookie session
        is the only authentication.
    mcpToken:
      type: http
      scheme: bearer
      description: >-
        An MCP bearer token, tgmcp_ and 64 lowercase hex digits, made in
        the MCP administration and stored only as its SHA-256. Accepted
        by /mcp only.
    mcpKey:
      type: apiKey
      in: query
      name: key
      description: >-
        The same token in the query string, for MCP clients that accept
        only a URL. Weaker than the header: a query string reaches proxy
        logs and browser history (web/docs/mcp.md).

  headers:
    NoStore:
      description: no-store
      schema:
        type: string
    LoginCookie:
      description: tgw_csrf, the fresh pre-login token.
      schema:
        type: string
    AcceptRanges:
      description: bytes
      schema:
        type: string
    FileCacheControl:
      description: public, max-age=604800
      schema:
        type: string
    ContentDisposition:
      description: >-
        attachment; filename=<name> for a document that is not
        previewed (a render of file) and for any file asked for with
        download=1; inline; filename=<name> for a document previewed by
        its extension (a render of image, video, audio, pdf or text);
        absent for the other media (photos, videos, voice notes, ...),
        which are shown inline. web/docs/media.md, "Documents".
      schema:
        type: string
    FileNoSniff:
      description: >-
        nosniff, on every file answer, so the browser keeps to the
        Content-Type sent.
      schema:
        type: string
    FileSandbox:
      description: >-
        sandbox; default-src 'none'; img-src 'self'; style-src
        'unsafe-inline', on every answer shown inline (no
        Content-Disposition, or inline) whose Content-Type is not
        video/*, audio/* or application/pdf: images (svg included),
        text, photos and stickers, so an svg or html file opened by its
        URL runs nothing. Not on an attachment, nor on video, audio or
        pdf (the sandbox would stop the browser's own PDF viewer). A
        photo or other media whose file on disk would be typed as html
        or xhtml is sent as text/plain.
      schema:
        type: string

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    GroupId:
      name: group_id
      in: path
      required: true
      description: The group's Telegram chat id.
      schema:
        type: integer
        format: int64
    ChatScope:
      name: scope
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MessageScope'
    TabBefore:
      name: before
      in: query
      required: false
      description: >-
        The message id a page answered as next_before: the messages
        below it. Absent, the newest. Anything but a positive integer
        is 400 bad_request.
      schema:
        type: integer
        format: int64
        minimum: 1
    FileKind:
      name: kind
      in: query
      required: false
      description: >-
        The files of one kind only; all (the default) is every kind.
        Any other value is 400 bad_request.
      schema:
        type: string
        enum: [all, photo, video, animation, audio, voice, document, sticker, video_note]
    HistoryBefore:
      name: before
      in: query
      required: false
      description: >-
        The cursor a page answered as next (history_next on the page):
        the entries after it. Absent, the newest. One that does not
        parse is 400 bad_request.
      schema:
        type: string
    HistoryLimit:
      name: limit
      in: query
      required: false
      description: Entries per page, 100 when absent; 1 to 500, else 400 bad_request.
      schema:
        type: integer
        minimum: 1
        maximum: 500

  responses:
    BadRequest:
      description: A malformed request (error bad_request).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: >-
        No valid session (error unauthenticated); a revoked session
        cookie is cleared.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SessionUnavailable:
      description: >-
        The session could not be checked against the database (error
        unavailable); the cookie is kept.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Csrf:
      description: >-
        The CSRF token is missing or wrong (error csrf), or a gate is
        up (see Gates in the description).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: >-
        No such thing, or one the viewer may not see (error not_found).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gate:
      description: >-
        A gate is up (see Gates in the description): error
        password_change_required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LastSuperadmin:
      description: >-
        The change would leave no active superadmin (error
        last_superadmin).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadWebhook:
      description: >-
        Not a Discord webhook URL (error bad_webhook), or another
        malformed request (error bad_request).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DaemonFailed:
      description: >-
        The daemon gave no outcome: its API is off or unreachable,
        TDLib is not ready, or Telegram did not answer in time (error
        daemon); message says what to do.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: >-
        The change conflicts with what is stored (the error code says
        what; message is the sentence to show).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: Something failed on the server (error internal).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: A machine-readable code (csrf, not_found, ...).
        message:
          type: string
          description: A sentence for a person to read, where there is one.
    FieldError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            field:
              type: string
              description: The key whose value was refused, when one was.
    LoginError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [message, csrf]
          properties:
            message:
              type: string
            csrf:
              type: string
              description: A fresh pre-login token, to try again with.
    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          required: [ro, app]
          properties:
            ro:
              type: string
              enum: [ok, unavailable]
            app:
              type: string
              enum: [ok, unavailable]
    LoginState:
      type: object
      required: [signed_in]
      properties:
        signed_in:
          type: boolean
        csrf:
          type: string
          description: The pre-login token; only when signed_in is false.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    SessionUser:
      type: object
      required: [id, username, role, must_change_password]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        must_change_password:
          type: boolean
          description: >-
            The account signed in with a password set for it (typed by
            its creator, or a temporary one) and must choose its own
            (POST /api/account/password) before anything else; see
            Gates in the description.
    Session:
      type: object
      required: [user, csrf]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        csrf:
          type: string
          description: The session's CSRF token.
        landing:
          type: string
          description: >-
            The account's landing page (its preference, else /): where a
            sign-in without a next page goes.
    CsrfToken:
      type: object
      required: [csrf]
      properties:
        csrf:
          type: string
          description: The session's CSRF token from now on.
    Created:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64

    # Page data (web-ssr.md section 5) and the viewer.
    Role:
      type: string
      enum: [superadmin, admin, member]
    Viewer:
      type: object
      description: >-
        What rendering needs to match the browser. The settings are the
        ones in effect, the account's own or the site's default, for a
        signed-out visitor too (web/docs/settings.md); one missing falls
        back to the client's built-in default. For a signed-out visitor
        account and nav are absent.
      required: [signed_in, now, logger]
      properties:
        signed_in:
          type: boolean
        logger:
          type: [object, 'null']
          description: >-
            The logging account, for every viewer, signed in or not: its
            user row, the account the archive's messages without a sender
            were sent by. Null while the web does not know it (the
            daemon not logged in or not reachable yet) or the archive has
            no row for it.
          required: [id, name, username, photo]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            username:
              type: [string, 'null']
            photo:
              type: [string, 'null']
              description: >-
                Its profile photo, a /files/ URL as other user references
                give it, or null.
        account:
          type: object
          required: [id, username, name, role]
          properties:
            id:
              type: integer
              format: int64
            username:
              type: string
            name:
              type: string
            role:
              $ref: '#/components/schemas/Role'
        now:
          type: string
          format: date-time
          description: The server's clock, for relative times.
        timezone:
          type: string
        date_format:
          type: string
          enum: [24h, 12h, iso]
        lang:
          type: string
          enum: [en, id]
        theme:
          type: string
          enum: [system, light, dark]
        sidebar:
          type: string
          enum: [open, collapsed]
          description: Whether the menu starts open or collapsed (the sidebar preference, else open).
        dashboard_numbers:
          type: string
          enum: [exact, compact]
          description: How the dashboard shows its figures (the dashboard_numbers preference, else exact).
        dashboard_period:
          type: string
          enum: [minute, hour, 4h, day, week, month, quarter, year]
          description: The dashboard chart's period (the dashboard_period preference, else hour).
        dashboard_variant:
          type: string
          enum: [bars, line, area, total]
          description: How the dashboard chart draws its series (the dashboard_variant preference, else bars).
        dashboard_start:
          type: [integer, 'null']
          format: int64
          description: >-
            The start of the chart's fixed range (unix), with
            dashboard_end; absent or null when the range ends now.
        dashboard_end:
          type: [integer, 'null']
          format: int64
          description: >-
            The end of the chart's fixed range (unix); absent or null
            when the range ends now.
        dashboard_last:
          type: [integer, 'null']
          format: int64
          description: >-
            The length in seconds of a range that ends now (the
            dashboard_last preference, else 48 hours, at most the
            period's limit); absent or null for a fixed range.
        rows_per_page:
          type: integer
        nav:
          type: array
          description: The route ids of the pages the menu shows.
          items:
            type: string
        pinned:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id:
                type: integer
                format: int64
              title:
                type: string
              photo:
                type: [string, 'null']
                description: >-
                  The group's photo, a /files/ URL when its bytes are
                  stored, else null.
        chat:
          type: object
          properties:
            auto_load:
              type: boolean
            live:
              type: boolean
            media:
              type: string
              enum: [auto, click]
            show_deleted:
              type: boolean
            show_edited:
              type: boolean
            show_service:
              type: boolean
