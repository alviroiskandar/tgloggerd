<section class="settings">
	<h1>Settings</h1>
	<div class="settings-layout">
		<nav class="settings-nav" aria-label="Settings sections">
			<a href="/settings" class="active">Account</a>
			<!-- Future sections (Appearance, Notifications, ...) go here. -->
		</nav>

		<div class="settings-main">
			<section class="settings-section" id="account">
				<h2>Account</h2>
				<p class="muted">Signed in as <strong>{{ acct_name }}</strong>{% if role != "" %} · {{ role }}{% endif %}.</p>

				<div class="settings-card">
					<h3>Change password</h3>
## if changed
					<p class="settings-flash ok" role="status">✓ Your password has been changed.</p>
## endif
## if error != ""
					<p class="settings-flash err" role="alert">⚠ {{ error }}</p>
## endif
					<form class="settings-form" method="post" action="/settings/password" autocomplete="off">
						<input type="hidden" name="csrf" value="{{ csrf }}">
						<label>Current password
							<input type="password" name="current_password" required autocomplete="current-password">
						</label>
						<label>New password
							<input type="password" name="new_password" required minlength="8" autocomplete="new-password">
						</label>
						<label>Confirm new password
							<input type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
						</label>
						<div class="settings-actions">
							<button type="submit">Change password</button>
						</div>
					</form>
				</div>
			</section>
		</div>
	</div>
</section>
