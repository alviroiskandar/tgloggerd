<form class="search" method="get" action="{{ search.action }}" role="search">
  <select name="field" aria-label="Search field">
## for f in search.fields
    <option value="{{ f.value }}"{% if f.value == search.field %} selected{% endif %}>{{ f.label }}</option>
## endfor
  </select>
  <input type="search" name="q" value="{{ search.q }}"
         placeholder="{{ search.placeholder }}" aria-label="Search query">
  <button type="submit">Search</button>
## if search.q != ""
  <a class="clear muted" href="{{ search.action }}">Clear</a>
## endif
</form>
