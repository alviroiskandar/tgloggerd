networks:
  tg-loggerd:
    driver: bridge
    ipam:
      driver: default
      config:
      - subnet: 10.0.88.0/24
        gateway: 10.0.88.1
    driver_opts:
      com.docker.network.bridge.name: tg-loggerd

services:
  mysql:
    image: mysql:9.0.0
    container_name: tgloggerd-mysql
    restart: unless-stopped
    hostname: tgloggerd-mysql
    mem_reservation: 1024m
    mem_limit: 4096m
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tgloggerd
      MYSQL_USER: tgloggerd
      MYSQL_PASSWORD: tgloggerd
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      tg-loggerd:
        ipv4_address: 10.0.88.3

  # Optional web interface for browsing the database. Build it from the repo
  # root (the build context below is "."), then create the web database, users
  # and grants and seed the first admin — see web/README.web ("Running in
  # Docker"). It reaches MySQL over the tg-loggerd network by service name.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: tgloggerd-web:latest
    container_name: tgloggerd-web
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      WEB_DB_HOST: "10.0.88.3"          # the mysql service above
      WEB_DB_PORT: "3306"
      WEB_DB_RO_USER: "web_ro"
      WEB_DB_RO_PASSWORD: "web_ro"      # change me
      WEB_DB_APP_USER: "web_app"
      WEB_DB_APP_PASSWORD: "web_app"    # change me
      WEB_STORAGE_DIR: "/data/storage/files"
      # No TLS in this minimal example, so the Secure cookie flag is off. Put a
      # TLS-terminating reverse proxy in front and set WEB_SECURE_COOKIE=1.
      WEB_SECURE_COOKIE: "0"
    ports:
      - "8080:8080"
    volumes:
      # Read-only access to the files the daemon downloaded, for /media.
      - ./data/storage/files:/data/storage/files:ro
    networks:
      tg-loggerd:
        ipv4_address: 10.0.88.4
